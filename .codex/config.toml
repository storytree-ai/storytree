[features]
hooks = true

# The MCP server (ADR-0793 D2), run from this checkout's own source, so every worktree
# serves its own code and no installed app is needed. It waits for the session-start install first.
[mcp_servers.storytree]
command = "node"
args = ["packages/base-dev-loop/src/provision-worktree.mjs", "--serve"]
# Codex lanes run with approval_policy "never", which refuses any tool call that asks.
default_tools_approval_mode = "approve"
# run_tests runs a whole suite in one call; Codex would cut it at its 60 s default.
tool_timeout_sec = 1800
