name: Capability list

# On every pull request into main, and in the merge queue, run the capability-list check (ADR-0949 D3):
# a branch that changes a capability its increment does not list fails it, naming each one
# (`node --import tsx packages/repo-checks/src/capability-list.mjs`). The check reads the pull request's
# branch from GITHUB_HEAD_REF and says "not checked" for one that names no increment, which a merge
# queue's branch never does.
#
# It reads the plan from the library on the Mint box through a read-only role (ADR-0952): the job
# joins the tailnet as an ephemeral tag:ci node keylessly, with GitHub's OIDC token and the
# variables TS_WIF_CLIENT_ID and TS_WIF_AUDIENCE as the environment plan-read sets them (its own
# federated credential, whose subject names that environment), and connects as ci_plan_read, which
# may SELECT library_meta and the plan's story, capability, contract, arc and increment records and
# their history, and nothing else: infra/library-host/plan-read-grants.sql, which the repository checks' contract 4.3 runs
# the check's reads under. Its password is the secret PLAN_PG_PASSWORD in the environment plan-read. A pull
# request from this repository or a merge queue run without that secret fails, saying so; a pull
# request from a fork, which GitHub gives no secrets, says "not checked" and passes.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]

# A newer push to the same pull request cancels the run it supersedes.
concurrency:
  group: capability-list-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: capability list
    runs-on: ubuntu-latest
    environment: plan-read
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # GitHub's OIDC token, for the keyless sign-in to the tailnet
    steps:
      # Only whether the password is set enters the step, never its value.
      - name: Check that the read-only role's password is set
        id: settings
        env:
          SET_PLAN_PG_PASSWORD: ${{ secrets.PLAN_PG_PASSWORD != '' }}
          FROM_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ "$SET_PLAN_PG_PASSWORD" = true ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$FROM_FORK" = true ]; then
            echo "not checked: a pull request from a fork is given no plan-read credentials"
          else
            echo "::error::plan-read credentials not set: the environment plan-read has no secret PLAN_PG_PASSWORD, so the capability list cannot be checked (ADR-0952)"
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: steps.settings.outputs.ready == 'true'
        with:
          persist-credentials: false
          fetch-depth: 0 # the check compares the branch with origin/main
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: steps.settings.outputs.ready == 'true'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        if: steps.settings.outputs.ready == 'true'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.settings.outputs.ready == 'true'
      # The box's tailnet address is the host of the repository variable HEALTH_PG_ADDRESS, so it is
      # written in no file.
      - name: Find the Mint box
        id: box
        if: steps.settings.outputs.ready == 'true'
        env:
          HEALTH_PG_ADDRESS: ${{ vars.HEALTH_PG_ADDRESS }}
        run: |
          node -e 'let host = ""; try { host = new URL(process.env.HEALTH_PG_ADDRESS).hostname; } catch {}
            if (!host) { console.error("::error::the repository variable HEALTH_PG_ADDRESS is unset or not an address, so the Mint box cannot be found"); process.exit(1); }
            console.log(`host=${host}`);' >> "$GITHUB_OUTPUT"
      - name: Join the tailnet as CI
        if: steps.settings.outputs.ready == 'true'
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4.3.0
        with:
          oauth-client-id: ${{ vars.TS_WIF_CLIENT_ID }}
          audience: ${{ vars.TS_WIF_AUDIENCE }}
          tags: tag:ci
          # Wait until the box answers: a new node's peers see it only after a few seconds.
          ping: ${{ steps.box.outputs.host }}
      # A throwaway storytree home whose library setting is the Mint box as the read-only role; its
      # password reaches storytree as PGPASSWORD, since that home saves no key. The address trusts the
      # box's certificate from this checkout's infra/library-host/mint-library.crt (ADR-0997 D1).
      - name: Check every changed capability is on the increment's list
        if: steps.settings.outputs.ready == 'true'
        env:
          PGPASSWORD: ${{ secrets.PLAN_PG_PASSWORD }}
          BOX: ${{ steps.box.outputs.host }}
        run: |
          export STORYTREE_HOME="$RUNNER_TEMP/storytree-home"
          mkdir -p "$STORYTREE_HOME"
          echo "{\"library\":{\"location\":\"postgres\",\"address\":\"postgres://ci_plan_read@$BOX:5432/postgres?sslrootcert=$GITHUB_WORKSPACE/infra/library-host/mint-library.crt\"}}" > "$STORYTREE_HOME/settings.json"
          node --import tsx packages/repo-checks/src/capability-list.mjs
