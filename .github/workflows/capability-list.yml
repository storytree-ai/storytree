name: Capability list

# On every pull request into main, and in the merge queue, run the capability-list check (ADR-0949 D3):
# a branch that changes a capability its increment does not list fails it, naming each one
# (`node --import tsx packages/dev-loop/src/capability-list.mjs`). The check reads the pull request's
# branch from GITHUB_HEAD_REF and says "not checked" for one that names no increment, which a merge
# queue's branch never does.
#
# It reads the plan from the library on the Mint box through a read-only role (ADR-0952): the job
# joins the tailnet as an ephemeral tag:ci node keylessly, with GitHub's OIDC token and the
# variables TS_WIF_CLIENT_ID and TS_WIF_AUDIENCE as the environment plan-read sets them (its own
# federated credential, whose subject names that environment), and connects as ci_plan_read, which
# may SELECT library_meta and the plan's story, capability, contract, arc and increment records, and
# nothing else. Its password is the secret PLAN_PG_PASSWORD in the environment plan-read. Until that
# secret is set the job says "not checked" and passes, so it blocks nothing before the owner has
# set it; a pull request from a fork, which GitHub gives no secrets, is not checked either.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]

# A newer push to the same pull request cancels the run it supersedes.
concurrency:
  group: capability-list-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: capability list
    runs-on: ubuntu-latest
    environment: plan-read
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # GitHub's OIDC token, for the keyless sign-in to the tailnet
    steps:
      # Only whether the password is set enters the step, never its value.
      - name: Check that the read-only role's password is set
        id: settings
        env:
          SET_PLAN_PG_PASSWORD: ${{ secrets.PLAN_PG_PASSWORD != '' }}
        run: |
          if [ "$SET_PLAN_PG_PASSWORD" = true ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "not checked: plan-read credentials not set"
          fi
      - uses: actions/checkout@v6
        if: steps.settings.outputs.ready == 'true'
        with:
          fetch-depth: 0 # the check compares the branch with origin/main
      - uses: pnpm/action-setup@v6
        if: steps.settings.outputs.ready == 'true'
      - uses: actions/setup-node@v6
        if: steps.settings.outputs.ready == 'true'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.settings.outputs.ready == 'true'
      - name: Join the tailnet as CI
        if: steps.settings.outputs.ready == 'true'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ vars.TS_WIF_CLIENT_ID }}
          audience: ${{ vars.TS_WIF_AUDIENCE }}
          tags: tag:ci
          # Wait until the box answers: a new node's peers see it only after a few seconds.
          ping: 100.97.8.31
      # A throwaway storytree home whose library setting is the Mint box as the read-only role; its
      # password reaches storytree as PGPASSWORD, since that home saves no key.
      - name: Check every changed capability is on the increment's list
        if: steps.settings.outputs.ready == 'true'
        env:
          PGPASSWORD: ${{ secrets.PLAN_PG_PASSWORD }}
        run: |
          export STORYTREE_HOME="$RUNNER_TEMP/storytree-home"
          mkdir -p "$STORYTREE_HOME"
          echo '{"library":{"location":"postgres","address":"postgres://ci_plan_read@100.97.8.31:5432/postgres"}}' > "$STORYTREE_HOME/settings.json"
          node --import tsx packages/dev-loop/src/capability-list.mjs
