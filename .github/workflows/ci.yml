name: CI

# Every change reaches main through a pull request. On each pull request into main, `platforms`
# installs, typechecks and runs the tests on Linux, macOS and Windows, against the merge of the
# branch with main, and `verify` passes once all three have. Then `automerge` lands the pull
# request. Branch protection on main requires `verify`, so nothing merges unless the tests passed on
# every system.
#
# main merges through GitHub's merge queue (ADR-0796): `automerge` hands a green pull request to
# the queue, and the queue runs this workflow again (`merge_group`) on the merge of main, every pull
# request ahead of it, and this one; it merges only if `verify` passes there too, so two pull
# requests that each passed alone cannot together leave main red. While no queue is required on
# main, `automerge` merges directly, as before the queue. A pull request the queue takes out because
# its queue run failed, while its own `verify` passed, goes back in once (requeue.yml).
# A `platforms` job GitHub cancelled before any hosted runner took it is rerun once (rerun-unrun.yml).
#
# The product ships for Windows first, on x64 and arm64; the Windows run here is x64. The macOS run
# keeps the code working on a Mac from the day each line is written, so that Mac support later is
# packaging rather than porting (ADR-0625 D7, in storytree 0.2's decision log).
#
# A draft is never merged: open a pull request as a draft, or convert it to one, to hold it, and
# `gh pr ready` releases it (`verify` runs again, and the pull request merges when it passes). The
# `hold` label holds one too, and taking it off releases it: hold-release.yml lands a head that
# `verify` already passed, and a run still going lands it when its `verify` passes. Whether it is
# held is read when `automerge` runs (land.yml), not from the event that started its run: a ready
# issued seconds after a push can have its own run cancelled by the push's, which began while the
# pull request was still a draft (PR #281), and a `hold` taken off after a run began is still in
# that run's event (PR #704); that run must still merge it. A pull request from a fork is checked,
# never merged automatically.
#
# `verify` also runs on each push to main. The queue's merge is such a push, so it starts this
# workflow, then release.yml and own-health.yml after it completes. A direct merge that
# `automerge` makes starts none of them: GitHub starts no workflow from a push made with a
# workflow's own token. So then `automerge` starts own-health.yml on main itself, which records
# each contract's verified health (ADR-0744 D3), and release.yml follows the pull request's run.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

# A newer push to the same pull request, or to main, cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One run per system, each installing, typechecking and testing. A failure on one system leaves
  # the others running (fail-fast: false), so a failure on one alone shows as that system's.
  # Windows, every run's slowest, is two jobs, each testing half the units by recent pass time
  # (`pnpm test --shard`, increment_6163234e706b): its test step is paced by the sum of its units'
  # times, not its slowest (median 16.6 min). Raising its units at once instead trades minutes for
  # reds on a loaded runner.
  platforms:
    name: verify on ${{ matrix.system }}${{ matrix.shard && format(' {0}/2', matrix.shard) || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: Linux
            runner: ubuntu-latest
          - system: macOS
            runner: macos-latest
          - system: Windows
            runner: windows-latest
            shard: 1
          - system: Windows
            runner: windows-latest
            shard: 2
    runs-on: ${{ matrix.runner }}
    # The merge queue runs on loaded runners, where a full Windows test step that takes 13 minutes
    # unloaded ran past the old 21-minute deadline and ejected a green pull request
    # (friction_214807bf5d9d, increment_3bd2b051ab67). A run that passes takes no longer for it.
    timeout-minutes: 35
    steps:
      # `pnpm test` ends itself by 31 minutes into the job (its deadline) and prints its table, or
      # past that names where it stalled: a job the 35-minute limit cancels can lose its whole log,
      # so nobody can name what hung (increment_7f43f74526ab). Taken here, since checkout alone has
      # taken 12 minutes.
      - name: Set the test run's deadline
        shell: bash
        run: echo "STORYTREE_TEST_DEADLINE=$(( $(date +%s) + 31 * 60 ))" >> "$GITHUB_ENV"
      # The whole history, origin/main included: `pnpm test` runs only what the change can reach,
      # measured from merge-base(origin/main, HEAD), and runs everything if origin/main is missing.
      # On a push to main that merge-base is HEAD itself, so main's own runs are always full.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # pnpm 9.15.0, from package.json's packageManager field.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # A type-only import ends only at the library (ADR-1017 D2); it reads only the code, in about 5 s.
      - run: pnpm check:type-imports
      # packages/dev-loop/src/test.mjs starts a throwaway Postgres from this machine's @embedded-postgres package
      # (linux-x64, darwin-arm64 or windows-x64). The live Cloud SQL proof (contract 8.1) is
      # skipped, visibly: CI holds no Google identity. Its first line is the `scope:` decision
      # (packages/dev-loop/src/test-scope.mjs, the same one a local run takes, ADR-0649 D4) and its last the
      # PASS / FAIL table per package.
      # A fresh runner has no timing history, so every unit would get the fixed 3 minutes; on main
      # Windows agent-link passed in 171.3 s and macOS forest in 170.0 s (run 37839884329), and
      # loaded queue runners killed them. ADR-0785's own rule, twice the slowest pass, gives 6 min.
      # Units drifted past that (Windows cli and session-management, killed at 360 s on pull requests
      # that never touched them: friction_21e0e923a222, friction_9a48639c761e), so each runner now
      # carries the timing history of main's latest run on its system, and a unit with five passes
      # there gets twice its slowest, never under 6 min: a pull request's kills are never carried back.
      - name: Restore main's test timing history
        if: ${{ !matrix.shard }}
        uses: actions/cache/restore@v6
        with:
          path: ~/.storytree/0.3/test-timings.jsonl
          key: test-timings-${{ runner.os }}-${{ github.run_id }}
          restore-keys: test-timings-${{ runner.os }}-
      # A Windows shard saves only its own units' new times, so each shard restores both shards'
      # latest saves (else the unsharded one before them) and merges them: every row begins with its
      # `at`, so sorting orders them in time as well. Both shards must split alike, so `verify` checks
      # that their plans match (a main save landing between their restores could part them).
      - name: Restore main's test timing history, shard 1's
        if: ${{ matrix.shard }}
        uses: actions/cache/restore@v6
        with:
          path: ~/.storytree/0.3/test-timings.jsonl
          key: test-timings-${{ runner.os }}-shard-1-${{ github.run_id }}
          restore-keys: |
            test-timings-${{ runner.os }}-shard-1-
            test-timings-${{ runner.os }}-
      - if: ${{ matrix.shard }}
        shell: bash
        run: mv ~/.storytree/0.3/test-timings.jsonl ~/.storytree/0.3/shard-1-timings.jsonl 2>/dev/null || true
      - name: Restore main's test timing history, shard 2's
        if: ${{ matrix.shard }}
        uses: actions/cache/restore@v6
        with:
          path: ~/.storytree/0.3/test-timings.jsonl
          key: test-timings-${{ runner.os }}-shard-2-${{ github.run_id }}
          restore-keys: |
            test-timings-${{ runner.os }}-shard-2-
            test-timings-${{ runner.os }}-
      - name: Merge the shards' timing histories
        if: ${{ matrix.shard }}
        shell: bash
        run: |
          cd ~/.storytree/0.3 2>/dev/null || exit 0
          touch test-timings.jsonl shard-1-timings.jsonl
          LC_ALL=C sort -u shard-1-timings.jsonl test-timings.jsonl > merged.jsonl
          mv merged.jsonl test-timings.jsonl
          rm shard-1-timings.jsonl
          echo "$(wc -l < test-timings.jsonl) timing rows"
      # Until main's history holds a Windows pass of its two drifted units, each keeps its hand-set limit,
      # twice its slowest pass (346 s and 357 s): without one, PR #1627's own run killed cli at 360 s, and
      # PR #1628's did too, under a history saved by a cancelled main run that held no pass of cli.
      - if: matrix.system == 'Windows'
        shell: bash
        run: |
          passed() { grep -qs "\"platform\":\"win32\".*\"unit\":\"packages/$1\".*\"result\":\"pass\"" ~/.storytree/0.3/test-timings.jsonl; }
          passed cli || pnpm run test --set-limit=cli=720 --reason="no Windows pass in main's history yet; Windows CI passes took up to 346 s, friction_21e0e923a222"
          passed session-management || pnpm run test --set-limit=session-management=720 --reason="no Windows pass in main's history yet; Windows CI passes took up to 357 s, PR 1625"
      - run: pnpm run test ${{ matrix.shard && format('--shard={0}/2', matrix.shard) || '' }}
        env:
          STORYTREE_UNIT_LIMIT_MS: 360000
          STORYTREE_TEST_EVIDENCE: ${{ matrix.system == 'Windows' && '.pgtest/windows-evidence' || matrix.system == 'macOS' && '.pgtest/macos-evidence' || '' }}
      # Only main's own runs carry their times forward, a failed or cut one too: its kills grow the
      # next run's deadline for that unit.
      - name: Keep this run's test timing history for the next
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: ~/.storytree/0.3/test-timings.jsonl
          key: test-timings-${{ runner.os }}-${{ matrix.shard && format('shard-{0}-', matrix.shard) || '' }}${{ github.run_id }}-${{ github.run_attempt }}
      # Exercise the distributable before merging packaging/updater changes. A source build
      # passing tests alone does not prove NSIS can unpack the app and its database binaries, or
      # that the signed Apple Silicon .app starts and runs its own Postgres and Node.
      # Built once on Windows, by its first shard.
      - name: Does this change reach the installer?
        if: matrix.system != 'Linux' && matrix.shard != 2
        id: installer
        shell: bash
        run: |
          if ! git diff --quiet origin/main...HEAD -- apps/desktop packages/app pnpm-lock.yaml package.json .github/workflows; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: matrix.system != 'Linux' && steps.installer.outputs.changed == 'true'
        run: pnpm desktop:dist
      - if: matrix.system == 'Windows' && steps.installer.outputs.changed == 'true'
        run: node apps/desktop/check-install.mjs
      - if: matrix.system == 'macOS' && steps.installer.outputs.changed == 'true'
        run: node --import tsx apps/desktop/check-install-mac.mjs
      # Reuse this Windows execution for own health. Each attempt keeps its own immutable
      # artifact. A failed job uploads too (always()), so its own run can be diagnosed; own health
      # downloads only from a passing run, so a failed attempt's evidence earns no credit. A job
      # that failed before its tests wrote any only warns about the missing folder, as does a shard
      # given no units. Each shard keeps its own; own health downloads both into one folder.
      - name: Does this shard test anything?
        id: shard
        if: always() && matrix.shard
        shell: bash
        run: |
          grep -qx "shard ${{ matrix.shard }}/2: none" .pgtest/shard-plan.txt 2>/dev/null || echo "units=true" >> "$GITHUB_OUTPUT"
      - name: Preserve Windows test evidence
        if: always() && matrix.system == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: windows-test-evidence-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: .pgtest/windows-evidence
          include-hidden-files: true
          if-no-files-found: ${{ job.status == 'success' && steps.shard.outputs.units == 'true' && 'error' || 'warn' }}
      - name: Preserve this shard's plan
        if: always() && matrix.shard
        uses: actions/upload-artifact@v7
        with:
          name: test-shard-plan-${{ matrix.shard }}-${{ github.run_attempt }}
          path: .pgtest/shard-plan.txt
          include-hidden-files: true
          if-no-files-found: warn
      # The same for macOS: own health credits a platform:darwin skip only from this run (contract 1.11).
      - name: Preserve macOS test evidence
        if: always() && matrix.system == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: macos-test-evidence-${{ github.run_attempt }}
          path: .pgtest/macos-evidence
          include-hidden-files: true
          if-no-files-found: ${{ job.status == 'success' && 'error' || 'warn' }}

  # The check branch protection on main requires, and the one `automerge` waits for; it reports on
  # the merge queue's runs too, so the queue can merge on it. It passes only
  # if every run in `platforms` passed. It runs whatever they did (always()), so a run that failed
  # or was cancelled fails it: were it skipped instead, GitHub would count the skipped check as
  # passed.
  verify:
    name: verify
    needs: platforms
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every system passed
        env:
          RESULT: ${{ needs.platforms.result }}
        run: |
          echo "platforms: $RESULT"
          test "$RESULT" = success
      - uses: actions/download-artifact@v8
        with:
          pattern: test-shard-plan-*
          path: shard-plans
      # Both Windows shards split the units alike, so none fell between them. Each shard's latest
      # attempt is the one that passed: rerunning only a failed job leaves the other's earlier plan.
      - name: The Windows shards split the units alike
        run: |
          latest() { ls -d shard-plans/test-shard-plan-"$1"-* 2>/dev/null | sort -V | tail -n 1; }
          one="$(latest 1)" two="$(latest 2)"
          test -n "$one" && test -n "$two" || { echo "a Windows shard left no plan"; exit 1; }
          cat "$one/shard-plan.txt" "$two/shard-plan.txt"
          cmp "$one/shard-plan.txt" "$two/shard-plan.txt"

  # Lands the pull request once `verify` passed, through land.yml, which reads whether it is held
  # (a draft, or the `hold` label) when it runs, not from this run's event (see the header).
  automerge:
    name: automerge
    needs: verify
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      actions: write # to start the own-health workflow on main once merged
      contents: write
      pull-requests: write
    uses: ./.github/workflows/land.yml
    with:
      pr: ${{ github.event.pull_request.number }}
      pr-id: ${{ github.event.pull_request.node_id }}
      sha: ${{ github.event.pull_request.head.sha }}
    secrets:
      MERGE_QUEUE_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
