name: CI

# Every change reaches main through a pull request. On each pull request into main, `platforms`
# installs, typechecks and runs the tests on Linux, macOS and Windows, against the merge of the
# branch with main, and `verify` passes once all three have. Then `automerge` merges the pull
# request. Branch protection on main requires `verify`, so nothing merges unless the tests passed on
# every system.
#
# The product ships for Windows first, on x64 and arm64; the Windows run here is x64. The macOS run
# keeps the code working on a Mac from the day each line is written, so that Mac support later is
# packaging rather than porting (ADR-0625 D7, in storytree 0.2's decision log).
#
# A draft is never merged: open a pull request as a draft, or convert it to one, to hold it, and
# `gh pr ready` releases it (`verify` runs again, and the pull request merges when it passes). A
# pull request that carries the `hold` label when its run starts is not merged either. A pull
# request from a fork is checked, never merged automatically.
#
# `verify` also runs on each push to main. A merge that `automerge` makes starts no such run:
# GitHub starts no workflow from a push made with a workflow's own token. So `automerge` starts
# own-health.yml on main itself, which records each contract's verified health (ADR-0744 D3).

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# A newer push to the same pull request, or to main, cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One run per system, each installing, typechecking and testing. A failure on one system leaves
  # the others running (fail-fast: false), so a failure on one alone shows as that system's.
  platforms:
    name: verify on ${{ matrix.system }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: Linux
            runner: ubuntu-latest
          - system: macOS
            runner: macos-latest
          - system: Windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      # The whole history, origin/main included: `pnpm test` runs only what the change can reach,
      # measured from merge-base(origin/main, HEAD), and runs everything if origin/main is missing.
      # On a push to main that merge-base is HEAD itself, so main's own runs are always full.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # pnpm 9.15.0, from package.json's packageManager field.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # scripts/test.mjs starts a throwaway Postgres from this machine's @embedded-postgres package
      # (linux-x64, darwin-arm64 or windows-x64). The live Cloud SQL proof (contract 8.1) is
      # skipped, visibly: CI holds no Google identity. Its first line is the `scope:` decision
      # (scripts/test-scope.mjs, the same one a local run takes, ADR-0649 D4) and its last the
      # PASS / FAIL table per package.
      - run: pnpm test
      # Exercise the distributable before merging packaging/updater changes. A source build
      # passing tests alone does not prove NSIS can unpack the app and its database binaries.
      - name: Does this change reach the installer?
        if: matrix.system == 'Windows'
        id: installer
        shell: bash
        run: |
          if ! git diff --quiet origin/main...HEAD -- apps/desktop packages/app pnpm-lock.yaml package.json .github/workflows; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: matrix.system == 'Windows' && steps.installer.outputs.changed == 'true'
        run: pnpm desktop:dist
      - if: matrix.system == 'Windows' && steps.installer.outputs.changed == 'true'
        run: node apps/desktop/check-install.mjs

  # The check branch protection on main requires, and the one `automerge` waits for. It passes only
  # if every run in `platforms` passed. It runs whatever they did (always()), so a run that failed
  # or was cancelled fails it: were it skipped instead, GitHub would count the skipped check as
  # passed.
  verify:
    name: verify
    needs: platforms
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every system passed
        env:
          RESULT: ${{ needs.platforms.result }}
        run: |
          echo "platforms: $RESULT"
          test "$RESULT" = success

  automerge:
    name: automerge
    needs: verify
    if: >-
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      !contains(github.event.pull_request.labels.*.name, 'hold') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: write # to start the own-health workflow on main once merged
      contents: write
      pull-requests: write
    steps:
      # --match-head-commit: merge the commit `verify` passed, never one pushed since. --auto: if
      # main's protection still holds the merge back, GitHub's auto-merge makes it once it allows;
      # otherwise gh merges now. --delete-branch: the repo's own "automatically delete head
      # branches" setting left #1's branch in place after this job merged it, so gh deletes the
      # branch itself.
      - name: Merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --auto --merge --match-head-commit "$SHA" --delete-branch
      # Main has changed, and this merge starts no push workflow (it was made with this token), so
      # start the one that records each contract's verified health on main (own-health.yml). Only
      # once the merge has happened, which GitHub finishes a few seconds after `gh pr merge --auto`
      # returns (7 s on #219), so this waits for it, up to two minutes. A merge still held back
      # after that records nothing now, and the next change to main records it. The merge is
      # already made or scheduled, so a failure here never fails it.
      - name: Record own health on main
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          for attempt in $(seq 1 24); do
            if [ "$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json state --jq .state)" = MERGED ]; then
              gh workflow run own-health.yml --repo "$GITHUB_REPOSITORY" --ref main
              exit 0
            fi
            sleep 5
          done
          echo "Not merged after two minutes, so main has not changed yet: nothing to record now."
