name: CI

# Every change reaches main through a pull request. On each pull request into main, `platforms`
# installs, typechecks and runs the tests on Linux, macOS and Windows, against the merge of the
# branch with main, and `verify` passes once all three have. Then `automerge` lands the pull
# request. Branch protection on main requires `verify`, so nothing merges unless the tests passed on
# every system.
#
# main merges through GitHub's merge queue (ADR-0796): `automerge` hands a green pull request to
# the queue, and the queue runs this workflow again (`merge_group`) on the merge of main, every pull
# request ahead of it, and this one; it merges only if `verify` passes there too, so two pull
# requests that each passed alone cannot together leave main red. While no queue is required on
# main, `automerge` merges directly, as before the queue.
#
# The product ships for Windows first, on x64 and arm64; the Windows run here is x64. The macOS run
# keeps the code working on a Mac from the day each line is written, so that Mac support later is
# packaging rather than porting (ADR-0625 D7, in storytree 0.2's decision log).
#
# A draft is never merged: open a pull request as a draft, or convert it to one, to hold it, and
# `gh pr ready` releases it (`verify` runs again, and the pull request merges when it passes).
# `automerge` asks whether the pull request is a draft when it runs, not when its run started: a
# ready issued seconds after a push can have its own run cancelled by the push's, which began
# while the pull request was still a draft (PR #281), and that run must still merge it. A
# pull request that carries the `hold` label when its run starts is not merged either. A pull
# request from a fork is checked, never merged automatically.
#
# `verify` also runs on each push to main. The queue's merge is such a push, so it starts this
# workflow, then release.yml and own-health.yml after it completes. A direct merge that
# `automerge` makes starts none of them: GitHub starts no workflow from a push made with a
# workflow's own token. So then `automerge` starts own-health.yml on main itself, which records
# each contract's verified health (ADR-0744 D3), and release.yml follows the pull request's run.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

# A newer push to the same pull request, or to main, cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One run per system, each installing, typechecking and testing. A failure on one system leaves
  # the others running (fail-fast: false), so a failure on one alone shows as that system's.
  platforms:
    name: verify on ${{ matrix.system }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: Linux
            runner: ubuntu-latest
          - system: macOS
            runner: macos-latest
          - system: Windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      # The whole history, origin/main included: `pnpm test` runs only what the change can reach,
      # measured from merge-base(origin/main, HEAD), and runs everything if origin/main is missing.
      # On a push to main that merge-base is HEAD itself, so main's own runs are always full.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # pnpm 9.15.0, from package.json's packageManager field.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # packages/dev-loop/src/test.mjs starts a throwaway Postgres from this machine's @embedded-postgres package
      # (linux-x64, darwin-arm64 or windows-x64). The live Cloud SQL proof (contract 8.1) is
      # skipped, visibly: CI holds no Google identity. Its first line is the `scope:` decision
      # (packages/dev-loop/src/test-scope.mjs, the same one a local run takes, ADR-0649 D4) and its last the
      # PASS / FAIL table per package.
      - run: pnpm test
        env:
          STORYTREE_TEST_EVIDENCE: ${{ matrix.system == 'Windows' && '.pgtest/windows-evidence' || '' }}
      # Exercise the distributable before merging packaging/updater changes. A source build
      # passing tests alone does not prove NSIS can unpack the app and its database binaries.
      - name: Does this change reach the installer?
        if: matrix.system == 'Windows'
        id: installer
        shell: bash
        run: |
          if ! git diff --quiet origin/main...HEAD -- apps/desktop packages/app pnpm-lock.yaml package.json .github/workflows; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: matrix.system == 'Windows' && steps.installer.outputs.changed == 'true'
        run: pnpm desktop:dist
      - if: matrix.system == 'Windows' && steps.installer.outputs.changed == 'true'
        run: node apps/desktop/check-install.mjs
      # Reuse this Windows execution for own health. Each attempt keeps its own immutable
      # artifact; a failed Windows job publishes no evidence.
      - name: Preserve Windows test evidence
        if: matrix.system == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: windows-test-evidence-${{ github.run_attempt }}
          path: .pgtest/windows-evidence
          include-hidden-files: true
          if-no-files-found: error

  # The check branch protection on main requires, and the one `automerge` waits for; it reports on
  # the merge queue's runs too, so the queue can merge on it. It passes only
  # if every run in `platforms` passed. It runs whatever they did (always()), so a run that failed
  # or was cancelled fails it: were it skipped instead, GitHub would count the skipped check as
  # passed.
  verify:
    name: verify
    needs: platforms
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every system passed
        env:
          RESULT: ${{ needs.platforms.result }}
        run: |
          echo "platforms: $RESULT"
          test "$RESULT" = success

  automerge:
    name: automerge
    needs: verify
    if: >-
      github.event_name == 'pull_request' &&
      !contains(github.event.pull_request.labels.*.name, 'hold') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: write # to start the own-health workflow on main once merged
      contents: write
      pull-requests: write
    steps:
      # Whether it is a draft now, not in the event that started this run (see the header).
      - name: Still a draft?
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          draft=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          echo "draft=$draft" >> "$GITHUB_OUTPUT"
          if [ "$draft" = true ]; then echo "A draft: not merged. \`gh pr ready\` releases it."; fi
      # With a merge queue required on main, enqueue the pull request at the commit `verify` passed
      # (expectedHeadOid): the queue tests it on top of main and merges it. It enqueues with the
      # MERGE_QUEUE_TOKEN secret, never this workflow's own token: GitHub starts no workflow from an
      # event that token causes, so an entry it enqueued gets no `merge_group` run and waits in the
      # queue until it times out (2026-09-30, PRs #311-#316). Without a queue, merge it
      # directly. --match-head-commit: merge the commit `verify` passed, never one pushed since.
      # --auto: if main's protection still holds the merge back, GitHub's auto-merge makes it once
      # it allows; otherwise gh merges now. --delete-branch: the repo's own "automatically delete
      # head branches" setting left #1's branch in place after this job merged it, so gh deletes the
      # branch itself.
      - name: Merge
        id: merge
        if: steps.draft.outputs.draft == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          PR_ID: ${{ github.event.pull_request.node_id }}
          SHA: ${{ github.event.pull_request.head.sha }}
          QUEUE_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
        run: |
          queue=$(gh api graphql -f owner="${GITHUB_REPOSITORY%/*}" -f name="${GITHUB_REPOSITORY#*/}" -F pr="$PR" \
            -f query='query($owner: String!, $name: String!, $pr: Int!) { repository(owner: $owner, name: $name) { pullRequest(number: $pr) { isMergeQueueEnabled } } }' \
            --jq .data.repository.pullRequest.isMergeQueueEnabled)
          echo "queue=$queue" >> "$GITHUB_OUTPUT"
          if [ "$queue" = true ]; then
            if [ -z "$QUEUE_TOKEN" ]; then
              echo "::error::main requires the merge queue, but the MERGE_QUEUE_TOKEN secret is not set, so this pull request cannot be enqueued (an entry this workflow's own token enqueued would never be checked)."
              exit 1
            fi
            # GitHub can refuse the enqueue with `Required status check "verify" is in progress`
            # seconds after this run's `verify` passed on this very commit, before it has taken the
            # result in (PR #681: verify done 15:18:28, refused 15:18:34, the commit's only run). That
            # refusal alone is retried, a bounded number of times, still at expectedHeadOid, and only
            # while the pull request's head is still the commit `verify` passed: a newer push has a run
            # of its own. Any other refusal, or the same one past the last try, fails here as before.
            for attempt in 1 2 3 4 5 6; do
              if out=$(GH_TOKEN="$QUEUE_TOKEN" gh api graphql -f id="$PR_ID" -f sha="$SHA" \
                -f query='mutation($id: ID!, $sha: GitObjectID!) { enqueuePullRequest(input: {pullRequestId: $id, expectedHeadOid: $sha}) { mergeQueueEntry { position } } }' \
                --jq '"Entered the merge queue at position \(.data.enqueuePullRequest.mergeQueueEntry.position)."' 2>&1); then
                echo "$out"
                exit 0
              fi
              echo "$out"
              if ! grep -q 'Required status check "verify" is in progress' <<< "$out"; then exit 1; fi
              head=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
              if [ "$head" != "$SHA" ]; then
                echo "::error::The pull request's head moved to $head after verify passed $SHA, so this run does not enqueue it: the newer push's run does."
                exit 1
              fi
              if [ "$attempt" = 6 ]; then break; fi
              echo "verify passed on $SHA in this run, but GitHub still reads it in progress: trying again in 15 s (attempt $attempt of 6)."
              sleep 15
            done
            echo "::error::GitHub still reads verify in progress on $SHA after six tries over 75 s, although this run's verify passed it. Not enqueued; re-run this job to try again."
            exit 1
          else
            gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --auto --merge --match-head-commit "$SHA" --delete-branch
          fi
      # A direct merge starts no push workflow (it was made with this token), so start the one that
      # records each contract's verified health on main (own-health.yml). Only once the merge has
      # happened, which GitHub finishes a few seconds after `gh pr merge --auto` returns (7 s on
      # #219), so this waits for it, up to two minutes. A merge still held back after that records
      # nothing now, and the next change to main records it. The merge is already made or
      # scheduled, so a failure here never fails it. The queue's merge starts CI, whose completion
      # starts own-health.yml with Windows evidence for that exact commit.
      - name: Record own health on main
        if: steps.merge.outcome == 'success' && steps.merge.outputs.queue != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          for attempt in $(seq 1 24); do
            if [ "$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json state --jq .state)" = MERGED ]; then
              gh workflow run own-health.yml --repo "$GITHUB_REPOSITORY" --ref main
              exit 0
            fi
            sleep 5
          done
          echo "Not merged after two minutes, so main has not changed yet: nothing to record now."
