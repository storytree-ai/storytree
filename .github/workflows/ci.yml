name: CI

# The site's typecheck, tests and build, against storytree pinned as the submodule in storytree/ (ADR-1171 D2).
# Publishing storytree.dev is not here yet: storytree's own repository publishes it until ADR-1171 D3 step (3).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # storytree is public, so the submodule needs no token of its own.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          submodules: true
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          WEBSITE_SITE: "1"
          WEBSITE_SHA: ${{ github.sha }}
