name: Land

# Lands a pull request whose `verify` passed on its head commit: hands it to the merge queue when
# main requires one (ADR-0796), or merges it directly when none is required. Three callers: ci.yml's
# `automerge`, once its own run's `verify` passed; hold-release.yml, when the `hold` label is taken
# off a pull request whose head had already passed `verify` in a run that skipped landing it; and
# requeue.yml, once, when the merge queue removed a pull request whose head's `verify` passed.
# It lands nothing that is held when it runs (a draft, or the `hold` label), and only the commit
# `verify` passed: never one pushed since.

on:
  workflow_call:
    inputs:
      pr:
        description: The pull request's number.
        type: number
        required: true
      pr-id:
        description: The pull request's GraphQL node id, for the enqueue.
        type: string
        required: true
      sha:
        description: The head commit `verify` passed; nothing else is landed.
        type: string
        required: true
    secrets:
      MERGE_QUEUE_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  land:
    name: land
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: write # to start the own-health workflow on main once merged
      contents: write
      pull-requests: write
    env:
      PR: ${{ inputs.pr }}
      SHA: ${{ inputs.sha }}
    steps:
      # Whether it is held now, not in the event that started the run: a draft, the `hold` label,
      # or no longer open. A ready issued seconds after a push can have its own run cancelled by the
      # push's, which began while it was still a draft (PR #281), and a `hold` removed after a run
      # started was still in that run's event (PR #704); either way the run that lands it reads now.
      - name: Still held?
        id: held
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read -r state draft hold queued <<< "$(gh api graphql -f owner="${GITHUB_REPOSITORY%/*}" -f name="${GITHUB_REPOSITORY#*/}" -F pr="$PR" \
            -f query='query($owner: String!, $name: String!, $pr: Int!) { repository(owner: $owner, name: $name) { pullRequest(number: $pr) { state isDraft isInMergeQueue labels(first: 100) { nodes { name } } } } }' \
            --jq '.data.repository.pullRequest | "\(.state) \(.isDraft) \([.labels.nodes[].name] | index("hold") != null) \(.isInMergeQueue)"')"
          held=false
          if [ "$state" != OPEN ]; then held=true; echo "The pull request is $state: nothing to land."
          elif [ "$draft" = true ]; then held=true; echo "A draft: not merged. \`gh pr ready\` releases it."
          elif [ "$hold" = true ]; then held=true; echo "Carries the \`hold\` label: not merged. Removing the label releases it."
          elif [ "$queued" = true ]; then held=true; echo "Already in the merge queue: nothing more to do."
          fi
          echo "held=$held" >> "$GITHUB_OUTPUT"
      # The enqueue's retry rule (packages/base-dev-loop/src/land-enqueue.mjs), and nothing else, read from the default
      # branch: the pull request's own copy never runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.held.outputs.held == 'false'
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            packages/base-dev-loop/src/land-enqueue.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # With a merge queue required on main, enqueue the pull request at the commit `verify` passed
      # (expectedHeadOid): the queue tests it on top of main and merges it. It enqueues with the
      # MERGE_QUEUE_TOKEN secret, never this workflow's own token: GitHub starts no workflow from an
      # event that token causes, so an entry it enqueued gets no `merge_group` run and waits in the
      # queue until it times out (2026-09-30, PRs #311-#316). Without a queue, merge it
      # directly. --match-head-commit: merge the commit `verify` passed, never one pushed since.
      # --auto: if main's protection still holds the merge back, GitHub's auto-merge makes it once
      # it allows; otherwise gh merges now. --delete-branch: the repo's own "automatically delete
      # head branches" setting left #1's branch in place after this job merged it, so gh deletes the
      # branch itself.
      - name: Merge
        id: merge
        if: steps.held.outputs.held == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_ID: ${{ inputs.pr-id }}
          QUEUE_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
        run: |
          queue=$(gh api graphql -f owner="${GITHUB_REPOSITORY%/*}" -f name="${GITHUB_REPOSITORY#*/}" -F pr="$PR" \
            -f query='query($owner: String!, $name: String!, $pr: Int!) { repository(owner: $owner, name: $name) { pullRequest(number: $pr) { isMergeQueueEnabled } } }' \
            --jq .data.repository.pullRequest.isMergeQueueEnabled)
          echo "queue=$queue" >> "$GITHUB_OUTPUT"
          if [ "$queue" = true ]; then
            if [ -z "$QUEUE_TOKEN" ]; then
              echo "::error::main requires the merge queue, but the MERGE_QUEUE_TOKEN secret is not set, so this pull request cannot be enqueued (an entry this workflow's own token enqueued would never be checked)."
              exit 1
            fi
            # GitHub can refuse the enqueue after this run's `verify` passed on this very commit,
            # before it has taken the result in, naming required checks as not yet passed (`... is
            # queued`, `... is expected`, `... is in progress`, `... have not succeeded`). Whether a
            # refusal is tried again, for how long, is packages/base-dev-loop/src/land-enqueue.mjs's call
            # (five minutes: PR #1684 was refused for 75 s and more). Every try is at expectedHeadOid,
            # and only while the pull request's head is still the commit `verify` passed: a newer
            # push has a run of its own.
            rule=packages/base-dev-loop/src/land-enqueue.mjs
            start=$SECONDS
            for attempt in $(seq 1 40); do
              if out=$(GH_TOKEN="$QUEUE_TOKEN" gh api graphql -f id="$PR_ID" -f sha="$SHA" \
                -f query='mutation($id: ID!, $sha: GitObjectID!) { enqueuePullRequest(input: {pullRequestId: $id, expectedHeadOid: $sha}) { mergeQueueEntry { position } } }' \
                --jq '"Entered the merge queue at position \(.data.enqueuePullRequest.mergeQueueEntry.position)."' 2>&1); then
                echo "$out"
                exit 0
              fi
              echo "$out"
              if ! env -u QUEUE_TOKEN node "$rule" "$((SECONDS - start))" <<< "$out"; then exit 1; fi
              head=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
              if [ "$head" != "$SHA" ]; then
                echo "::error::The pull request's head moved to $head after verify passed $SHA, so this run does not enqueue it: the newer push's run does."
                exit 1
              fi
              sleep 15
            done
            echo "::error::GitHub still reads the required checks as not passed on $SHA after 40 tries, although this run's verify passed it. Not enqueued; re-run this job to try again."
            exit 1
          else
            gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --auto --merge --match-head-commit "$SHA" --delete-branch
          fi
      # A direct merge starts no push workflow (it was made with this token), so start the one that
      # records each contract's verified health on main (own-health.yml). Only once the merge has
      # happened, which GitHub finishes a few seconds after `gh pr merge --auto` returns (7 s on
      # #219), so this waits for it, up to two minutes. A merge still held back after that records
      # nothing now, and the next change to main records it. The merge is already made or
      # scheduled, so a failure here never fails it. The queue's merge starts CI, whose completion
      # starts own-health.yml with Windows evidence for that exact commit.
      - name: Record own health on main
        if: steps.merge.outcome == 'success' && steps.merge.outputs.queue != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 24); do
            if [ "$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json state --jq .state)" = MERGED ]; then
              gh workflow run own-health.yml --repo "$GITHUB_REPOSITORY" --ref main
              exit 0
            fi
            sleep 5
          done
          echo "Not merged after two minutes, so main has not changed yet: nothing to record now."
