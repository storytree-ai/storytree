name: Linux acceptance run

# The automated floor of the Linux acceptance (increment_46e44175295b), the twin of mac-acceptance.yml: the published
# one-liner on a fresh ubuntu-latest runner under a virtual display, then the app, local Postgres, the setup check,
# hooks and a small project, recorded by packages/app-setup/testing/linux-acceptance/run.sh and kept as an
# artifact. A push to a linux-acceptance/ branch runs it before the workflow reaches main. The release workflow calls
# it after every publish that carries a new Linux build, and harness/judge.sh fails the job when the app, its
# database, the setup check or the hooks do not come up. The repository is public: no secret is used or printed.
on:
  workflow_call:
    inputs:
      channel:
        description: Release channel to install (stable or alpha)
        type: string
        default: alpha
      version:
        description: The version the one-liner must install (the release just published)
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel to install (stable or alpha)
        default: alpha
      version:
        description: On stable, a 0.3.<n> build to install as a stable user would get it, before the pin moves to it; empty takes the pin
        default: ""
  push:
    branches: ["linux-acceptance/**"]

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    # A stuck run must not keep the next release waiting for hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: packages/app-setup/testing/linux-acceptance
      - name: Install with the one-liner and record what a first user sees
        # On alpha the version is only judged (the release just published is latest); on stable it is installed.
        env:
          CHANNEL: ${{ inputs.channel || 'alpha' }}
          VERSION: ${{ inputs.version }}
        run: bash packages/app-setup/testing/linux-acceptance/run.sh "$RUNNER_TEMP/linux-acceptance" "$CHANNEL" "$VERSION"
      - name: Fail unless the app, its database, the setup check and the hooks came up
        env:
          VERSION: ${{ inputs.version }}
        run: bash packages/app-setup/testing/linux-acceptance/judge.sh "$RUNNER_TEMP/linux-acceptance" "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: linux-acceptance
          path: ${{ runner.temp }}/linux-acceptance
          retention-days: 14
