name: Read Apple's notarisation answers

# Prints Apple's answer to each notarisation submission (id, date and status) and, given a submission's id, what
# Apple objected to in it (its status summary and issues), so a session can read Apple's answer from CI
# (increment_7460a5162816). Started by hand: `gh workflow run notary.yml [-f submission=<id>]`. The Apple key is
# written to a file for notarytool and deleted after; nothing prints a secret.
on:
  workflow_dispatch:
    inputs:
      submission:
        description: A submission id whose log to print (optional)
        required: false
        default: ""

permissions:
  contents: read

jobs:
  read:
    runs-on: macos-latest
    # Apple's key is read only by a job in the `release` environment, which runs only from main.
    environment: release
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - run: node apps/desktop/mac-signing.mjs history
        env:
          NOTARY_SUBMISSION: ${{ inputs.submission }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
