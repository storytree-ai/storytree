name: Own health

# After CI completes for a change to main, run storytree 0.3's own stories' tests and record each
# contract's VERIFIED health in the library on Cloud SQL (ADR-0744 D3-D4): `pnpm check:own-health`,
# the same rules a hand run uses (packages/dev-loop/src/own-health.mjs), written as "storytree test run on CI"
# with the commit in each note. Windows-only contracts need the passing Windows evidence from
# that exact commit and CI attempt. Never from a pull request's or merge group's run: only main's
# own commits are recorded.
#
# The merge queue's merge (ADR-0796) is a push to main and starts CI, whose completion starts this.
# A direct merge by CI is made
# with the workflow's own token, and GitHub starts no push workflow from those, so then ci.yml's
# `automerge` dispatches this workflow on main once its merge has happened. It can also be run by
# hand (Actions > Own health > Run workflow) to record main as it is now. A manual run looks for
# successful main-push CI at its exact checkout; without that evidence it grants no Windows credit.
# Run by hand with preflight ticked (gh workflow run own-health.yml -f preflight=true), it only
# checks that the secrets below are not empty, and records nothing.
#
# Where it records (ADR-0928 D4). When the repository variable HEALTH_PG_ADDRESS is set (the
# library on the Mint box, a postgres:// address without a password), the job joins the tailnet as
# an ephemeral tag:ci node, which the tailnet policy lets reach only the box's port 5432, and
# connects by that address as CI's health role, its password the secret HEALTH_PG_PASSWORD. The job
# runs in the environment own-health, deployable only from main, so that environment's copy of the
# password, once it has one, wins over the repository's (ADR-0939).
# Otherwise it signs in to Google keylessly: GitHub's OIDC token, exchanged through workload identity
# federation for CI's own service account (infra/ci-health), which may connect to the Cloud SQL
# instance as its database user and nothing more. Three repository variables name that identity;
# until they are all set, the job says so and passes without recording anything.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      preflight:
        description: Only check that the secrets the library on the Mint box needs are set; record nothing
        type: boolean
        default: false

# One recording at a time. A run in progress finishes; a newer one waits, replacing any older one
# still waiting. A delayed CI completion for an older commit must not overwrite newer health:
# after acquiring this slot, a job checks that its checkout is still main before recording.
concurrency:
  group: own-health
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # A secret set by name can still reach a job empty (a paste that sent nothing), and GitHub shows no
  # value to check, so this names each empty one before the run needs it. It runs before every
  # recording that connects by address, and alone when dispatched with preflight, which checks the
  # Mint box's secrets whether or not HEALTH_PG_ADDRESS is set yet: run it right after setting one.
  # Only whether each secret is empty enters the step, never its value.
  secrets:
    name: check required secrets
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: own-health
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check that the secrets this run needs are set
        env:
          NEEDED: ${{ (vars.HEALTH_PG_ADDRESS != '' || inputs.preflight == true) && 'yes' || 'no' }}
          SET_TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID != '' }}
          SET_TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET != '' }}
          SET_HEALTH_PG_PASSWORD: ${{ secrets.HEALTH_PG_PASSWORD != '' }}
        run: |
          if [ "$NEEDED" != yes ]; then
            echo "HEALTH_PG_ADDRESS is unset, so this run records to Cloud SQL and needs no secrets."
            exit 0
          fi
          empty=0
          for name in TS_OAUTH_CLIENT_ID TS_OAUTH_SECRET HEALTH_PG_PASSWORD; do
            set_var="SET_$name"
            where="--repo $GITHUB_REPOSITORY"
            if [ "$name" = HEALTH_PG_PASSWORD ]; then where="$where --env own-health"; fi
            if [ "${!set_var}" = true ]; then
              echo "$name is set."
            else
              echo "::error title=$name is empty::The secret $name is empty or missing, in this repository and in the environment own-health. Set it again with: gh secret set $name $where (paste the value into the prompt), then rerun Own health with preflight ticked."
              empty=1
            fi
          done
          if [ "$empty" = 1 ]; then exit 1; fi
          echo "Every secret the library on the Mint box needs is set. (This checks only that each is not empty, not that it is right.)"

  record:
    name: record own health
    needs: secrets
    if: >-
      !inputs.preflight && (
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    environment: own-health
    timeout-minutes: 45
    permissions:
      actions: read # download Windows evidence from the exact CI run
      contents: read
      id-token: write # GitHub's OIDC token, for the keyless sign-in
    env:
      HEALTH_WIF_PROVIDER: ${{ vars.HEALTH_WIF_PROVIDER }}
      HEALTH_SERVICE_ACCOUNT: ${{ vars.HEALTH_SERVICE_ACCOUNT }}
      HEALTH_CLOUDSQL_INSTANCE: ${{ vars.HEALTH_CLOUDSQL_INSTANCE }}
      HEALTH_PG_ADDRESS: ${{ vars.HEALTH_PG_ADDRESS }}
    steps:
      - uses: actions/checkout@v6
        with:
          # workflow_run's GITHUB_SHA is the current default branch, not the triggering commit.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Select Windows evidence for this main commit
        id: evidence
        uses: actions/github-script@v8
        with:
          script: |
            const { execFileSync } = require('node:child_process');
            const sha = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
            const { data: main } = await github.rest.git.getRef({ ...context.repo, ref: 'heads/main' });
            if (main.object.sha !== sha) {
              core.notice(`Main has moved beyond ${sha}; this older run records nothing.`);
              return;
            }
            core.setOutput('current', 'true');
            try {
              const run = context.eventName === 'workflow_run'
                ? context.payload.workflow_run
                : (await github.rest.actions.listWorkflowRuns({
                    ...context.repo, workflow_id: 'ci.yml', branch: 'main', event: 'push',
                    status: 'success', head_sha: sha, per_page: 1,
                  })).data.workflow_runs[0];
              if (!run || run.conclusion !== 'success' || run.head_sha !== sha ||
                  run.event !== 'push' || run.head_branch !== 'main') {
                core.notice(`No passing CI evidence for ${sha}; Windows-only contracts receive no credit.`);
                return;
              }
              core.setOutput('run-id', run.id);
              core.setOutput('attempt', run.run_attempt);
              core.setOutput('run-url', `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${run.id}/attempts/${run.run_attempt}`);
            } catch (error) {
              core.warning(`Windows evidence unavailable; recording local results only: ${error.message}`);
            }
      - name: Download this CI attempt's Windows evidence
        id: windows
        if: steps.evidence.outputs.run-id != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: windows-test-evidence-${{ steps.evidence.outputs.attempt }}
          path: .pgtest/windows-evidence
          run-id: ${{ steps.evidence.outputs.run-id }}
          github-token: ${{ github.token }}
      - uses: pnpm/action-setup@v6
        if: steps.evidence.outputs.current == 'true'
      - uses: actions/setup-node@v6
        if: steps.evidence.outputs.current == 'true'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.evidence.outputs.current == 'true'
      # The library on the Mint box: join the tailnet as an ephemeral tag:ci node, left at the job's end.
      - name: Join the tailnet as CI
        if: steps.evidence.outputs.current == 'true' && env.HEALTH_PG_ADDRESS != ''
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          # Wait until the box answers: a new node's peers see it only after a few seconds.
          ping: 100.97.8.31
      # Cloud SQL, only when the identity is configured and no address is set: without the identity
      # the action has nothing to sign in as, and the script below says which variables are unset.
      - name: Sign in to Google as CI's health identity
        if: steps.evidence.outputs.current == 'true' && env.HEALTH_PG_ADDRESS == '' && env.HEALTH_WIF_PROVIDER != '' && env.HEALTH_SERVICE_ACCOUNT != '' && env.HEALTH_CLOUDSQL_INSTANCE != ''
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.HEALTH_WIF_PROVIDER }}
          service_account: ${{ vars.HEALTH_SERVICE_ACCOUNT }}
      - run: pnpm check:own-health
        if: steps.evidence.outputs.current == 'true'
        env:
          STORYTREE_WINDOWS_EVIDENCE: ${{ steps.windows.outcome == 'success' && '.pgtest/windows-evidence' || '' }}
          STORYTREE_WINDOWS_RUN: ${{ steps.windows.outcome == 'success' && steps.evidence.outputs.run-url || '' }}
          # The health role's password, read only when connecting by address.
          PGPASSWORD: ${{ env.HEALTH_PG_ADDRESS != '' && secrets.HEALTH_PG_PASSWORD || '' }}
