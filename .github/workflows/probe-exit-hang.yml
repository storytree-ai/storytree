name: probe exit hang (temporary, increment_4fd4bcacb977)
on:
  pull_request:
    paths: [".github/probe/**", ".github/workflows/probe-exit-hang.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        lanes: [4, 8]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node .github/probe/exit-hang.mjs
        env:
          PROBE_LANES: ${{ matrix.lanes }}
          PROBE_MINUTES: "95"
          PROBE_OUT: ${{ runner.temp }}/probe
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-exit-hang-${{ matrix.lanes }}
          path: ${{ runner.temp }}/probe
