name: Property checks nightly

# Every property check runs once a night on main's head in the nightly tier (story Property checks, contract 3.2,
# ADR-1356 D4): `pnpm property:nightly` finds each test file importing @storytree/property-checks and runs them as
# one `pnpm test` unit on fresh random seeds with many more cases, within about ten minutes. A check that fails names
# the seed to pin into its quick tier; that failure is a red scheduled run on main, which the CI harvest reads.
#
# It can be run by hand (Actions > Property checks nightly > Run workflow) on main.

on:
  schedule:
    # 03:47 UTC, half an hour after the macOS nightly and off the hour GitHub's scheduled runs crowd.
    - cron: "47 3 * * *"
  workflow_dispatch:

concurrency:
  group: property-nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  nightly:
    name: property checks, nightly tier
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      # pnpm 10.34.7, from package.json's packageManager field.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm property:nightly
