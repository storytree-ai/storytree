name: Release rehearsal on a label

# The same rehearsal as release-rehearsal.yml (ADR-1032 D3, contract 4.22), run on a pull request when it is given the
# `rehearse` label: for a pull request that changes no release file, for example to prove a secret just set in the
# `rehearsal` environment (`gh pr edit <n> --add-label rehearse`, "Changing a release secret"). Labelling is not an event
# that can write main's cache, unlike a hand start. A pull request from a fork never runs it: it would carry the signing
# secrets.
on:
  pull_request:
    types: [labeled]

# Per pull request and label, so giving the pull request some other label never cancels its rehearsal.
concurrency:
  group: release-rehearsal-label-${{ github.event.pull_request.number }}-${{ github.event.label.name }}
  cancel-in-progress: true

# Read only: even a mistaken step could not write a release with this token.
permissions:
  contents: read

jobs:
  rehearse:
    if: github.event.label.name == 'rehearse' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/release-package.yml
    with:
      rehearsal: true
    # Only the signing secrets the packaging uses, never every secret (release-package.yml declares them).
    secrets:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

  # What a real release would publish from the platforms that built, carrying the newest real release's build for any
  # that did not (contract 4.6), read from GitHub and published nowhere. It runs when a platform failed too: that is
  # the case it shows.
  publication:
    needs: rehearse
    if: ${{ !cancelled() && github.event.label.name == 'rehearse' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rehearsal-set-*
          merge-multiple: true
          path: rehearsal-sets
      - run: node apps/desktop/release.mjs rehearse-publish rehearsal-sets
        env:
          GH_TOKEN: ${{ github.token }}
