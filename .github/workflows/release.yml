name: Release installed app

# workflow_run fires after each whole CI run completes, and only for CI runs on main. Through the merge
# queue (ADR-0796) every merge is a push to main, and CI's run on that push passes only once the merged
# commit passed in full on Linux, macOS and Windows: in the merge queue's run of that exact commit, on
# whose verdict the push stands, or in the push run itself when there is none (ci.yml: on a push to
# main the scope is everything). So that run is the release's verification: `source` takes its commit
# only if it succeeded, and nothing here runs the tests again (contract 4.6). Pull request and merge-queue runs start no release run at all.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# One release at a time, never cancelled once started. GitHub keeps one waiting run; a newer main
# commit replacing an older waiting one is right, since its release contains the older.
concurrency:
  group: installed-app-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  source:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
    steps:
      # Trusted main supplies the release policy, never a workflow_run's branch or artifacts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: source
        run: node apps/desktop/release.mjs source
        env:
          GH_TOKEN: ${{ github.token }}

  # One draft per release, made once before any platform uploads: GitHub lets two drafts share a tag,
  # so the platforms never race to create it. A draft stays invisible to installed apps.
  draft:
    needs: source
    if: needs.source.outputs.sha != ''
    runs-on: ubuntu-latest
    # The real release's secrets, falling back to the repository's while one is not set there (release-package.yml).
    environment: release
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      STORYTREE_RELEASE_VERSION: ${{ needs.source.outputs.version }}
      RELEASE_SHA: ${{ needs.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node apps/desktop/release.mjs draft
        env:
          GH_TOKEN: ${{ github.token }}
          # Only whether the Mac certificate is set, never its value; the Mac upload rewrites the sentence with Apple's answer.
          STORYTREE_MAC_SIGNED: ${{ secrets.CSC_LINK != '' }}

  # Each platform's build, install check and upload into the draft, in the workflow a rehearsal also runs on a branch
  # (release-package.yml, ADR-1032 D3), so a change to these steps is proven there before it reaches this run.
  package:
    needs: [source, draft]
    permissions:
      contents: write
    uses: ./.github/workflows/release-package.yml
    with:
      sha: ${{ needs.source.outputs.sha }}
      version: ${{ needs.source.outputs.version }}
    # Only the signing secrets the packaging uses, never every secret (release-package.yml declares them).
    secrets:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

  # Published with every platform whose build is in the draft, even when another platform's job failed (contract 4.6):
  # a platform whose build is not keeps its last good build's feed and delivery entry, carried from the earlier release.
  # Publishing is the release's last write: nothing is uploaded to it afterwards, so its assets can never change. The
  # failed platform's job leaves this run red, so the Mint watcher reruns it once; that rerun proves its build and
  # uploads nothing, and the platform's new build comes with the next version.
  publish:
    needs: [source, draft, package]
    if: ${{ !cancelled() && needs.draft.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      mac: ${{ steps.publish.outputs.mac }}
      linux: ${{ steps.publish.outputs.linux }}
    env:
      STORYTREE_RELEASE_VERSION: ${{ needs.source.outputs.version }}
      RELEASE_SHA: ${{ needs.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Publish the release with every platform whose build is complete
        id: publish
        run: node apps/desktop/release.mjs publish
        env:
          GH_TOKEN: ${{ github.token }}

  # Check (a) of decision_b0a98e971a05 D4: the published alpha one-liner, run on a fresh GitHub Mac, must
  # install this very version and bring up the app, its database and the setup check. The concurrency group keeps
  # the next release from publishing first, so "latest" is still this one. The evidence is an artifact of this run.
  # A release without a new Mac build has nothing new for it to install, so it runs only when the Mac's build is in.
  mac-acceptance:
    needs: [source, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.publish.outputs.mac == 'true' }}
    uses: ./.github/workflows/mac-acceptance.yml
    with:
      channel: alpha
      version: ${{ needs.source.outputs.version }}

  # The Linux twin (increment_46e44175295b): the published alpha one-liner on a fresh GitHub Ubuntu runner must
  # install this very version and bring up the app, its database, the setup check and the hooks. It runs only when
  # the release carries a new Linux build, for the same reason as the Mac's.
  linux-acceptance:
    needs: [source, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.publish.outputs.linux == 'true' }}
    uses: ./.github/workflows/linux-acceptance.yml
    with:
      channel: alpha
      version: ${{ needs.source.outputs.version }}
