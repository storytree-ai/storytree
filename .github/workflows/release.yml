name: Release installed app

# workflow_run fires after each whole CI run completes. Through the merge queue (ADR-0796), the
# queue's merge is a push to main, so CI's run on that push is the one that releases; the pull
# request's run (not yet merged) and the queue's own run (merge_group) select nothing. A direct
# merge by CI uses GITHUB_TOKEN, which starts no push workflow, so then the pull request's run,
# including automerge, is the one. Source selection refuses unmerged PRs; the jobs below verify the
# exact merged commit again before it can ship.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: installed-app-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  source:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
    steps:
      # Trusted main supplies the release policy, never a workflow_run's branch or artifacts.
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - id: source
        run: node apps/desktop/release.mjs source
        env:
          GH_TOKEN: ${{ github.token }}

  verify:
    needs: source
    if: needs.source.outputs.sha != ''
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    # The same limits as ci.yml's test job, which runs this full suite on main and passes: with the
    # default 3-minute unit limit and a 15-minute job, Windows agent-link and cli were killed in
    # every release attempt after 0.3.1045 (runs 38035124117, 38037855790), so nothing shipped.
    timeout-minutes: 35
    steps:
      - name: Set the test run's deadline
        shell: bash
        run: echo "STORYTREE_TEST_DEADLINE=$(( $(date +%s) + 31 * 60 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # A release is a complete artifact. Verify its exact merged commit, even if main moved.
      - run: pnpm test -- --full
        env:
          STORYTREE_UNIT_LIMIT_MS: 360000

  # One draft per release, made once before any platform uploads: GitHub lets two drafts share a tag,
  # so the platforms never race to create it. A draft stays invisible to installed apps.
  draft:
    needs: [source, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      STORYTREE_RELEASE_VERSION: ${{ needs.source.outputs.version }}
      RELEASE_SHA: ${{ needs.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node apps/desktop/release.mjs draft
        env:
          GH_TOKEN: ${{ github.token }}
          # Only whether the Mac certificate is set, never its value: the notes say if the build is notarised.
          STORYTREE_MAC_SIGNED: ${{ secrets.CSC_LINK != '' }}

  # Each platform builds on its own runner, proves its build installs and starts, and uploads only
  # its own assets (apps/desktop/release-assets.mjs) into the draft.
  package:
    needs: [source, draft]
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: Windows
            runner: windows-latest
            check: node apps/desktop/check-install.mjs
          - system: macOS
            runner: macos-latest
            check: node --import tsx apps/desktop/check-install-mac.mjs
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      STORYTREE_RELEASE_VERSION: ${{ needs.source.outputs.version }}
      RELEASE_SHA: ${{ needs.source.outputs.sha }}
      # PostHog's public project token (a repository variable, not a secret: it is public by design).
      # The private personal key never enters a build; it stays in Secret Manager for deletions.
      STORYTREE_JOURNEY_KEY: ${{ vars.POSTHOG_PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # With the Developer ID secrets set, the Mac build is signed and notarised (contract 4.20): this puts the
      # certificate in a temporary keychain, Apple's key in a file and the identity in STORYTREE_MAC_IDENTITY.
      # Without them it does nothing and the build stays ad-hoc. Windows never receives them: electron-builder
      # would read CSC_LINK as a Windows certificate.
      - name: Prepare the Mac signing keychain
        if: matrix.system == 'macOS'
        run: node apps/desktop/mac-signing.mjs prepare
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      # desktop:dist also stages each platform's bootstrap, one-liners and checksum manifest (on macOS its
      # entry, merged on publish) beside the installers; they upload with them, so first-run delivery
      # never meets a partial release.
      # APPLE_API_KEY is not set here: prepare exported it as the key file's path, which notarisation reads.
      - run: pnpm desktop:dist
        env:
          CSC_LINK: ${{ matrix.system == 'macOS' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.system == 'macOS' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY_ID: ${{ matrix.system == 'macOS' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.system == 'macOS' && secrets.APPLE_API_ISSUER || '' }}
      - run: ${{ matrix.check }}
      - name: Upload this platform's assets to the draft
        run: node apps/desktop/release.mjs upload
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Delete the Mac signing keychain and Apple's key file
        if: always() && matrix.system == 'macOS'
        run: node apps/desktop/mac-signing.mjs cleanup

  # Published only when every platform's required assets are in the draft (contract 4.6), after the
  # Mac entry is merged into storytree-delivery.json.
  publish:
    needs: [source, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      STORYTREE_RELEASE_VERSION: ${{ needs.source.outputs.version }}
      RELEASE_SHA: ${{ needs.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Publish the release once every platform's assets are complete
        run: node apps/desktop/release.mjs publish
        env:
          GH_TOKEN: ${{ github.token }}

  # Check (a) of decision_b0a98e971a05 D4: the published development one-liner, run on a fresh GitHub Mac, must
  # install this very version and bring up the app, its database and the setup check. The concurrency group keeps
  # the next release from publishing first, so "latest" is still this one. The evidence is an artifact of this run.
  mac-acceptance:
    needs: [source, publish]
    uses: ./.github/workflows/mac-acceptance.yml
    with:
      channel: development
      version: ${{ needs.source.outputs.version }}
