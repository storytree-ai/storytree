name: Release installed app

# workflow_run fires after each whole CI run completes. Through the merge queue (ADR-0796), the
# queue's merge is a push to main, so CI's run on that push is the one that releases; the pull
# request's run (not yet merged) and the queue's own run (merge_group) select nothing. A direct
# merge by CI uses GITHUB_TOKEN, which starts no push workflow, so then the pull request's run,
# including automerge, is the one. Source selection refuses unmerged PRs; the jobs below verify the
# exact merged commit again before it can ship.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: installed-app-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  source:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
    steps:
      # Trusted main supplies the release policy, never a workflow_run's branch or artifacts.
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - id: source
        run: node apps/desktop/release.mjs source
        env:
          GH_TOKEN: ${{ github.token }}

  verify:
    needs: source
    if: needs.source.outputs.sha != ''
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # A release is a complete artifact. Verify its exact merged commit, even if main moved.
      - run: pnpm test -- --full

  # One draft per release, made once before any platform uploads: GitHub lets two drafts share a tag,
  # so the platforms never race to create it. A draft stays invisible to installed apps.
  draft:
    needs: [source, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      STORYTREE_RELEASE_VERSION: ${{ needs.source.outputs.version }}
      RELEASE_SHA: ${{ needs.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node apps/desktop/release.mjs draft
        env:
          GH_TOKEN: ${{ github.token }}

  # Each platform builds on its own runner, proves its build installs and starts, and uploads only
  # its own assets (apps/desktop/release-assets.mjs) into the draft.
  package:
    needs: [source, draft]
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: Windows
            runner: windows-latest
            check: node apps/desktop/check-install.mjs
          - system: macOS
            runner: macos-latest
            check: node --import tsx apps/desktop/check-install-mac.mjs
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      STORYTREE_RELEASE_VERSION: ${{ needs.source.outputs.version }}
      RELEASE_SHA: ${{ needs.source.outputs.sha }}
      # PostHog's public project token (a repository variable, not a secret: it is public by design).
      # The private personal key never enters a build; it stays in Secret Manager for deletions.
      STORYTREE_JOURNEY_KEY: ${{ vars.POSTHOG_PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # desktop:dist also stages each platform's bootstrap, one-liners and checksum manifest (on macOS its
      # entry, merged on publish) beside the installers; they upload with them, so first-run delivery
      # never meets a partial release.
      - run: pnpm desktop:dist
      - run: ${{ matrix.check }}
      - name: Upload this platform's assets to the draft
        run: node apps/desktop/release.mjs upload
        env:
          GH_TOKEN: ${{ github.token }}

  # Published only when every platform's required assets are in the draft (contract 4.6), after the
  # Mac entry is merged into storytree-delivery.json.
  publish:
    needs: [source, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      STORYTREE_RELEASE_VERSION: ${{ needs.source.outputs.version }}
      RELEASE_SHA: ${{ needs.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Publish the release once every platform's assets are complete
        run: node apps/desktop/release.mjs publish
        env:
          GH_TOKEN: ${{ github.token }}
