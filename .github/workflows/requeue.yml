name: Requeue

# A pull request the merge queue removes after its queue run failed goes back in, once. The queue
# tests a pull request on top of main and every entry ahead of it, so its run can fail where the
# pull request's own did not: an entry ahead that failed, or a flaky run. GitHub then takes it out
# (reason `failed_checks`) and nothing puts it back: PR #725 was removed at 13:10 on 2026-10-06 with
# every one of its own checks green, and stayed out until someone re-ran its `automerge` job by hand.
# This workflow puts it back through land.yml, at the exact head commit whose latest `verify`
# passed, and land.yml reads again whether it is held (a draft, the `hold` label, closed).
#
# Bounded: one re-enqueue per verified head. It counts the queue's `failed_checks` removals since
# that head's latest `verify` finished; the first is re-enqueued, a second is left out, with an
# error saying so, so a pull request that really breaks main on top of the queue never loops. A
# push gives the head a new `verify`, and the count starts again. Any other removal (merged, a
# push, a conflict, taken out by hand) is left as it is. A pull request from a fork is never landed.

on:
  pull_request:
    branches: [main]
    types: [dequeued]

concurrency:
  group: requeue-${{ github.event.pull_request.number }}

permissions:
  contents: read

jobs:
  decide:
    name: removed for failed checks, head verified?
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: read
      pull-requests: read
    outputs:
      requeue: ${{ steps.decide.outputs.requeue }}
    steps:
      - name: Count failed-checks removals since the head's verify
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?check_name=verify&per_page=100" \
            --jq '.check_runs | sort_by(.started_at) | last | if . == null then "none" else "\(.status) \(.conclusion) \(.completed_at)" end')
          echo "verify on $SHA: $latest"
          requeue=false
          read -r status conclusion verified_at <<< "$latest"
          if [ "$status $conclusion" != "completed success" ]; then
            echo "The head's own verify has not passed: not re-enqueued. A push, or \`gh pr ready\`, runs it."
          else
            # The queue's removals since verify passed this head, oldest first: their reasons.
            reasons=$(gh api graphql -f owner="${GITHUB_REPOSITORY%/*}" -f name="${GITHUB_REPOSITORY#*/}" -F pr="$PR" \
              -f query='query($owner: String!, $name: String!, $pr: Int!) { repository(owner: $owner, name: $name) { pullRequest(number: $pr) { timelineItems(itemTypes: [REMOVED_FROM_MERGE_QUEUE_EVENT], last: 50) { nodes { ... on RemovedFromMergeQueueEvent { createdAt reason } } } } } }' \
              --jq "[.data.repository.pullRequest.timelineItems.nodes[] | select(.createdAt > \"$verified_at\") | .reason] | join(\" \")")
            last=${reasons##* }
            failed=0
            for reason in $reasons; do
              if [ "$reason" = failed_checks ]; then failed=$((failed + 1)); fi
            done
            echo "Removed from the queue since verify passed at $verified_at: ${reasons:-none}."
            if [ "$last" != failed_checks ]; then
              echo "The latest removal was not for failed checks: left as it is."
            elif [ "$failed" -gt 1 ]; then
              echo "::error::The merge queue's run failed for $SHA $failed times, although its own verify passed: not re-enqueued again. Read the queue run's log; a push re-verifies and lets it back in."
            else
              requeue=true
              echo "Removed after a failed queue run, with its own verify passed: re-enqueuing $SHA once."
            fi
          fi
          echo "requeue=$requeue" >> "$GITHUB_OUTPUT"

  land:
    name: land
    needs: decide
    if: needs.decide.outputs.requeue == 'true'
    permissions:
      actions: write # to start the own-health workflow on main once merged
      contents: write
      pull-requests: write
    uses: ./.github/workflows/land.yml
    with:
      pr: ${{ github.event.pull_request.number }}
      pr-id: ${{ github.event.pull_request.node_id }}
      sha: ${{ github.event.pull_request.head.sha }}
    secrets:
      MERGE_QUEUE_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
