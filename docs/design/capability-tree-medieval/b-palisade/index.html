 with bounded pages and a continuation cursor, sees edits and retirement, and filters before records leave Postgres. Ranked search is unchanged."},{"id":"contract_8a7e34001d2f","title":"14.12 · A long note's late paragraph is embedded: each chunk fits the 512 tokens the model reads, so a search finds the note by what that paragraph says"},{"id":"contract_a7dc4aeca629","title":"14.13 · Behind a proxy that HTTPS_PROXY or HTTP_PROXY names, the embedding model's first-use download goes through that proxy (NO_PROXY honoured), and a failed load behind a proxy names the hosts the proxy must allow"},{"id":"contract_c626c506731f","title":"14.14 · The embedding model loads only from one pinned revision, and only files whose SHA-256 matches the hashes committed in the repo; a file that differs, or one the pinned model does not list, is deleted and the load refused naming it (with both hashes), so search falls back to words and says why"},{"id":"contract_955fd6ef5d56","title":"14.15 · A question is embedded with the model's query prefix, and an artifact's chunks never are"}]},{"id":"capability_a6d2887aed63","title":"15 · Connection by address","description":"Instead of the local app's Postgres or Cloud SQL with Google sign-in, storytree reaches any Postgres by its address (Neon, Supabase, RDS, self-hosted, Cloud SQL with an ordinary user), its password resolved as a key.","word":"healthy","parked":false,"lines":388,"contracts":[{"id":"contract_783c0e806fde","title":"15.1 · A library at a Postgres address, with its password saved as the `postgres` key, opens, writes and reads a project as a password-authenticated role."},{"id":"contract_d15292202135","title":"15.2 · With no password saved for the library (no `postgres` key and no PGPASSWORD), connecting is refused saying so and how to save one, before anything reaches the server."},{"id":"contract_745f2da24753","title":"15.3 · A password the server refuses and a host that cannot be reached are each refused as their own problem, with what to fix, and never show the password."},{"id":"contract_1d50d9449880","title":"15.4 · A remote address gets the password only after its certificate is checked"},{"id":"contract_3133f72994df","title":"15.5 · The routed library's connection string, signed in with its key, reaches the database it names, for psql; it stores nothing, and no saved password or a Cloud SQL library is refused saying why"},{"id":"contract_5ca137a4ffab","title":"15.6 · A wss:// library address reaches the library over HTTPS, through Access and HTTPS_PROXY"}]},{"id":"capability_984398616605","title":"16 · The command schema","description":"The shapes a story declares its verbs with (Verb, VerbFamily, VerbInput, VerbAnswer, VerbRefusal, VerbContext and the rest, the verb helper and the mounted guard), in packages/library/src/verbs/verb.ts, which every story downstream imports and each front door reads. Moved from Project and caller's capability 4 · The verb contract by ADR-1035 D1; the door reading went to the hosts (the command line's 13 · Reading a command, the MCP server's toolInput).","word":"healthy","parked":false,"lines":173,"contracts":[{"id":"contract_1b7316fe090d","title":"16.1 · A verb is declared once with a face on each door or why a door lacks one, and its refusal is a misuse only when it says so, carrying the steps that do the job instead"},{"id":"contract_f3b30372c746","title":"16.2 · A verb declares who calls it: an agent, a person or both"}]},{"id":"capability_dce9495fcaed","title":"17 · The library's commands","description":"The library declares its own storytree library family (search, phrase, links, related, new, read, edit, refile, retire, list, history, revert, undo) in its manifest, which the command line mounts first among its families (ADR-1035 D3). Its context is the caller's with the calling session's claims and the contract numbers a capability's story package's tests carry, which the door hands it.\n","word":"healthy","parked":false,"lines":1017,"contracts":[{"id":"contract_993db448768c","title":"17.1 · The library declares the library family first among storytree's families, its thirteen verbs as commands, then capability 27's three, and none as a tool; a verb reads a phrase from @file in the caller's folder, refile rewrites an artifact as another kind under its id, and edit run by a session holding an increment holds a planned record's change on it\n"},{"id":"contract_fb8dd40667f3","title":"17.2 · The library declares search_notes, open, write_note and correct_note as tools and none as a command; each artifact they show is handed to the door as a read, found as the session last saw it, and an artifact written with no place goes onto the shelf of the capability the session claimed last, inside the cover it opened last"},{"id":"contract_1c6a66c42301","title":"17.3 · library edit project-anchor --what … --audience … writes the project's anchor, making it on its first write and refusing any other field with nothing written, and library read reads it back; a story takes no audience (ADR-1085 D1, ADR-1096)"},{"id":"contract_ef4113c05445","title":"17.4 · One field round-trips byte for byte: library read --field and the open tool's field give a record's stored value exactly, and library edit @file writes it back unchanged"},{"id":"contract_f798739bfeb3","title":"17.5 · library edit pr-cutover --at … --repository … writes the repository cut-over, the old repository by default the name's -history and none when it was deleted; refused without both, or with another field, with nothing written"},{"id":"contract_fd194d241569","title":"17.6 · library read says a record of a plugin's kind no mounted plugin declares is dormant"},{"id":"contract_e389469525fc","title":"17.7 · The open tool opens a record of a plugin's kind whole, as library read does, said dormant when no mounted plugin declares it"},{"id":"contract_8b493e326ae1","title":"17.8 · library revert <id> --to <seq> --read <seq> [--reason …] reverts a record to an entry library history shows, retired ones included, with the session as writer; a stale --read is refused naming the newest entry, and a session holding an increment is refused a planned record's revert, which cannot wait on the increment as an edit does."},{"id":"contract_1f3dad379662","title":"17.9 · library undo <writer> [--reason …] runs as a write and reverts every record the writer wrote to before their first write to it, retiring what they made, and lists each; refused with nothing written, naming the record and its later writer, where another writer wrote since, and refused for a session holding an increment when a record is a planned one; a writer who wrote nothing has nothing to revert.\n"},{"id":"contract_9a7decb8e17c","title":"17.10 · The library declares the fyi family: fyi new records an FYI, by the caller unless --by names another, fyi list lists the unheard ones oldest first, and fyi heard marks them heard so the list no longer shows them; none is a tool (ADR-1184 D3)"},{"id":"contract_cbe3c1b037ab","title":"17.11 · library history shows, under each write made after its session read outside text, what was read"},{"id":"contract_d6a05bb5983b","title":"17.12 · library edit --remove <field> removes an optional field, keeping the record and its other fields; a field the kind requires, one also given a value, or one on a story, capability or contract is refused with nothing written"},{"id":"contract_2909a118b794","title":"17.13 · library new capability, run by a session holding an increment, judges the story's capability numbers as that increment's pending changes would leave it: a number a pending move out of the story or a pending retirement frees is given, and one a pending move into the story brings is refused"},{"id":"contract_e8074ecf2272","title":"17.14 · library list, search and phrase say how many records of a plugin kind no mounted plugin declares the library holds, that they are dormant here, and the command that mounts the plugin, or that the factory lacks it"}]},{"id":"capability_73c014cf4352","title":"27 · Fixed data questions","description":"A few fixed questions about the library's data, as library commands: how many records of each kind and status, the latest changes, every record one writer wrote as a diff, a record by title words, a decision by its number. Each answers in milliseconds with at most 20 rows (one writer's diff shows all their records), for voice and for anyone at the command line.\n","word":"healthy","parked":false,"lines":218,"contracts":[{"id":"contract_6db838dfb0cb","title":"27.1 · library count tallies live records by kind and status, and open increments by arc, leaving health out"},{"id":"contract_f39659fa486b","title":"27.2 · library changes lists the latest changes newest first by sequence number, at most 20, health left out"},{"id":"contract_36349722dc10","title":"27.3 · library find lists live records whose title holds every word, at most 20, long titles cut"},{"id":"contract_728badacf5ee","title":"27.4 · library read takes a decision's number, 1103 or ADR-1103, in place of its id"},{"id":"contract_27649a497b03","title":"27.5 · library changes --actor <writer> lists every record the writer wrote, health left out, by id: created, updated by N writes, or retired with its reason, each changed field from before their first write to after their last, and the first later writer and entry where another wrote since; it takes no --limit.\n"}]}],"openWork":[{"arc":"arc_238ac88fdb14","arcTitle":"Cloud SQL sign-in, kept in the back pocket","increment":"increment_dc514c1a7edb","title":"Run the live Cloud SQL checks and record their health","status":"proposal","capabilities":["capability_a954e1eb16f6"]}],"layout":{"width":1090,"height":820,"island":[[920.7,410],[920.9,424.5],[920.3,439],[918.9,453.5],[916.7,467.8],[913.7,482.1],[909.9,496.3],[905.4,510.2],[900.1,524],[894.2,537.5],[887.5,550.7],[880.2,563.6],[872.2,576.3],[863.7,588.5],[854.6,600.5],[844.9,612],[834.7,623.2],[824.1,633.9],[813,644. const wordOf = (c) => (c.parked ? 'parked' : c.word in WORDS ? c.word : 'untested');
const el = (name, attrs = {}, parent) => {
  const node = document.createElementNS(NS, name);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  if (parent) parent.appendChild(node);
  return node;
};
const pts = (poly) => poly.map(([x, y]) => `${x},${y}`).join(' ');
const esc = (s) => String(s).replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[ch]);
// A title's backticks become code, as the panel shows them today.
const prose = (s) => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');
const split = (title) => { const m = /^(\d+(?:\.\d+)?) · (.*)$/s.exec(title); return m ? { num: m[1], name: m[2] } : { num: '', name: title }; };

// Sample work, used only when the box is ticked: clearly made up, so a wrench shows several arcs.
const SAMPLE = [
  { arc: 'arc_sample_a', arcTitle: 'Sample arc: commands report their own timing', increment: 'increment_sample_1', title: 'Sample: the library commands print how long each read took', status: 'proposal', capabilities: [caps.find((c) => c.title.startsWith('17 ·'))?.id], sample: true },
  { arc: 'arc_sample_b', arcTitle: 'Sample arc: a quieter command line', increment: 'increment_sample_2', title: 'Sample: library commands share one error layout', status: 'active', capabilities: [caps.find((c) => c.title.startsWith('17 ·'))?.id, caps.find((c) => c.title.startsWith('10 ·'))?.id], sample: true },
  { arc: 'arc_sample_b', arcTitle: 'Sample arc: a quieter command line', increment: 'increment_sample_3', title: 'Sample: work-in-flight lists drop repeated arcs', status: 'proposal', capabilities: [caps.find((c) => c.title.startsWith('10 ·'))?.id], sample: true },
];
const work = () => (document.getElementById('sample').checked ? [...DATA.openWork, ...SAMPLE] : DATA.openWork);

const svg = document.getElementById('tree');
svg.setAttribute('viewBox', `0 0 ${L.width} ${L.height}`);
svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
const defs = el('defs', {}, svg);
// Late-afternoon light from the west: warm on the left, cooler to the east.
defs.innerHTML = `
  <linearGradient id="light" x1="0" y1="0" x2="1" y2="0.6"><stop offset="0" stop-color="#ffd79a" stop-opacity="0.32"/><stop offset="0.55" stop-color="#ffd79a" stop-opacity="0.06"/><stop offset="1" stop-color="#2d3b52" stop-opacity="0.12"/></linearGradient>
  <filter id="shade" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="2.2" dy="2" stdDeviation="1.2" flood-color="#3a2410" flood-opacity="0.45"/></filter>
  <clipPath id="island-clip"><polygon points="${pts(L.island)}"/></clipPath>`;
el('rect', { x: 0, y: 0, width: L.width, height: L.height, fill: 'var(--sea)' }, svg);
el('polygon', { points: pts(L.island), fill: 'none', stroke: 'var(--shore)', 'stroke-width': 16, 'stroke-linejoin': 'round' }, svg);

const layers = Object.fromEntries(['fields', 'lanes', 'fences', 'gates', 'labels', 'wrenches'].map((name) => [name, el('g', { class: `layer-${name}` }, svg)]));
const picked = { node: null };
const pick = (node, show) => {
  picked.node?.classList.remove('picked');
  picked.node = node; node?.classList.add('picked');
  show();
};

// Fields: one fill per health word, with furrows ploughed at the field's own angle so neighbours read as a patchwork.
caps.forEach((c, i) => {
  const f = L.fields[i], word = WORDS[wordOf(c)];
  const angle = (i * 47) % 180;
  const pattern = el('pattern', { id: `furrows-${i}`, width: 7, height: 7, patternUnits: 'userSpaceOnUse', patternTransform: `rotate(${angle})` }, defs);
  el('line', { x1: 0, y1: 0, x2: 0, y2: 7, stroke: word.furrow, 'stroke-width': 1.4, 'stroke-opacity': 0.45 }, pattern);
  const g = el('g', { class: 'field', 'data-capability': c.id }, layers.fields);
  el('polygon', { class: 'field-fill', points: pts(f.polygon), fill: word.fill }, g);
  el('polygon', { points: pts(f.polygon), fill: `url(#furrows-${i})` }, g);
  el('polygon', { class: 'field-edge', points: pts(f.polygon), fill: 'none', stroke: 'none' }, g);
  g.addEventListener('click', () => pick(g, () => showField(i)));
});
el('polygon', { points: pts(L.island), fill: 'url(#light)', 'pointer-events': 'none' }, layers.fields);

// Lanes: packed earth from a field's middle to one of its gates, meeting the fence square on.
const gateById = new Map(L.gates.map((g) => [g.id, g]));
const laneD = (from, gate) => {
  const [cx, cy] = L.fields[from].centre, rad = (gate.angle * Math.PI) / 180;
  let nx = -Math.sin(rad), ny = Math.cos(rad);
  if ((cx - gate.x) * nx + (cy - gate.y) * ny < 0) { nx = -nx; ny = -ny; }
  const reach = Math.min(40, Math.hypot(cx - gate.x, cy - gate.y) * 0.5);
  return `M${cx},${cy} Q${gate.x + nx * reach},${gate.y + ny * reach} ${gate.x},${gate.y}`;
};
const track = (d, cls, parent, onClick) => {
  const g = el('g', { class: cls }, parent);
  el('path', { class: 'lane-edge', d, fill: 'none', stroke: 'var(--track-edge)', 'stroke-width': 7.5, 'stroke-linecap': 'round', 'stroke-opacity': 0.75 }, g);
  el('path', { class: 'lane-top', d, fill: 'none', stroke: 'var(--track)', 'stroke-width': 5, 'stroke-linecap': 'round' }, g);
  el('path', { class: cls === 'road' ? 'road-hit' : 'lane-hit', d, 'stroke-width': 16 }, g);
  g.addEventListener('click', (event) => { event.stopPropagation(); pick(g, onClick); });
  return g;
};
for (const lane of L.lanes) track(laneD(lane.field, gateById.get(lane.gate)), 'lane', layers.lanes, () => showPathways(lane.links, { field: lane.field }));
for (const road of L.roads) {
  const [cx, cy] = L.fields[road.from].centre;
  const g = track(`M${cx},${cy} L${road.shore[0]},${road.shore[1]} L${road.end[0]},${road.end[1]}`, 'road', layers.lanes, () => showRoad(road));
  const { num, name } = split(road.title);
  const tag = el('g', { transform: `translate(${road.end[0] + 6},${road.end[1]})` }, g);
  const box = el('rect', { x: 0, y: -21, height: 40, rx: 5, fill: '#f6ead0', stroke: 'var(--ink-soft)', 'stroke-width': 1, filter: 'url(#shade)' }, tag);
  const lines = [el('text', { x: 8, y: -5, class: 'label-name' }, tag), el('text', { x: 8, y: 11, class: 'label-number' }, tag)];
  lines[0].textContent = `to ${road.story}`; lines[1].textContent = `${num} · ${name}`;
  box.setAttribute('width', Math.max(...lines.map((t) => t.getComputedTextLength())) + 16);
}

// Fences: a palisade of log tops on every border, broken where a gate stands.
const GAP = 17;
for (const fence of L.fences) {
  const [x1, y1] = fence.from, [x2, y2] = fence.to, len = Math.hypot(x2 - x1, y2 - y1);
  const cuts = L.gates.filter((g) => g.a === fence.a && g.b === fence.b).map((g) => Math.hypot(g.x - x1, g.y - y1)).sort((a, b) => a - b);
  let at = 0;
  const pieces = [];
  for (const cut of cuts) { pieces.push([at, cut - GAP]); at = cut + GAP; }
  pieces.push([at, len]);
  for (const [s, e] of pieces) {
    if (e - s < 1) continue;
    const p = (t) => [x1 + ((x2 - x1) * t) / len, y1 + ((y2 - y1) * t) / len];
    const [ax, ay] = p(s), [bx, by] = p(e);
    const g = el('g', { filter: 'url(#shade)' }, layers.fences);
    el('line', { x1: ax, y1: ay, x2: bx, y2: by, stroke: 'var(--log-base)', 'stroke-width': 4.5, 'stroke-linecap': 'round' }, g);
    el('line', { x1: ax, y1: ay, x2: bx, y2: by, stroke: 'var(--log)', 'stroke-width': 5.2, 'stroke-linecap': 'round', 'stroke-dasharray': '0.1 5.6' }, g);
    el('line', { x1: ax, y1: ay, x2: bx, y2: by, stroke: 'var(--log-top)', 'stroke-width': 2.2, 'stroke-linecap': 'round', 'stroke-dasharray': '0.1 5.6', transform: 'translate(-0.6,-0.6)' }, g);
  }
}

// Gates: a plain five-bar farm gate between two stout posts, across the gap.
for (const gate of L.gates) {
  const g = el('g', { class: 'gate', transform: `translate(${gate.x},${gate.y}) rotate(${gate.angle})` }, layers.gates);
  el('circle', { class: 'gate-ring', r: 22, fill: 'none', stroke: 'none', opacity: 0 }, g);
  const body = el('g', { filter: 'url(#shade)' }, g);
  el('rect', { x: -14, y: -3.4, width: 28, height: 6.8, rx: 1.2, fill: 'var(--gate)', stroke: 'var(--log-base)', 'stroke-width': 1.3 }, body);
  for (const x of [-7, 0, 7]) el('line', { x1: x, y1: -3.4, x2: x, y2: 3.4, stroke: 'var(--log-base)', 'stroke-width': 1.1 }, body);
  el('line', { x1: -14, y1: 3.4, x2: 14, y2: -3.4, stroke: 'var(--log-base)', 'stroke-width': 1.1 }, body);
  for (const x of [-18, 18]) el('rect', { x: x - 4, y: -4, width: 8, height: 8, rx: 1.5, fill: 'var(--log-base)' }, body);
  el('circle', { class: 'gate-hit', r: 18 }, g);
  g.addEventListener('click', (event) => { event.stopPropagation(); pick(g, () => showPathways(gate.links, { gate })); });
}

// Labels: each field's number on its own yard, and its name where the field has room for it.
caps.forEach((c, i) => {
  const f = L.fields[i], { num, name } = split(c.title), [x, y] = f.centre;
  const g = el('g', { transform: `translate(${x},${y})`, 'data-label': i }, layers.labels);
  el('circle', { r: 10, fill: '#f6ead0', stroke: 'var(--track-edge)', 'stroke-width': 1.2 }, g);
  el('text', { class: 'label-number', 'text-anchor': 'middle', y: 4 }, g).textContent = num;
  if (f.area > 9000) el('text', { class: 'label-name', 'text-anchor': 'middle', y: 24 }, g).textContent = name;
});

// Wrenches: one per field that open work names, however many increments do, on the gate its work goes through.
// An open-ended spanner, lying along x: a handle and a jawed head.
const WRENCH = 'M-12,-2.2 L4,-2.2 L5.5,-5 A6.5,6.5 0 0 1 14.5,-4.2 L10.8,-2 L10.8,2 L14.5,4.2 A6.5,6.5 0 0 1 5.5,5 L4,2.2 L-12,2.2 A2.2,2.2 0 0 1 -12,-2.2 Z';
function drawWrenches() {
  layers.wrenches.replaceChildren();
  const fields = new Map();
  for (const item of work()) for (const id of item.capabilities) {
    if (!fields.has(id)) fields.set(id, []);
    fields.get(id).push(item);
  }
  for (const [id, items] of fields) {
    const i = caps.findIndex((c) => c.id === id), gate = gateById.get(L.wrenchGate[i]);
    if (gate === undefined) continue;
    const sample = items.every((item) => item.sample);
    // Laid just on the field's side of its gate, so the gate still shows.
    const [cx, cy] = L.fields[i].centre, d = Math.hypot(cx - gate.x, cy - gate.y);
    const x = gate.x + ((cx - gate.x) / d) * 9, y = gate.y + ((cy - gate.y) / d) * 9;
    // A field whose wrench lies where its name would be has its name written above its number instead.
    const name = layers.labels.querySelector(`[data-label="${i}"] .label-name`);
    if (name !== null && y > cy && y - cy < 50 && Math.abs(x - cx) < 80) name.setAttribute('y', -16);
    const g = el('g', { class: 'wrench', transform: `translate(${x},${y})` }, layers.wrenches);
    el('circle', { class: 'wrench-ring', r: 19, fill: 'none', stroke: 'var(--pick)', 'stroke-width': 3, opacity: 0 }, g);
    const tool = el('g', { transform: 'rotate(-35) scale(1.35)', filter: 'url(#shade)' }, g);
    el('path', { d: WRENCH, fill: 'var(--iron)', stroke: '#fff3dc', 'stroke-width': 1.6, 'stroke-linejoin': 'round', 'stroke-dasharray': sample ? '2 1.5' : 'none' }, tool);
    if (sample) { const t = el('text', { class: 'label-name', x: 14, y: 4 }, g); t.textContent = 'sample'; }
    el('circle', { class: 'wrench-hit', r: 18 }, g);
    g.addEventListener('click', (event) => { event.stopPropagation(); pick(g, () => showWork(i, items)); });
  }
}
drawWrenches();
document.getElementById('sample').addEventListener('change', (event) => {
  document.getElementById('sample-note').hidden = !event.target.checked;
  drawWrenches(); pick(null, showStory);
});
svg.addEventListener('click', (event) => { if (event.target === svg || event.target.tagName === 'rect') pick(null, showStory); });

// The legend: only what this island shows.
const present = [...new Set(caps.map(wordOf))];
const legend = document.getElementById('legend');
const swatch = (inner) => `<svg viewBox="0 0 22 14">${inner}</svg>`;
legend.innerHTML = [
  ...present.map((w) => [swatch(`<rect x="1" y="1" width="20" height="12" rx="2" fill="${WORDS[w].fill}" stroke="rgb(0 0 0 / 0.25)"/>`), `${WORDS[w].name}: ${WORDS[w].says}`]),
  [swatch('<line x1="2" y1="7" x2="20" y2="7" stroke="#4b2f1a" stroke-width="4.5" stroke-linecap="round"/><line x1="2" y1="7" x2="20" y2="7" stroke="#8a5a30" stroke-width="5.2" stroke-linecap="round" stroke-dasharray="0.1 5.6"/>'), 'Palisade: the border between two capabilities'],
  [swatch('<path d="M1,7 L21,7" stroke="#8f6b3f" stroke-width="7"/><path d="M1,7 L21,7" stroke="#d2b07a" stroke-width="4.6"/>'), 'Track: one capability calls another'],
  [swatch('<rect x="5" y="4.5" width="12" height="5" fill="#e0bb82" stroke="#4b2f1a"/><line x1="9" y1="4.5" x2="9" y2="9.5" stroke="#4b2f1a"/><line x1="13" y1="4.5" x2="13" y2="9.5" stroke="#4b2f1a"/><rect x="1" y="4" width="4" height="6" fill="#4b2f1a"/><rect x="17" y="4" width="4" height="6" fill="#4b2f1a"/>'), 'Gate: where a track crosses a palisade'],
  [swatch(`<g transform="translate(10,7) rotate(-20) scale(0.7)"><path d="${WRENCH}" fill="#4a4f57" stroke="#fff3dc" stroke-width="1.6"/></g>`), 'Wrench: open work wants this capability'],
].map(([mark, words]) => `${mark}<span>${words}</span>`).join('');

// The panel.
const panel = document.getElementById('panel');
const title = DATA.story.title;
document.getElementById('story-title').textContent = title;
const totalLines = caps.reduce((s, c) => s + c.lines, 0);
const head = (extra = '') => `<h1>${esc(title)}</h1><div class="sub">${caps.length} capabilities · ${totalLines.toLocaleString('en')} lines of code, tests left out · measured ${DATA.measuredAt.slice(0, 10)}</div>${extra}`;
const contractList = (contracts) => `<ol>${contracts.map((k) => { const { num, name } = split(k.title); return `<li><span class="num">${esc(num)}</span>${prose(name)}</li>`; }).join('')}</ol>`;
const wordChip = (c) => { const w = wordOf(c); return `<span class="word" style="background:${WORDS[w].fill}">${WORDS[w].name}</span>`; };
function showStory() {
  panel.innerHTML = head(`<p class="hint">Each field is one capability, its size its lines of code. Click a field for what it does and its contracts, a track or a gate for what it carries, and a wrench for the work that wants that field.</p>`);
}
function showField(i) {
  const c = caps[i];
  panel.innerHTML = head(`<h3>${esc(c.title)}</h3><p>${wordChip(c)} &nbsp;${c.lines.toLocaleString('en')} lines</p><p>${prose(c.description ?? '')}</p><h4>Contracts (${c.contracts.length})</h4>${contractList(c.contracts)}`);
}
const pathwayById = new Map(L.pathways.map((p) => [p.id, p]));
function showPathways(ids, where) {
  const intro = where.gate !== undefined
    ? `<h3>Gate between ${esc(caps[where.gate.a].title)} and ${esc(caps[where.gate.b].title)}</h3>`
    : `<h3>Track in ${esc(caps[where.field].title)}</h3>`;
  const parts = ids.map((id) => {
    const p = pathwayById.get(id), callee = caps[p.to];
    const through = p.gates.length > 1 ? ` <span class="hint">(the two fields do not touch, so it crosses ${p.gates.length} palisades)</span>` : '';
    return `<p><b>${esc(caps[p.from].title)}</b> calls <b>${esc(callee.title)}</b>${through}</p><h4>It carries ${esc(split(callee.title).name)}'s contracts (${callee.contracts.length})</h4>${contractList(callee.contracts)}`;
  });
  panel.innerHTML = head(intro + (ids.length > 1 ? `<p class="hint">${ids.length} tracks run through here.</p>` : '') + parts.join(''));
}
function showRoad(road) {
  panel.innerHTML = head(`<h3>Road off the island</h3><p><b>${esc(caps[road.from].title)}</b> calls <b>${esc(road.title)}</b>, in the story ${esc(road.story)}.</p><h4>It carries ${esc(split(road.title).name)}'s contracts (${road.contracts.length})</h4>${contractList(road.contracts)}`);
}
function showWork(i, items) {
  const arcs = new Map();
  for (const item of items) { if (!arcs.has(item.arc)) arcs.set(item.arc, { title: item.arcTitle, sample: item.sample, increments: [] }); arcs.get(item.arc).increments.push(item); }
  const list = [...arcs].map(([id, arc]) => `<div class="arc"><div class="arc-title">${esc(arc.title)}${arc.sample ? '<span class="sample-tag">sample</span>' : ''}</div><div class="id">${esc(id)}</div><ul>${arc.increments.map((inc) => `<li>${esc(inc.title)} <span class="id">${esc(inc.increment)} · ${inc.status === 'active' ? 'in progress' : 'waiting to start'}</span></li>`).join('')}</ul></div>`).join('');
  panel.innerHTML = head(`<h3>Work wanting ${esc(caps[i].title)}</h3><p class="hint">${items.length} open increment${items.length === 1 ? '' : 's'} on ${arcs.size} arc${arcs.size === 1 ? '' : 's'}; the field carries one wrench however many there are.</p>${list}`);
}
showStory();
window.mock = { pick: (selector) => document.querySelector(selector).dispatchEvent(new MouseEvent('click', { bubbles: true })) };
</script>
</body>
</html>
