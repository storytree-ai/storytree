<style>

  .story-panel p { margin: 4px 0 8px; }

  .word { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; border: 1px solid rgb(0 0 0 / 0.2); }

const DATA = {"story":{"id":"story_754e87e7d531","title":"The library"},"measuredAt":"2026-11-02T02:27:47.862Z","capabilities":[{"id":"capability_5e0362aae607","title":"1 · Project libraries","description":"Each project gets its own library, a separate database on one Postgres server, created the first time the project is opened, with its tables set up automatically, and brought up to date by the next open after storytree adds to them. Opening a project whose tables are already current touches no table, so an account let only read, or write a few kinds of record, can open it too. Storytree can list the projects on the server, and nothing written in one project can ever show up in another, with one exception: a product project names the user's factory, and reads its system (roles, notes and checks) from it, its own records of the same kind and title winning (ADR-1040).","word":"healthy","parked":false,"lines":1977,"contracts":[{"id":"contract_029ae7c7f781","title":"1.1 · `openProject(\"site\")` on a server with no storytree databases creates the project's database and its tables; a project set up before a table changed gains what was added since at its next open."},{"id":"contract_9114d9634c11","title":"1.2 · Opening the same project again succeeds and changes nothing (no error, no second database, its records are untouched)."},{"id":"contract_aa9cc9f300f2","title":"1.3 · After opening \"site\" and \"app\", `listProjects()` returns exactly `[\"app\", \"site\"]`. Databases on the server that are not storytree projects are never listed."},{"id":"contract_908e6b967957","title":"1.4 · A record saved in \"site\" cannot be read from \"app\"."},{"id":"contract_e1281d3d30be","title":"1.5 · A project name that is not lower-case letters, digits and single hyphens (1–40 characters, starting with a letter or digit) is refused before anything touches the server, and the error names the rule."},{"id":"contract_54daaedc1f9c","title":"1.6 · `snapshot(\"site\")` returns every record of the project and its whole history, as they stood at one moment, while writes go on."},{"id":"contract_cc464355d751","title":"1.7 · `restore(\"copy\", snapshot)` into a project with no records and no history gives back the same records and the same history, sequence numbers, actors and times included, and the next write continues after them."},{"id":"contract_b7b65435710c","title":"1.8 · Restoring into a project that holds any record or any history is refused, naming the project, and writes nothing."},{"id":"contract_91a7cd3e1bdd","title":"1.9 · A local database that accepts TCP but never completes a fresh handshake is refused at a 10-second connection deadline by default (ADR-1163 D1), or at the deadline the caller gives, for both the server and project pools, with an actionable \"storytree isn't reachable\" answer that says the database took longer than that to answer and the computer may be busy. This includes library opens made by the CLI. A later call recovers once the database answers."},{"id":"contract_e7f8bb1aa247","title":"1.10 · Opening a project whose tables are current runs no table setup and writes nothing, so an account that may only read its tables (not their owner, no right to create in its schema) opens it and reads its records."},{"id":"contract_d017d0b38ff6","title":"1.11 · Opening a project whose tables are not current, as an account that may not change them (no CREATE on its schema, or not holding the owner's rights over its tables), changes nothing: no table statement runs and no memory is converted. A project set up before opens as its tables stand, reads and writes as the account's grants allow, and warns once per process per project, naming the project, the account and the role owning its database. A project never set up is refused with a ConnectionError (`project-owner`) naming the project and the account and saying that only the role owning its database may set it up. Its owner's next open sets the tables up as before.\n"},{"id":"contract_62286d087ee9","title":"1.12 · `dropProject(name)` deletes the project's database, with every record and all its history, for every machine using the server; it is listed no more, other projects are untouched, and an unknown project is refused. An open that only reaches an existing project (`openProject(name, { create: false })`, how a folder that names a project opens it) refuses a deleted one as gone and never makes it again."},{"id":"contract_6dc414d430df","title":"1.13 · Closing a server connection waits for project and own-database openings already in flight, releases every pool they create, and refuses new openings once closing starts."},{"id":"contract_749ba2c36b10","title":"1.14 · Loopback database connections refuse cleartext and MD5 password requests before sending credential material, for both admin and project pools; SCRAM and passwordless test connections still work."},{"id":"contract_c20af49d1c15","title":"1.15 · A project records whether it is the user's factory or a product naming its factory, and refuses to be both"},{"id":"contract_a199cc8729aa","title":"1.16 · A product project reads its factory's roles, notes and checks, and its own record of the same kind and title wins"},{"id":"contract_bf884bd481e2","title":"1.17 · A product's link to a system record it retired reads the record of that kind and title: its own, else its factory's"},{"id":"contract_726dd9d3e276","title":"1.18 · An edit through a product of a system record it reads from its factory writes the product's own copy, which wins, and retiring one hides it from the product; the factory is unchanged"},{"id":"contract_a65339e5b6fc","title":"1.19 · A product's inherited records are the factory's system records it reads and holds none of its own for"},{"id":"contract_02da8211a3ee","title":"1.20 · A local url naming a connect_timeout (libpq's, in seconds) longer than the given deadline gives its handshakes that deadline, on both admin and project pools, and the refusal says so; a url naming none, or a shorter one, keeps the given deadline (10 seconds by default)"},{"id":"contract_1f6d2b6fb222","title":"1.21 · A project opened with system switches leaves each switched-off role, check and note out of its lists, selections and searches, a product's factory's included; a record's own title or id beats its group, which beats all; reading one by its id still finds it, and the plan is never switched off"},{"id":"contract_64dcbe43a3c8","title":"1.22 · Each history entry carries the server's own time and the account that wrote it, and no writer may change or remove one\n"},{"id":"contract_a527cd47f7a6","title":"1.23 · An outside writer's role, fenced to its plugin's kinds, inserts a record of its own kind, and each history entry carries its role in recorded_by"},{"id":"contract_0b55599fccb8","title":"1.24 · An outside writer's role is refused a core kind, another plugin's kind, an update, a delete and any change to the tables"},{"id":"contract_ae7200525d86","title":"1.25 · An outside writer whose plugin declares updates may change its own kind's records, and still no other record nor another kind"},{"id":"contract_82223cb0b21a","title":"1.26 · A project opened with a plugin's kinds writes and reads them; opened without them, a record of that kind reads dormant"},{"id":"contract_d94cee1e8911","title":"1.27 · fenceProject fences a plugin's writers in a live project's library as the owner, refusing a missing role or a non-owner account and naming what it fenced first"},{"id":"contract_d747d04a0399","title":"1.28 · A change to the history goes only through the logged repair switch, for the owner too, and the owner's ordinary writes pass when row-level security is forced"},{"id":"contract_fe4a28440eeb","title":"1.29 · A shared library gets schema and own-database table statements only from merged code"}]},{"id":"capability_5a80222c88c4","title":"2 · Library transactions","description":"The only data actions the library allows are: save a record, fetch it, list records of one type, change only named fields, retire a record with a reason, revert a record, retired or not, to the state one of its own history entries kept, or revert every record one writer wrote to its state before that writer's first write, refused where another writer wrote since. Every change is all-or-nothing, and is written first to a permanent, append-only history, so nothing is ever truly erased.\n","word":"healthy","parked":false,"lines":1722,"contracts":[{"id":"contract_740f5e8967bb","title":"2.1 · `save` creates a record. Saving the same id again replaces it, and each save appends one history entry."},{"id":"contract_e3f8c0cd8829","title":"2.2 · `edit` changes only the fields it names; every other field keeps its stored value."},{"id":"contract_ba846c24edfe","title":"2.3 · `edit` merges onto what is stored NOW, not onto a copy the caller read earlier. If two edits of different fields race, both survive."},{"id":"contract_615c0af07ec6","title":"2.4 · `edit` of a missing record returns `null` and creates nothing."},{"id":"contract_25bd3426ded9","title":"2.5 · `get` of a missing record returns `null` and never throws."},{"id":"contract_4c81d4cad00f","title":"2.6 · `list(type)` returns only that type's current records (none retired), and `[]` when there are none."},{"id":"contract_67c43ed3172b","title":"2.7 · `retire(id, reason)` removes the record from `get`/`list`, keeps the reason in the history, and retiring an already-retired or missing record is a harmless no-op."},{"id":"contract_a0db28a06c20","title":"2.8 · `history()` returns every change in the order it happened, with strictly increasing sequence numbers. `history({ id })` filters to one record, and `history({ since })` returns only entries after that sequence number."},{"id":"contract_397234bcaed1","title":"2.9 · A `validate` check passed to `save`/`edit` sees the merged result. If it throws, nothing is written (no record change and no history entry)."},{"id":"contract_32e02eaefb55","title":"2.10 · A write naming an `actor` keeps it in history. A write without one is accepted and its history entry has no actor; an edit or retirement never inherits an earlier write's actor. Refused writes and harmless no-ops add no history entry."},{"id":"contract_5c0be46eb58a","title":"2.11 · Save, edit and retire accept an optional abort signal. If aborted before write admission, including while waiting for the project write lock, they reject without changing records or history. After admission, cancellation does not interrupt the write or undo its history. The in-memory twin applies the same boundary at write entry."},{"id":"contract_218ef9384d84","title":"2.12 · `history` also narrows on the server: `from` (a time) keeps the changes made at or after it, to the millisecond, however the time is written; `types` keeps only changes to records of those types (none for an empty list); `oldest: n` or `newest: n` keeps only the first or last n of what matches, still in order. Filters combine with each other and with `id` and `since`; a malformed one (a limit that is not a whole number above 0, both limits, or a time that is not one) is refused with a RangeError before anything is read."},{"id":"contract_db98aef75172","title":"2.13 · Lists narrow on the server by ids and stored field values, take an ordered limit, and project only requested fields on the named schema version; memory and Postgres agree."},{"id":"contract_ecb00f4e0533","title":"2.14 · `revert(id, to, read)` writes the record back to the state its own history entry `to` kept, whole: changed fields restored, removed ones put back, added ones gone. It is one more `updated` entry whose reason names the entry it reverts to, with its writer; nothing in history is rewritten."},{"id":"contract_c5c823322516","title":"2.15 · A revert of a retired record to an entry before its retirement brings it back live under its own id, created when it first was, so links to that id reconnect. A retirement entry is not a state to revert to."},{"id":"contract_706952adf6f3","title":"2.16 · A revert is refused, writing nothing, when the record was written to after the entry the writer read (`read` is not its newest seq), when the entry is not the record's own, or when its validate check throws."},{"id":"contract_ae9195f066ae","title":"2.17 · `history({ actor })` keeps only the changes one writer made, as their entries name them, on the server, combined with the other filters.\n"},{"id":"contract_0fbb4a621010","title":"2.18 · `revertWrites({ of })` writes every record `of` wrote (health left out) back, in one write, to its state before `of`'s first write to it: a changed record to its entry before, a record `of` retired live again, a record `of` made retired. Each is one more entry naming the writer reverted and the entry it goes back to, with its own writer and reason; a record `of` made and retired itself is left alone. It returns what it changed, by id.\n"},{"id":"contract_1e5585cb3753","title":"2.19 · `revertWrites` is refused, writing nothing, when another writer (named or not) wrote to any record `of` wrote after `of`'s first write to it: LaterWriterError names each such record with the first such entry and its writer. A check that throws refuses it whole too.\n"},{"id":"contract_b71efc5e7610","title":"2.20 · A write made for a writer who had read outside text keeps what it read in its history entry; a write without one carries no mark"},{"id":"contract_40e7dd6453d8","title":"2.21 · A library whose history has no place for the outside-text mark yet writes and reads its history as before, leaving the mark off"},{"id":"contract_d4b54814dc8f","title":"2.22 · Each history entry read back names the account the server saw write it"}]},{"id":"capability_a1d4fadbec3e","title":"3 · Data schema","description":"Every record has a declared type with a fixed set of fields, and a badly filled-in record is refused with a message naming the problem field. Every record is stamped with the schema version it was written on, so a later change to a type is handled deliberately rather than silently misread: an older record is upgraded automatically, step by step, and stored upgraded the next time it is written, because every user's library is their own database and nobody else can repair it.","word":"healthy","parked":false,"lines":1929,"contracts":[{"id":"contract_fbdbb1607848","title":"3.1 · Saving a `story` with no `title` is refused, the error names `title`, and nothing is written."},{"id":"contract_e1a47a28ef60","title":"3.2 · An unknown field (for example `titel`) is refused and named."},{"id":"contract_ff6d380261eb","title":"3.3 · An unknown type is refused."},{"id":"contract_0109b6b1f8ac","title":"3.4 · Every stored record carries its schema version (1 today)."},{"id":"contract_59c395f698c7","title":"3.5 · Reading a record stamped with a version newer than this code knows is refused, never guessed at. The error names the record and both schema versions, gives the update and agent-link restart steps, and reports the running code commit distance behind locally fetched origin/main when known; unavailable Git information never masks the refusal or invents a distance."},{"id":"contract_e0012e2b316b","title":"3.6 · An `edit` that would leave the record invalid (for example blanking a required field) is refused, and nothing is written."},{"id":"contract_43f762149b52","title":"3.7 · A record written on an OLDER version of its type is read (`get`, `list`) upgraded to the current version, its upgrade steps applied in order. Reading it writes nothing."},{"id":"contract_6495139a5930","title":"3.8 · An `edit` of such a record merges onto its upgraded fields and stores it on the current version, in place, in the same all-or-nothing write. If the upgraded result does not fit, nothing is written."},{"id":"contract_9bd6b1c53fd6","title":"3.9 · An older record that no upgrade step brings to the next version is refused by `get`, `list` and `edit`, with an error naming the missing step. It is never guessed at."},{"id":"contract_98f2fb677ee9","title":"3.10 · A friction report written before reports carried a state reads with one worked out from its route and stamp (no route open, nothing dismissed, a stamp resolved, any other route routed), and its next write stores it so"},{"id":"contract_be21aff704c0","title":"3.11 · A story and a capability carry their prose as `text`, read back whole and in order; one written without it reads as before"},{"id":"contract_7d3f2bedb841","title":"3.12 · A process's schedule, time zone and precheck are validated: words the parser cannot read, a grace on any but a daily schedule, an unknown time zone, a precheck not on the fixed list, or a time zone or precheck on a process with no schedule are refused and named"},{"id":"contract_8b395a576a54","title":"3.13 · A process's schedule reads back as written, and as its rule (a daily schedule's grace in minutes), its times in its own time zone or the owner's, and its precheck as written; a process with no schedule reads as before"},{"id":"contract_0c327c4efb36","title":"3.14 · A story carries a risk reading (a blast depth 1 to 3 and a blast radius 1 to 4 with its downstream stories, audience and users, each with the day read and why), and a story or capability its own guardrails (a check and whether a change or a release triggers it); a value out of range is refused and named, and a record written without them reads as before"},{"id":"contract_03999fde9b79","title":"3.15 · A kind a plugin declares, `<plugin>.<kind>` with its fields' shape as JSON Schema, is written and read back like a core kind, and read upgraded by the steps it declares as data."},{"id":"contract_3617a6cd1e64","title":"3.16 · A dotted kind no loaded plugin declares is refused on write, and nothing is written."},{"id":"contract_7f6fd4dc5f24","title":"3.17 · A write that breaks the shape its plugin declared is refused, naming each field at fault, and nothing is written."},{"id":"contract_d4290bf80e21","title":"3.18 · A plugin kind no loaded plugin declares reads dormant: kept intact and readable by id, hidden from lists, refused an edit; declared again, its records read as before."},{"id":"contract_38a6570cb15c","title":"3.19 · A write to a principle, guardrail, pattern, process, agent role or decision carries the mark of the outside text its writer had read; a write of any other kind carries none"}]},{"id":"capability_dd486ffa5b02","title":"4 · Work model","description":"The library holds each project's plan of work: arcs (initiatives), stories (what a user can do), capabilities (the parts that make a story work) and contracts (single testable promises). Capabilities and contracts point at their parent. Stories belong to the project directly, and an arc *may* list the stories it grows, though a research arc may list none. The library refuses broken structure. A capability carries a proposed flag, on from its birth until the agent says it is built (`setProposed`, ADR-0744 D2); switching it says nothing about health, and a capability written before the flag reads proposed. A story is made mapped (ADR-0993 D2) only by mapStories, which an import calls: one mapped story per package of the import, keyed by the package, with no capabilities; a mapped field given to addStory or editStory is refused. A capability of a mapped story is one an agent explored there (ADR-0993 D5): it names the folders and files of its import it covers, inside its story's folders and overlapping no other capability of the story, the refusal naming the one to correct; a capability of a built story covers none.","word":"healthy","parked":false,"lines":1017,"contracts":[{"id":"contract_6961aa1417be","title":"4.1 · Add a story, a capability under it and a contract under that, and `projectTree()` returns them nested: story › capability › contract."},{"id":"contract_ac4376425a6d","title":"4.2 · An arc listing that story is returned by `arcsFor(storyId)`. An arc listing no stories is accepted."},{"id":"contract_978f94cc7d1d","title":"4.3 · A capability naming a missing (or retired) story is refused, as is a contract naming a missing capability and an arc listing a missing story."},{"id":"contract_3f47d2a11ef7","title":"4.4 · A capability depending on another capability that does not exist is refused."},{"id":"contract_92bcaa53a23c","title":"4.5 · A dependency loop between capabilities (A → B → A, or longer) is refused, and nothing is written."},{"id":"contract_8576bc8633da","title":"4.6 · A capability is born proposed. The agent switches the flag off, and back on, and history names the writer; only a live capability has the flag, and a capability written before the flag reads proposed."},{"id":"contract_4aefb54f73ac","title":"4.7 · A contract planned without a number is given its capability's next free one (after the highest its live contracts carry); a title whose number another live contract of the capability carries is refused, on planning and on correcting, and nothing is written. A capability with no number numbers nothing."},{"id":"contract_1bb0f0022847","title":"4.8 · A capability planned without a number is given its story's next free one (after the highest its live capabilities carry), so the contracts planned on it are numbered from the start; a number given is kept."},{"id":"contract_0e03c66fe6cb","title":"4.9 · Retiring a capability with live dependents is refused, naming every dependent and dependsOn, with nothing written; after those links are removed or the dependents retired, retirement succeeds with its reason and writer kept in history."},{"id":"contract_593a8aaa53b3","title":"4.10 · A contract planned without a number skips the numbers the capability's tests already carry, past the highest; a number given is kept"},{"id":"contract_d2851305f60e","title":"4.11 · a contract planned without a number never takes the number of a numbered test no live contract carries: it gets the next free number past it, and only a number given binds it to that test"},{"id":"contract_d9d4a1fccc7b","title":"4.12 · A story is made mapped only by mapStories: a mapped field given to addStory or editStory is refused, and nothing is written"},{"id":"contract_97a4f711d640","title":"4.13 · mapStories(from, packages) adds a mapped story, with no capabilities, for each package no live story of that import maps, retires that import's stories whose package is gone, and leaves every other story as it stands"},{"id":"contract_13941f09e9cc","title":"4.14 · The plan's tree carries a mapped story's import, package and folders as mapStories recorded them; a story storytree built carries none"},{"id":"contract_dda5da38449c","title":"4.15 · A number given in a contract's title is written in the numbered form, number then \" · \", so every reader of contract numbers finds it\n"},{"id":"contract_0ead3fc33417","title":"4.16 · a capability on a mapped story is planned with the folders and files of its import it covers, several roots allowed and written plainly; one with none, or a path outside its story's folders, is refused, as are covers on a built story"},{"id":"contract_6fa53e3ddd4a","title":"4.17 · no two capabilities of a mapped story cover one file: a path equal to, inside or around another's is refused, naming the capability that covers it, on planning and on correcting"},{"id":"contract_d58b7db74a3a","title":"4.19 · The project's anchor is written a half at a time, what it is and who it is for (setAnchor), at one id, and read back by anchor() and the plan's tree; a half given as undefined is removed, and an empty half is refused with nothing written (ADR-1085 D1)."},{"id":"contract_3d0464b9bbcc","title":"4.20 · anchorGaps(tree) reads what the plan has not said, the anchor's missing halves only, and nothing when both are said; no story is ever named (ADR-1085 D1, ADR-1096); it fails nothing."},{"id":"contract_1aee0bc159a0","title":"4.21 · a story carries no audience (ADR-1096): one given an audience is refused with nothing written, and one stored with an audience before reads without failing, its tree node carries none, and its next edit stores it without one"},{"id":"contract_486db7693d1f","title":"4.22 · The plan's tree carries a story's risk reading and guardrails, and a capability's guardrails, as stored; one without them carries none"},{"id":"contract_e9de82b3943a","title":"4.23 · A pull request number resolves through the project's repository cut-over by when it was recorded: before it, the old repository's (none when that one was deleted); on its day or after, the new one's; with no cut-over, the project's one repository's"},{"id":"contract_e628a61c2bbd","title":"4.24 · A capability planned or retitled with a number another live capability of its story carries is refused, naming that one and the story's next free number; nothing is written"},{"id":"contract_a4b05498b09c","title":"4.25 · importPluginPlan writes a plugin's story, capabilities and contracts from its plan, adopting a live story the first time; a later import matches capabilities by number and contracts by theirs, edits what changed, adds what is new and retires what the plan no longer holds, keeping ids"},{"id":"contract_57ede8e725e4","title":"4.26 · a plugin's story, its capabilities and its contracts are refused every plan edit (story, capability, proposed flag, contract), each naming the plugin's plan; nothing is written"},{"id":"contract_b356f71f775d","title":"4.27 · a plugin plan with a capability or contract carrying no number, a number twice, or a contract numbered under another capability is refused, as is adopting a mapped story or another plugin's, with nothing written"}]},{"id":"capability_baaeecb42577","title":"6 · Knowledge artifacts","description":"Alongside the plan, the library keeps what the project has learned: decisions and definitions of terms, and principles, guardrails, patterns, processes, agent roles, friction, re-steers and tech stack, each with 0.2's fields. Each can link to the other artifacts it relates to, and you can find them again by searching their words; an edit keeps the old wording in history. An artifact never links straight to the work: capability 9 is how the work reaches its knowledge.\n\nPlanned, not yet built (ADR-0956 D3, contract 6.12): a ninth kind, the quality control check, one yes-or-no question about a finished change, linked to the principle or guardrail note it enforces.","word":"healthy","parked":false,"lines":937,"contracts":[{"id":"contract_e319dbc996d2","title":"6.3 · Editing a decision keeps its old wording in history."},{"id":"contract_ae9c7b5cfcb4","title":"6.4 · A link to a record that does not exist is refused."},{"id":"contract_f9d501319927","title":"6.1 · An artifact is found by `search` on any word it contains (case-insensitive)."},{"id":"contract_941c8f8602e4","title":"6.2 · `relatedNotes(noteId)` returns every artifact that links to that artifact."},{"id":"contract_a039a5eb3820","title":"6.5 · `definitions()` returns every live definition, and nothing else, in creation order. Added for the agent link's definition lookups at each prompt (ADR-0636 D1, b2), which adds `definitions` to 7's list of functions."},{"id":"contract_06b1b8b941be","title":"6.7 · Friction with no evidence is refused, and so is a re-steer marked a defect with no failure mode. Friction stores the optional dischargedBy reference to the remedy that landed, alongside its route and reason; editing other fields preserves the reference."},{"id":"contract_b448b4845372","title":"6.6 · Each of the eight kinds is saved with its required fields, and refused, naming the field, without one."},{"id":"contract_81cc6a9b1d51","title":"6.9 · Opening an older project converts an explicitly classified memory once, keeping its id, links and history, and reports an unclassified memory while preserving its original record."},{"id":"contract_efde37a7ec83","title":"6.8 · Saving a `memory` is refused with the reason that memories belong to the harness, and nothing is written."},{"id":"contract_c60025749b93","title":"6.10 · `related(noteId)` ranks the other live artifacts by likeness to one, saying of each whether a link joins them in either direction; with `unlinked`, only those no link reaches. An artifact sharing no word with it is never listed."},{"id":"contract_bd8cdfcf340a","title":"6.11 · `searchEach(queries)` and `relatedEach(ids, options)` answer as search() and related() would for each, in order, from one reading of the artifacts; an id that is not a live artifact is left out of relatedEach's answer."},{"id":"contract_9a55ebbd05c7","title":"6.12 · A quality control check is a ninth kind (ADR-0956 D3): saved with its title, one-line description, its question and at least one link to a live principle or guardrail, and refused, naming the field, without its question or without such a link; it may carry what has graduated, each part with where it is now enforced."},{"id":"contract_0cbfbefcdcba","title":"6.13 · A friction report carries its state (ADR-1016): filed open, and an edit naming state is refused with nothing written; routing it to nothing makes it dismissed, any other route routed, or resolved when the route carries a delivery stamp, and a stamp added later resolves a routed one"},{"id":"contract_19c517e3b6b5","title":"6.14 · A recurrence on a resolved or dismissed friction report returns it to open, its route, reason and stamp cleared from its fields and kept in its history; one on an open or routed report leaves its state"},{"id":"contract_329cc0fc7f5c","title":"6.15 · A research note is saved with its title, description, the day the research was done and its findings, and refused without its findings or day, or with a day that is not one"},{"id":"contract_ba6c1f1c2f5e","title":"6.16 · An artifact refiled as another kind keeps its id, creation date and links, reads as the new kind, and its history keeps what it was; fields that do not fit the new kind, a friction or re-steer, or an id that is no live artifact are refused with nothing written"},{"id":"contract_eff0cacd47e7","title":"6.17 · An experiment record is saved with its arms, hypotheses, measures, criteria, budget and stop rules; once frozen, only an outcome may be added"}]},{"id":"capability_f27ac2abb10b","title":"5 · Health record","description":"Every story, capability and contract has a health record with two separate columns: what the agent **reported**, and what storytree **verified** by seeing it for itself. Each column is one of three states: `passing`, `failing` or `not-checked`. A missing entry always reads as `not-checked`, never as `passing`. A capability also has a word, as its card says it (ADR-0744 D1, D3): `proposed` while its flag is on; once the agent switches it off, `healthy` when every contract is verified passing, `unhealthy` when any is verified failing, and `untested` otherwise. Only the verified column counts: the agent's report never makes a capability healthy.","word":"healthy","parked":false,"lines":526,"contracts":[{"id":"contract_7b912eee1628","title":"5.1 · A node with no health entries reads `reported: not-checked, verified: not-checked`."},{"id":"contract_5743238fe962","title":"5.2 · After an agent reports a contract `passing`, it reads `reported: passing, verified: not-checked`."},{"id":"contract_f24b6106a9b7","title":"5.3 · After storytree records the same contract verified `failing`, both columns are kept and shown side by side (`reported: passing, verified: failing`)."},{"id":"contract_6aa8de21e41a","title":"5.4 · A capability or story's health is rolled up from its contracts, column by column: `failing` if any contract is failing; `passing` only if it has at least one contract and every one is passing; otherwise `not-checked`. A single never-checked contract keeps its story `not-checked`."},{"id":"contract_e8c6fabb7aa9","title":"5.5 · Every health entry is kept in history with who wrote it and when. A health entry for a node that does not exist is refused."},{"id":"contract_8eec982fff33","title":"5.6 · A capability's word is proposed while its flag is on, even with every contract verified passing. Once the flag is off, it is healthy when every contract is verified passing, unhealthy when any is verified failing, and untested when any has no verified result or it has no contracts; reported passing alone reads untested."},{"id":"contract_c22bae242a61","title":"5.7 · A verified entry can carry the kind of skip that left it not checked (owner, platform:<os> or other) and the earlier verdict it did not reproduce with that verdict's time; both read back from the contract's health and in the annotated tree, and an entry without them reads as before."},{"id":"contract_2dd55fb192b7","title":"5.8 · A capability that is not healthy carries one reason and who moves it: not built while proposed; otherwise, from its contracts' verified columns, failing, then not re-run, then no test names it, then out of CI's reach, then needs owner; with the contracts carrying it and the earliest time one was recorded so. Only needs owner is the owner's; a healthy capability carries none."},{"id":"contract_2e5eceb87e08","title":"5.9 · The health worklist lists every capability that is not healthy with its reason, who moves it, the contracts carrying it and since when (the earliest time one was recorded so, or else when the capability was recorded), oldest first; one an open increment touches is routed and left off until that increment closes."},{"id":"contract_e62e550e752b","title":"5.10 · In a project whose health nothing verifies (no verified entry anywhere), a built capability carries no reason and is marked as shown by the agent's report; its line says what the agent reports and that storytree does not check this project's tests yet, and it is off the health worklist"},{"id":"contract_f7eb039bbd39","title":"5.11 · A capability whose every contract carrying its reason has a pending mark from a run in progress, newer than its verified entry and younger than the run's time limit, stays on the health worklist saying the run it waits on; once that run records the contract, or its time is up, it is offered (or left off) by what is recorded. A pending mark is no verdict: the contract's health reads as before."},{"id":"contract_d1be7b544e9a","title":"5.12 · A capability whose story's code changed on main after every contract carrying its reason was last verified, by a commit younger than the time a merge's own-health run takes, stays on the health worklist saying the commit it waits on; once its contracts are verified after that commit, or the time is up, it is offered by what is recorded. One with no contract carrying its reason is never held so."},{"id":"contract_69e833b7df3a","title":"5.13 · A capability not proven carries the arcs that park it in the annotated tree"},{"id":"contract_1ab1be5493d3","title":"5.14 · A proposed capability with at least one contract and every contract verified passing is on the worklist still not built and the agent's, marked that its contracts already pass; one with no contract or any contract not passing is not so marked"},{"id":"contract_734a53417aaf","title":"5.15 · A capability whose every contract carrying \"no test names it\" a test on main names stays on the health worklist held back, saying so with main's commit, until a run records it; one with any such contract unnamed on main is offered as before"},{"id":"contract_c8210d7006dd","title":"5.16 · an explored capability of a mapped story has no health until it has a contract: no reason, and off the worklist; given a contract, it is read as any capability"},{"id":"contract_98b5f40e4389","title":"5.17 · A verified entry can carry where it was seen, verified locally or read from CI; it reads back from the contract's health, its history and the annotated tree, and an entry written without it reads with no source"}]},{"id":"capability_75d059640d9d","title":"7 · Library API","description":"One small, fixed list of functions is the only way anything outside the library reads or writes it. The agent link, arc surface, forest and desktop app all call these, and `changesSince` lets them see what just changed without re-reading everything.","word":"healthy","parked":false,"lines":566,"contracts":[{"id":"contract_5cef8fa43418","title":"7.2 · `changesSince(n)` returns only changes after `n`, in order, each carrying the new cursor to pass next time."},{"id":"contract_4386bc47532c","title":"7.3 · The package's public entry exports exactly the documented API and nothing else, and its internals cannot be imported through the package. At runtime it exports `ANCHOR_ID`, `CONNECT_TIMEOUT_MS`, `CONTRACT_DEFINITION`, `ConnectionError`, `DependencyLoopError`, `LONG_CONTRACT_TITLE`, `LifecycleError`, `LinkLoopError`, `MissingReferenceError`, `MissingUpgradeError`, `NEW_LINE`, `NOT_VERIFIED`, `NewerSchemaError`, `NumberTakenError`, `OWNER_TIME_ZONE`, `ProjectGoneError`, `ProjectNameError`, `RestoreRefusedError`, `RetireRefusedError`, `SEED_CONNECTION`, `SchemaError`, `SupersessionLoopError`, `UnknownTypeError`, `WaitLoopError`, `anchorGaps`, `beforeCutover`, `connect`, `connectionString`, `explainConnectTimeout`, `heldBack`, `knowledgeGuidance`, `parseSchedule`, `planGuidance`, `pluginSchema`, `pullSaid`, `wordAndWhy`. Everything else exported is a data type, including WriteOptions, HistoryEntry, HistoryFilter and the literal phrase query options and page. The connection offers exactly `openProject`, `listProjects`, `projectIdentities`, `snapshot`, `restore`, `dropProject`, `ownDatabase`, `close`. A project library offers exactly `name`, `identity`, `factory`, `markFactory`, `recordFactory`, `get`, `list`, `inherited`, `history`, `addStory`, `createArc`, `addCapability`, `editStory`, `editCapability`, `addContract`, `editContract`, `editArc`, `projectTree`, `arcsFor`, `addIncrement`, `advanceIncrement`, `closeIncrement`, `moveIncrement`, `editIncrement`, `parkArc`, `unparkArc`, `arcView`, `arcViews`, `addWait`, `removeWait`, `waitHolds`, `addWaitFor`, `removeWaitFor`, `waitsFor`, `holds`, `raiseQuestion`, `settleQuestion`, `questions`, `heldOnQuestion`, `checkQuestion`, `renewQuestion`, `editQuestion`, `lapsedQuestions`, `reportHealth`, `recordVerified`, `health`, `healthHistory`, `healthWorklist`, `recordDecision`, `numberDecision`, `numberDecisionsFromFullRecord`, `numberFoundingDecisions`, `setDecisionNumberFloor`, `setProposed`, `decisionNumberPlan`, `defineTerm`, `writeKnowledge`, `definitions`, `editNote`, `search`, `searchEach`, `rank`, `rankAll`, `findPhrase`, `relatedNotes`, `related`, `relatedEach`, `frontCovers`, `decision`, `decisions`, `composeStatement`, `retire`, `changesSince`, capability 27's fixed data questions `counts`, `latestChanges`, `findByTitle` and `decisionNumbered`, `recordFyi`, `unheardFyis`, `markFyisHeard`, `createPluginRecord`, `editPluginRecord`, `pluginRecords`, `removePluginRecords`, `dormantKinds`, `close`. Project handles expose no pool, store or table; the connection's ownDatabase is the deliberate exception described by 7.7."},{"id":"contract_d434906e3ab4","title":"7.1 · An end-to-end \"agent's day\" against a real local Postgres: open a project, create an arc, add a story, a capability and a contract, report passing, record verified, record a decision as the capability's front cover and write a definition inside it, then read `projectTree()` and `changesSince(0)`. Every step is visible where the next step expects it."},{"id":"contract_9f9c276ff503","title":"7.4 · `editStory`, `editContract` and `editArc` change only the fields they name, merged onto what is stored now, and check a new reference as adding does (a contract's capability, an arc's stories). Each gives `null`, writing nothing, for an id that is not a live record of its type."},{"id":"contract_24d59537f7ae","title":"7.5 · `get`, `list` and `history` return whole records through the public API, agreeing with the in-memory twin. Live reads upgrade old records; history preserves original writes, including actors and retirement reasons, and can filter by id and sequence. Reads write nothing."},{"id":"contract_e5f26f6c62fd","title":"7.6 · Every public write carries its optional actor to history, as in 2.10. Health can name a writer separately from its reporter; omitting the writer preserves its existing `by` attribution."},{"id":"contract_0490f4da7fce","title":"7.7 · A connection hands its caller one named database of its own beside the projects, on the same server, local or Cloud SQL: created the first time (borrowing a granted creator role where the user may not create databases), never listed as a project, closed with the connection. Handed its table definitions, the library sets it up too (ADR-0973): only the statements the database has not yet applied, in one transaction under the database's own lock, so connections setting it up at once all succeed and one opening a database already set up runs no DDL a concurrent writer could block or deadlock; a caller that only reads may leave them out.\n"},{"id":"contract_932a32b56fc8","title":"7.8 · `arcViews()` returns every live arc's view in a few reads, not one per arc"},{"id":"contract_2f35b9a35473","title":"7.10 · projectTree marks a parked capability with its arc"},{"id":"contract_95df8c3bc9ae","title":"7.18 · sendFeedback writes a feedback record, with the element it points at, and keeps its screenshot and the crop to that element beside it, out of the record's history; feedbackScreenshot returns the bytes, and none for a note sent without one"},{"id":"contract_835b91485691","title":"7.19 · routeFeedback marks a new feedback record routed with its route, target and reason; a missing, non-feedback or already routed record is refused with nothing written, and a routed record must carry its route and reason"},{"id":"contract_b924a9f33d49","title":"7.20 · printable(text) turns every control character a terminal would act on (C0 but line breaks, tabs and a line-ending carriage return, DEL, C1) into a placeholder, from a light entry that imports nothing"},{"id":"contract_1236b1213b22","title":"7.21 · createPluginRecord saves a record of a plugin's kind the project was opened with, and refuses any other"},{"id":"contract_53c32042d6f6","title":"7.22 · pluginRecords lists a plugin's records by kind with count and ids; removePluginRecords removes exactly that listing, refusing a stale one"},{"id":"contract_7932b99be217","title":"7.23 · recordFyi keeps what the owner should know with its title, what happened, when (now when not given), what it is about and who noticed it; unheardFyis lists those he has not heard, oldest first; markFyisHeard marks them heard, so they are listed no more but stay in history, and refuses an id that is no FYI with nothing written (ADR-1184 D3)"},{"id":"contract_4854c26e12f5","title":"7.24 · editPluginRecord changes a record of a plugin's kind the project was opened with, once-only when checkCurrent refuses, and refuses any other"}]},{"id":"capability_a954e1eb16f6","title":"8 · Cloud connection (GCP)","description":"Instead of the local Postgres, a user can point storytree at a Postgres database in Google Cloud (Cloud SQL) and sign in with their Google account rather than a stored password. Everything above works the same, and each project still gets its own database, now on the cloud server.","word":"untested","parked":true,"lines":476,"contracts":[{"id":"contract_9daffdaf7dfa","title":"8.1 · Capability 2's behaviour suite, unchanged, passes against a real Cloud SQL instance reached with Google sign-in."},{"id":"contract_635a9916e874","title":"8.2 · A missing or bad Google sign-in is refused with a message saying what to fix, never a hang."},{"id":"contract_3e5f39f068e5","title":"8.3 · Two accounts sharing the role that creates project databases (a laptop owner and a machine's service account on one instance) both open, write and read one project and a connection's own database: each connection signs in as its account and acts as the database's owning role, so every table either makes is the role's and neither needs the other's ownership."},{"id":"contract_fdd57534ba54","title":"8.4 · An account granted exactly infra/ci-health/grants.sql or infra/library-host/grants.sql (CI's health account, ADR-0747) opens the project, reads its plan, records a contract's verified health, and reads no other kind of record nor its history; it is refused any other kind of record (a new one is refused by row-level security; one it may not change is not there for it to change), any history entry under the id of a record of another kind, even one it cannot read, and any change to the tables; the owner's accounts are unaffected and read what it recorded. In storytree numbering mode, fresh-id health history cannot raise automatic decision numbers or reserve explicit numbers; owner decision writes, the stored floor and all non-health legacy reservations still work. Health history at the floor's own id, even written before the floor is set, neither sets nor blocks it."},{"id":"contract_812d6dc2ec73","title":"8.5 · On a shared server, a library call waits for a free connection slot instead of failing, and each Cloud SQL pool holds at most three slots."},{"id":"contract_2116701810e6","title":"8.6 · On a shared server, each of a library's connections names the machine and process holding it (application_name), so a server whose slots run out shows who holds them"},{"id":"contract_3d3d5e0cbb6e","title":"8.8 · A library call kept waiting, for a connection slot on a full server or for another session's write to the same project, says once what it waits for as the wait starts, goes on when it can, and past its wait bound (30 s unless the caller sets waitMs) fails with the server's reason, writing nothing"},{"id":"contract_6a488f5949cd","title":"8.7 · A caller that may be cut off bounds each statement (statementTimeoutMs), and the server ends one still running at the bound, so a cut-off process's slot comes free"},{"id":"contract_4099a83c921c","title":"8.9 · A writer cut off mid-write (its process killed or its network gone) holds the project's write lock at most 10 s: the server ends its idle transaction, and another session's write waiting on it is written"},{"id":"contract_ad88412519e3","title":"8.10 · A failure is told apart as the library being unreachable"},{"id":"contract_88a79493a56d","title":"8.11 · A polling surface says an unreachable library once per outage"}]},{"id":"capability_13b04e769a4b","title":"9 · Knowledge entrances","description":"Every story and capability has its own shelf of front-cover decisions, and a decision can be a front cover of one of them at most. Artifacts link only to other artifacts, so the only way from the work into the knowledge is through a front cover.","word":"healthy","parked":false,"lines":38,"contracts":[{"id":"contract_8652a47a98ee","title":"9.1 · A decision can be the front cover of a story or a capability, and `frontCovers(nodeId)` returns that node's live covers, founding (oldest) first, and nothing else."},{"id":"contract_29437386c2e3","title":"9.2 · A front cover that names anything but a live story or capability is refused, and nothing is written. Only a decision can be a front cover."},{"id":"contract_6ca10bd28ddc","title":"9.3 · An artifact that links to a story, capability, contract, arc or health entry is refused, and nothing is written. Artifacts link only to other artifacts."},{"id":"contract_b09b5da5acb6","title":"9.4 · A link that would close a loop between artifacts, an artifact linking to itself included, is refused with the chain it would close named, and nothing is written. The knowledge is a DAG under its covers (ADR-0647 D2)."}]},{"id":"capability_a19bf216935b","title":"21 · Links","description":"The librarian links one artifact to another only where the first really rests on the second. It finds neighbours no edge reaches with related-but-unlinked search, alongside plain search (ADR-0654). This is how the whole-project decisions come to sit behind the covers that rest on them.","word":"healthy","parked":false,"lines":103,"contracts":[{"id":"contract_ae0b6fc18eb9","title":"21.1 · `link(from, to)` makes artifact `from` rest on artifact `to`, keeping its other links. Linking it again writes nothing."},{"id":"contract_c93e5fa07aa8","title":"21.2 · A definition rests only on a decision, and a friction or re-steer rests on nothing: any other link is refused, naming the rule, and nothing is written."},{"id":"contract_2deded3d0ba8","title":"21.3 · The worklist names each accepted decision on no shelf that no artifact rests on, and drops it once one does."},{"id":"contract_9f27b3140288","title":"21.4 · For each live artifact written since the session's cursor, including edits, the worklist lists neighbours ranked by likeness that no link joins in either direction. It uses the library's related-but-unlinked search and writes no links; the agent decides which are real dependencies."}]},{"id":"capability_b7a12a2b7273","title":"22 · Decision log","description":"Every accepted decision stays true in full. When a later landing overtakes something a decision says, the librarian corrects it in place if the decision did not change, and records a new decision that supersedes it if it did; finished business is retired or consolidated.","word":"healthy","parked":false,"lines":103,"contracts":[{"id":"contract_f6d29cf51c71","title":"22.1 · `supersede(olds, decision)` records a new accepted decision, or names an existing accepted successor by ID, adding the old ones to its `supersedes` without duplicating it or losing existing links, wording or authority. Each old one reads superseded and stays readable; the successor inherits the first old one's shelf only if it has none, and any old one's load-bearing mark. Missing, retired, proposed or already superseded successors, invalid predecessors and supersession loops are refused before anything is written.\n"},{"id":"contract_01e00403fc3b","title":"22.2 · `correct(id, fields)` changes a decision in place (its text, title or load-bearing mark), and the old wording stays in its history. A correction that would turn an accepted decision back to proposed is refused, since only the owner does that, and nothing is written."},{"id":"contract_0da6c21cc204","title":"22.3 · `annotate(target, { by, note })` adds a dated annotation to the target decision's text, naming the decision that narrows it. A narrowing decision that is not a live decision is refused, and nothing is written."},{"id":"contract_8fe0f0bff2d1","title":"22.4 · The worklist's health report names each link or supersession that points at a record no longer live, with both ends."}]},{"id":"capability_36bcae448803","title":"23 · Catalogue","description":"Every artifact that lands is either genuinely new or an edit to the artifact that already covers it, and never a near-copy. Guidance any capable agent would work out for itself is pruned.","word":"healthy","parked":false,"lines":102,"contracts":[{"id":"contract_ec022e101e9f","title":"23.1 · `retire(id, reason)` retires an artifact nothing points at. An artifact that another live record points at (a link, a supersession, a process's hand-on, an agent role's reading, rules or anti-patterns, an increment's remedies, or a question it settled) is refused, naming what points at it, and nothing is written."},{"id":"contract_570dac9dfb81","title":"23.2 · The worklist lists each artifact written new since a cursor, with the live artifacts a plain search for any word of its title finds, so the agent can see what might already cover it."},{"id":"contract_268c1419ea75","title":"23.3 · The worklist lists each write to an agent role or a principle since its cursor that was made after its session read outside text, with what was read"}]},{"id":"capability_53fd994f7b4c","title":"24 · Graduation","description":"ADR-0650 keeps the built graduation functions, but graduation is not needed for the MVP. Harness memories remain outside the library; promotion writes a proper artifact kind.","word":"healthy","parked":false,"lines":130,"contracts":[{"id":"contract_67e8525ac8c6","title":"24.1 · The worklist lists each memory in the memory folders that is new, changed since it was parked, or parked more than 60 days ago. A memory parked unchanged within its 60 days is not listed."},{"id":"contract_e20261e11be9","title":"24.2 · `park(memory, reason)` keeps the reason, the date and what the memory said when it was parked, beside the memory folder, never in the library."},{"id":"contract_ff73d4bfad9d","title":"24.3 · `graduate(memory, kind, fields)` writes the lesson as a principle, process or definition, and only then deletes the memory. A write the library refuses leaves the memory where it was, and any other kind is refused."},{"id":"contract_a50db42d7dec","title":"24.4 · The worklist lists each process that names none of the tools served, and each tool served that no process names."}]},{"id":"capability_d8451645c169","title":"25 · Lapsed questions","description":"Open questions whose review lease has lapsed are looked at on the librarian's pass, and nothing is closed without a reason. The library owns the review date and lease; the librarian uses its lapsed-question drain (ADR-0654). Part of The library's curation tooling (ADR-1077 D3).","word":"healthy","parked":false,"lines":12,"contracts":[{"id":"contract_a5d1d97d3660","title":"25.1 · The worklist lists only open questions whose review lease has lapsed, across every arc, longest lapsed first. Fresh and settled questions are excluded; gathering the list neither settles nor renews a question."}]},{"id":"capability_389fd5e3722d","title":"26 · Rounds","description":"When the librarian runs, and how an agent is told to put on its hat. At a landing where the session wrote to a curated kind of artifact, storytree asks for the librarian's pass before the landing is reported.","word":"healthy","parked":false,"lines":405,"contracts":[{"id":"contract_7e857cb5497b","title":"26.1 · The trigger fires when the change feed since the session started holds a write to a curated kind, and when there is no start to read from; graduation is due at every landing either way."},{"id":"contract_2ca3128c4321","title":"26.2 · The worklist gathers each capability's list into one report: graduation's always (ADR-0789 D3), the rest only when the trigger fired; the friction drain is Friction's own, apart from it (ADR-1077 D4)."},{"id":"contract_dcc388d426a3","title":"26.3 · `land`'s answer ends with the \"next\" line \"run the librarian's pass\" when the trigger fired, and with none when it did not."},{"id":"contract_dd550af58968","title":"26.4 · A test client lists the librarian's tools on the agent link's one server, beside its own, and calls them."},{"id":"contract_4d38b82b6a0c","title":"26.5 · The librarian's subagent definition names every librarian tool the server serves."},{"id":"contract_2782eac787bc","title":"26.6 · The worklist and `land`'s next-line check take about as much from a library whose history holds weeks of changes, with health entries piling up since the session started, as from one whose history holds an hour's: the session's start is found from the first change since it, the trigger asks only whether one curated change came after it, and the links and catalogue read only note changes since it."},{"id":"contract_981ed605a2d8","title":"26.7 · The worklist reads the live notes about once however many notes the session wrote, and with no recorded session start it gathers every list but the catalogue and related ones, which it leaves unread saying why, instead of reading every note's whole history."},{"id":"contract_d53e25fbf6dd","title":"26.8 · A worklist call names each phase through the call's progress before it answers (graduation, trigger, links, related, health, catalogue, processes, questions), and stops at its next phase once progress rejects, reading nothing more."},{"id":"contract_307518d9b9a6","title":"26.9 · The worklist tool answers in a size a session can read: each list's first five notes named by ID, kind and title, with how many it holds; any one is read whole by its ID."},{"id":"contract_2a8017b3c95e","title":"26.10 · A plugin's curation guidance is offered only for its own kinds, beneath the core rules"},{"id":"contract_37891fc5d9fc","title":"26.11 · Through the tool, a mounted plugin's guidance is offered after a write to its kind"}]},{"id":"capability_a7f068502213","title":"10 · Work in flight","description":"Each arc is whole: its intent, its end state and its increments. An increment moves from proposal to active to closed (ADR-0909 D4 retired the ready step; one stored as ready reads as a proposal). An arc reads closed when its last increment closes, and reopens when new work is parked on it, unless the owner has parked the arc. A closed increment stays, as the arc's log entry: its date, pull request, note, and whether it landed, failed or was withdrawn.","word":"healthy","parked":false,"lines":1162,"contracts":[{"id":"contract_3153d968372b","title":"An increment moves forward: proposal, active, closed (ADR-0909 D4 retired the ready step, and asking for it is refused); its one step back is 10.9's, active work nobody holds returning to proposal. Closing records the date, pull request, note and outcome (landed, failed or withdrawn), and a close with no pull request needs a note. A dedicated correction replaces a closed outcome with a required nonblank reason kept in history, preserves its closure date unless supplied, and leaves it closed; an open increment or an invalid outcome is refused without a write."},{"id":"contract_8ce9b7d984df","title":"10.1 · An increment belongs to one live arc. It is created as a proposal, stamped with the date it was parked, or born closed."},{"id":"contract_aae86310354a","title":"10.3 · An arc with increments reads closed exactly when none is open and none of its questions waits on the owner, and active otherwise; an arc with no increments yet reads active. A parked arc reads parked until it is unparked."},{"id":"contract_5cc9bc01f7ae","title":"10.4 · An arc's intent and end state are required, and an arc written before they were is upgraded to carry them."},{"id":"contract_c7710c00f18d","title":"10.5 · An increment moves to another live arc keeping its id, lifecycle and waits, its history recording the move and why; closed history may move into a closed arc, while open work moving to a closed arc is refused and nothing is written."},{"id":"contract_98153ca9297f","title":"10.6 · An arc parked until a day reads parked before that day (UTC midnight) and as if unparked from it on, worked out on read with no write in between"},{"id":"contract_a8a8156831cb","title":"10.7 · An increment stored as ready, a step ADR-0909 D4 retired, reads as a proposal keeping its parked date, and an edit stores it so."},{"id":"contract_da44d39f6729","title":"10.8 · Holds and wait checks read open work and named blockers, and one arc view reads only its own history: adding hundreds of long closed increments elsewhere adds at most 128 KiB per read."},{"id":"contract_8981e56186ae","title":"10.9 · An active increment returns to proposal, keeping its parked date, when nobody holds it; a proposal or closed one is refused with nothing written"},{"id":"contract_31124b14e95b","title":"10.10 · An arc whose every open increment waits only on a dated event, or on its own work so held, reads parked until the earliest check-back day, worked out on read; free work, an owner wait or an open question keeps it active"},{"id":"contract_e4121db7e70c","title":"10.11 · An increment carries a capabilities list naming live capabilities only, parked empty and editable after parking, and cites anything else (its stories, notes, decisions) through links; one stored with the retired touches reads its capabilities in the list and the rest as links, and an edit stores it so (ADR-0949 D2)"},{"id":"contract_4849ee93040a","title":"10.12 · An active increment takes a pending change to a story, capability or contract it did not plan: the live record stays, the change keeps its base history entry and its before and after, a second change merges into it, and one another open increment already holds is refused naming it"},{"id":"contract_11ae808fb284","title":"10.14 · An increment's branch reads the plan with its pending changes laid over, every other reader the live plan; a pending change its record has moved since it was read (a later value in a field the edit sets, or any later entry for a retirement) is named stale with the entry that moved it\n"},{"id":"contract_e639e27e5b98","title":"10.15 · An increment's pending changes apply through the plan's own editors when it lands, each history entry marked with its pull request; a stale or refused change is not applied and is parked as residue on its arc naming both history entries; applying again applies nothing twice"},{"id":"contract_1169f7e04cdd","title":"10.16 · An increment closed failed or withdrawn drops its pending changes, its history saying so, and the live plan is left as it was"},{"id":"contract_6d9429472341","title":"10.17 · Settling closed increments' leftover pending changes applies those of each one that landed and drops those of each one that did not, and finds nothing left the second time"},{"id":"contract_e361ea1166b9","title":"10.18 · A capability is parked when every open increment naming it sits on a parked arc and asks nothing of the owner"},{"id":"contract_a7005734b2eb","title":"10.19 · An increment may name the one machine that can take it: parked with it, edited to another, and cleared by an edit to none, which removes the field"},{"id":"contract_1832bb6e8ff6","title":"10.20 · Closing an increment as landed resolves each friction in its remedies, stamped with its pull request (the increment when it has none), and a closure corrected to landed does the same"},{"id":"contract_e395c912faf7","title":"10.21 · Closing an increment failed or withdrawn returns each friction in its remedies that reads routed to open, its route cleared, unless another open increment still remedies it; a closure corrected from landed does the same to the reports it resolved"},{"id":"contract_139b3f350a08","title":"10.22 · The board's arcs: live arcs whole plus closed arcs whose closing day falls in a window, and closed arcs alone by a window, each with its closing day and only the increment fields the board draws"},{"id":"contract_15eaf43ac564","title":"10.23 · An increment names the escape it fixes: the pull request or increment that caused it and the story it hit, set by parking or editing and cleared by an edit; a cause or story that is not one is refused with nothing written"},{"id":"contract_796d497cb9bc","title":"10.24 · An increment carries a risk line (its tier, rating, depth, radius, depth flags, the live stories it touches and the day read), set and cleared by an edit; a value out of range or a story that is not one is refused with nothing written"},{"id":"contract_80cb58e22f83","title":"10.25 · An increment is parked already waiting for the owner, its note written in the parking's one write; a wait the owner-wait rules refuse, two for one releaser, or one on an increment born closed is refused with nothing written"},{"id":"contract_f4a40563ce7e","title":"10.26 · An open increment drops one pending change by its record, with a reason, its history saying so and the live plan left as it was; a record it holds no change for, or a closed increment, is refused with nothing written"},{"id":"contract_dc9e3fc86e85","title":"10.27 · An apply cut off part-way leaves pending only the changes it had not applied; the gate reads none its own increment applied as stale, and the next apply, under any of the increment's pull requests, finishes the rest"}]},{"id":"capability_d632ff0454c0","title":"11 · Waits","description":"An arc waits on an arc, and an increment on an increment on any arc, each with a reason. A loop across both kinds is refused when it is written. The library alone answers whether a wait holds (`waitHolds`), naming its blockers and saying when one can never release.","word":"healthy","parked":false,"lines":269,"contracts":[{"id":"contract_69b42bf66974","title":"11.1 · An increment wait holds until the blocker closes as landed. A failed, withdrawn or missing blocker holds for good, and says it will never release."},{"id":"contract_2227bf1db95b","title":"11.3 · A wait that would close a loop across arcs and increments is refused, naming the loop, and nothing is written."},{"id":"contract_bc1875aeaf16","title":"11.2 · An arc wait holds until that arc closes."},{"id":"contract_8ca0695f7829","title":"11.4 · `waitHolds(id)` returns the blockers still holding, each with its reason."},{"id":"contract_4a8f6c2e4679","title":"11.5 · holds() answers every live arc's and open increment's wait holds, and every open increment's owner holds, in one reading, each the same as waitHolds and heldOnQuestion give; closed increments have no holds and are omitted."},{"id":"contract_58845ba34283","title":"11.6 · An increment waits for the owner or an outside event with a note: an owner wait holds until cleared, an event wait until its check-back day, then reads passed"},{"id":"contract_9b56f3536716","title":"11.8 · A wait is cleared from the record that stores it as its blocker lands (an increment) or closes (an arc), with the reason in its history; a failed or withdrawn blocker's wait stays"},{"id":"contract_e306fcf58d86","title":"11.9 · An arc waits on an increment of another arc"},{"id":"contract_2ca9bb812939","title":"11.10 · An owner wait needs a why (what it protects or unblocks) and may carry a rank, a whole number, 1 first; each write stamps the day it was read again, and writing it again keeps the note, why and rank not given; an event wait takes neither\n"}]},{"id":"capability_5f1ce148e63a","title":"12 · Owner questions","description":"A question is raised on an arc, with its stakes, statement, context and options, and settled with the owner's answer, which stays on the arc. An increment held on an open question reads as waiting on him (`heldOnQuestion`), and the library alone answers that.","word":"healthy","parked":false,"lines":259,"contracts":[{"id":"contract_4750412a40af","title":"12.1 · A question is raised with its required fields, and is open."},{"id":"contract_cc09e544459a","title":"12.2 · Settling needs an answer and keeps it, with the date and the decision that carried it. A settled question stays readable on its arc."},{"id":"contract_b5e0d884d5ce","title":"12.3 · An open increment held on an open question reads as waiting on the owner. Settling the question takes it off every increment's heldOn, keeping their other holds. A question that does not exist holds nothing."},{"id":"contract_f0d390cd095d","title":"12.4 · A question an increment is held on cannot be retired through retire; retireQuestion (12.9) is the step that releases its holders."},{"id":"contract_62c47a63f1ca","title":"12.5 · An open question carries a review date and a lease, 7 days unless given. It checks fresh until the lease runs out and lapsed after, it is listed as lapsed until renewed, and renewing re-stamps it."},{"id":"contract_0a3af3e1dd97","title":"12.6 · Renewing a settled question is refused and nothing is written. A settled question checks settled and is never listed as lapsed."},{"id":"contract_9c953464be71","title":"12.7 · An open question's wording (title, stakes, statement, context, options, analogy, diagram, recommendation) can be corrected in place, changing only the named fields. Its arc, lifecycle, answer and lease are not edited this way, and editing a settled question is refused with nothing written: its answer stands."},{"id":"contract_2a2902a792c7","title":"12.8 · A question raised on a parked arc is refused, naming the arc, and nothing is written; once its wake day passes, it is raised"},{"id":"contract_df3819b1cd7d","title":"12.9 · Retiring a question with retireQuestion takes it off the heldOn of every increment held on it, open or closed (keeping their other holds), and retires it in one step, naming the increments released. A record that is not a live question is refused with nothing written."},{"id":"contract_7c0bec6941b8","title":"12.10 · An open question carries the session putting it to the owner, set and cleared in place through editQuestion; settling clears it, and a settled question cannot carry one"},{"id":"contract_6e93c00dcbea","title":"12.11 · an open question moves to another arc in place, keeping its id, wording and holders"}]},{"id":"capability_78d6e026f902","title":"13 · Decision log","description":"Decision numbers do not collide, even across concurrent writers, and history reserves every number a decision has held. Other projects start at 1. In the project named exactly `storytree`, automatic numbers exceed the persisted floor and every number any non-health record has ever held; automatic numbering is refused if that setting is absent. An explicit free number remains accepted. The N1 move is complete: the 29 Full record decisions retain their 0.2 numbers, the floor is 662, and the 53 founding books are ADR-0663..0715. Ordinary edits cannot change or remove a decision's number. A decision's status is proposed or accepted, and it can be superseded: the superseded decision is kept, and reads as superseded. A decision carries the load-bearing mark, who decided it, in their own words, and one composed statement. Health events never reserve decision numbers, including in repair previews and writes; legacy non-health reservations remain.","word":"healthy","parked":false,"lines":554,"contracts":[{"id":"contract_104cac07c8a3","title":"13.1 · In projects with automatic numbering, decisions recorded at once from separate connections get distinct numbers, each higher than any before. A number held by another decision is never reused, including retired decisions and old numbers kept in history. Ordinary edits cannot change or remove a decision's number and a refused edit writes nothing."},{"id":"contract_1d18d43ee8b1","title":"13.2 · A decision is superseded exactly when an accepted decision names it in `supersedes`. It stays readable, and a supersession loop is refused."},{"id":"contract_5beacfe0abc6","title":"13.3 · Status and the load-bearing mark are stored and read back, and a decision written before status was is upgraded to carry one."},{"id":"contract_31c3a563557f","title":"13.4 · A decision may carry one composed statement. A read returns it marked stale when the decision's text changed after it was written, and the full text is always readable."},{"id":"contract_a483129d2c61","title":"13.5 · Only in the storytree project, numberDecision repairs a live decision once to the number in its own single Full record: ADR-NNNN line. Missing or ambiguous lines, mismatches, retired records, previous repairs, and numbers any non-health record has ever held are refused without writing. Concurrent repairs cannot share a number or repair a record twice. The old number stays in history; editNote still refuses number. decisionNumberPlan lists proposed old → new numbers and refusals, including duplicate targets, without writing. Decisions without a Full record line are untouched. Health events never reserve decision numbers, including in repair previews and writes; legacy non-health reservations remain."},{"id":"contract_c759659246a2","title":"13.6 · Only in storytree, setDecisionNumberFloor previews by default and apply: true stores 0.2's final number once as a positive safe integer project setting, retained in history and snapshots. Repeated or lower floor settings are refused, including concurrent attempts. Recording without an explicit number is refused while the floor is unset; afterwards, automatic numbers exceed the floor and every number any non-health record has ever held, with concurrent writers receiving distinct numbers. An explicit free number remains accepted; other projects still auto-number from 1. Health events never reserve decision numbers, including in repair previews and writes; legacy non-health reservations remain."},{"id":"contract_99983b44394a","title":"13.7 · numberDecisionsFromFullRecord previews by default; apply: true applies every eligible proposal through numberDecision and returns each refusal. Decisions already matching their Full record number are omitted. Duplicate targets are refused, the write checks history again under the project lock, and repeated bulk application writes nothing once all eligible repairs are complete."},{"id":"contract_f18d746fa20b","title":"13.8 · Only in storytree with its floor set, numberFoundingDecisions previews live decisions that existed at switch-on and have no Full record line, in first-creation history order. Targets exceed the floor and every number any non-health record has ever held. Preview writes and reserves nothing; apply: true rechecks every write and returns each refusal. The record keeps its identity, other fields and old number in history. Concurrent moves cannot share numbers or move a book twice. Completed moves, Full record decisions and decisions created after switch-on are omitted; a repeat can finish a partial run without renumbering completed books. Health events never reserve decision numbers, including in repair previews and writes; legacy non-health reservations remain."},{"id":"contract_624bbf2c8d79","title":"13.9 · `decisions()` gives every live decision's view in one reading, oldest first, each the same as `decision(id)` gives."},{"id":"contract_50e1e379ab35","title":"13.10 · The library declares the `adr` family the command line lists 4th: a pulled decision pushed back unedited writes nothing and never asks for the writer, and an edited title writes that field alone"}]},{"id":"capability_556e276756c9","title":"14 · Ranked search","description":"A library search ranks the live artifacts by how close their meaning is to the question, using an embedding model (Snowflake's arctic-embed-s, ADR-1115; bge-small until 2026-10-22) run on this computer, with no LLM, paid API or extra service, as the owner directed (0.2's ADR-0664). An artifact written or edited is embedded again before the next search ranks it, and with no model to hand the search falls back to word matches and says why.\n\nAs built: Windows delivery stages the locked Transformers Node distribution, ONNX Runtime CPU binding and DLL, and the Sharp runtime dependency beside the CLI and MCP entrypoints for x64 and arm64. No model weights ship. The existing lazy loader downloads arctic-embed-s on first use into <storytree home>/models, from one pinned revision, checking each file's SHA-256. The installed-layout check imports Transformers and runs a weight-free ONNX Identity graph on the native CPU backend without a source checkout. Windows x64 execution is checked by installer CI; ARM64 PE headers are inspected, with ARM64 execution awaiting a native Windows acceptance run.\n","word":"healthy","parked":false,"lines":483,"contracts":[{"id":"contract_fecffcee8ada","title":"14.1 · `rank(query)` orders the live artifacts by meaning, best first, with each one's score, and finds an artifact that shares no word with the question."},{"id":"contract_f4e26f38486d","title":"14.2 · An artifact scores by its best chunk (its rendered text packed into chunks of at most 1600 characters on paragraph boundaries, ADR-1044 D1), and at most `limit` artifacts come back, ten unless told."},{"id":"contract_15c77f9129b3","title":"14.3 · An edited artifact ranks by its new words at the next search; a chunk already embedded is not embedded again, and a library opened afresh on the same project reads the kept vectors, embedding only the question."},{"id":"contract_b167d620612b","title":"14.4 · With no embedding model to hand (switched off, or it cannot load), `rank` gives the word matches of `search` and says why, rather than failing."},{"id":"contract_7ebe354a3882","title":"14.5 · The installed Windows CLI and MCP tools resolve their bundled Transformers and native ONNX CPU runtime without a checkout or npm installation, on x64 and arm64. The installer ships runtime code and target binaries, never model weights; the embedding model remains a first-use download into <storytree home>/models."},{"id":"contract_782200bfa8c8","title":"14.7 · A ranked search puts first the records it names by title: one whose title (a definition's term) is the search, ignoring case, spacing and a leading contract number; then one whose contract number (such as 7.17) is a word of the search; then one whose title holds every word of it as a whole word, ignoring case, a plural finding its singular, never letters inside a longer word; each group, and the rest, keep their meaning order."},{"id":"contract_f081b33c9de0","title":"14.8 · rankAll ranks live stories, capabilities and contracts by their own wording alongside knowledge artifacts, labels each hit with its type, and finds a contract whose meaning matches even when it shares no query word."},{"id":"contract_9dfc8d0541f8","title":"14.9 · With no embedding model, rankAll returns word matches including a contract holding every query word, reports why it fell back, and never treats a plan record’s parent identifier as searchable words."},{"id":"contract_9afe45e29e77","title":"14.10 · Ranked searches reuse local vectors across processes only within the same server, project database identity and model. Only missing content keys come from Postgres, including after one note is added. Other servers, projects, recreated databases and old unscoped entries cannot alter ranks or scores. Writes reach Postgres and the scoped local copy; concurrent processes share it safely, and no identity or usable local storage falls back to Postgres."},{"id":"contract_348b5d638cf2","title":"14.11 · An explicit literal phrase lookup matches case-sensitive contiguous text within stored top-level string fields of selected artifact and plan kinds, returns full live records in id order
