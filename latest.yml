  "releaseNotes": "# storytree 0.3.1122\n\n- Workspace command can build beside an open pull request ([#761](https://github.com/storytree-ai/storytree/pull/761))\n- workspace <increment> accepts the session's own claim ([#977](https://github.com/storytree-ai/storytree/pull/977))\n- The tour journey's sessions-strip check expects the recording's names ([#808](https://github.com/storytree-ai/storytree/pull/808))\n- Dev loop: generate grill-me overview with non-question waits ([#970](https://github.com/storytree-ai/storytree/pull/970)) — Objective landed by PR #970 (merged, for increment_4287e6ec9c51, the fenced residue this increment waited on; commit ca0f313d on origin/main e8517828): process_19b0741af17c step 4 reads storytree arc waits, lists owner-action and event waits even with no questions, owner wait cleared only on his done via unwait --for owner, overdue event flagged never cleared by date; both .claude and .agents grill-me SKILL.md regenerated.\n- A fix session does not make its increment look ready, and an idle dispatcher looks sooner ([#1039](https://github.com/storytree-ai/storytree/pull/1039))\n- The Mint queue runner pops the line it ran, not line 1 ([#881](https://github.com/storytree-ai/storytree/pull/881)) — queue.mjs popRan removes the line naming the increment that ran, wherever a dispatcher moved it (contract 12.2, test 12.2 in queue.test.mjs). Live on the box since the 2026-10-08 cut-over: launch-night.sh and launch-mintlib.sh exec launch.mjs.\n- Re-walk the idle-setting capture to the settings tabs ([#821](https://github.com/storytree-ai/storytree/pull/821))\n- Catch capture build drift in agent-link ([#806](https://github.com/storytree-ai/storytree/pull/806))\n- An increment carries its own capabilities list ([#995](https://github.com/storytree-ai/storytree/pull/995)) — PR #995 merged 2026-10-09 on main as 179bfce1: capabilities list + links, touches retired at schema 3, health drain reads capabilities, CLI --capabilities/--links (--touches refused), park_increment/edit_plan, guidance. Migration is upgrade-on-read, no rewrite run, idempotent by construction. Read-only count of the live library before landing: 1073 increments, 525 with touches (17 open), 727 capability ids -> capabilities, 104 story ids -> links, 0 unprefixed ids. It carried #992's laptop pnpm test fixes.\n- Website and evidence scripts require an approved checkout (ADR-0942) ([#916](https://github.com/storytree-ai/storytree/pull/916)) — Website's share landed; forest seed scripts and shop harness record-library parked as their own increments on arc_28e67e229273 (outside track W's fence).\n- An arc's row is its chip, its title and its bars: no counts, no sentences, bars that wrap ([#1084](https://github.com/storytree-ai/storytree/pull/1084))\n- Authenticate remote Postgres before sending its password ([#908](https://github.com/storytree-ai/storytree/pull/908)) — Remote address connections require checked TLS (ADR-0943 D1), contract 15.4; pinned Mint certificate shipped in the same landing (D4), live-checked from the box at mickh-a520i-ac, 100.97.8.31 and the Tailscale name over TLSv1.3. Server-side hostssl remains a later step. Independent verification remains increment_8862d4069e34.\n- Touches never refuses a capability claim ([#921](https://github.com/storytree-ai/storytree/pull/921)) — PR 921 merged through the merge queue after Linux, macOS and Windows passed. A capability claim is no longer refused by the waits of increments naming it in touches (ADR-0944 D2); increment and arc waits unchanged. Contract 5.9 restated (red then green), 5.18 retired with its test. Full-scope local gate passed. Health drain parked increment for 11.13's unrecorded health on this arc and arc_f3569a085e3b for Windows-proven contracts.\n- Stop the agent link's shutdown aborting after a journey delivery on Windows ARM ([#973](https://github.com/storytree-ai/storytree/pull/973)) — Session manager: PR #973 merged 2026-10-09T03:59Z; the laptop chip session never closed the increment\n- An idle claim does not hide free work on the Arcs board ([#781](https://github.com/storytree-ai/storytree/pull/781))\n- arc increment edit refuses a capability another live increment lists ([#1012](https://github.com/storytree-ai/storytree/pull/1012))\n- The activity log can be read a whole line at a time from the command line ([#838](https://github.com/storytree-ai/storytree/pull/838)) — PR 838 merged after full local gate and Linux, macOS and Windows PR and queue verification. Complete command output is exposed by noticeboard log --full with compact defaults and bounded selection preserved.\n- Running the Mac one-liner again updates an older install ([#1067](https://github.com/storytree-ai/storytree/pull/1067))\n- The agent link's release and close-out return unclosed increments to proposal ([#960](https://github.com/storytree-ai/storytree/pull/960))\n- CI runs the capability-list check on every pull request ([#1009](https://github.com/storytree-ai/storytree/pull/1009)) — CI job 'capability list' (capability-list.yml, environment plan-read) landed; role ci_plan_read created on the Mint library with a plan-only read policy, proven on the box. Owner's credential steps parked as increment_63082e5e50c8 with an owner wait.\n- Windows discovery and fixtures fit CI once the handoff is always on (agent-link, cli) ([#969](https://github.com/storytree-ai/storytree/pull/969)) — agent-link half: Windows discovery resolves the SID once per process and remembers a passing verdict per handoff (id/size/m/c/birth times); refusals never kept; agent-link fixtures resolve whoami once. CI Windows on main's trust server: agent-link 155.5 s, cli 126.2 s (no handoff there, so the cache's gain shows only under #941). cli fixture parked as increment_93c3140b56f6, which increment_428779c116fe now waits on.\n- Keep phone island captions inside the view ([#944](https://github.com/storytree-ai/storytree/pull/944))\n- The question-round skill, written from 22 past rounds and tried on one ([#393](https://github.com/storytree-ai/storytree/pull/393)) — Arc review 2026-10-10, row 8. The grill-me skill shipped in PR #393 (merged 2026-10-01) and has been adjusted from use since (commits ca0f313d, 766beb0c). Real rounds ran on it on 2026-10-02 (question_8c5e1ab203e2), 2026-10-06, 2026-10-08 and 2026-10-10, each recorded on the questions it settled. No separate trial review was written; the adjustments above are what the rounds showed. No session held this increment since 2026-10-02. Approved by the owner, 2026-10-10, on the arc review's table: \"this looks good, might of changed with ma answering questions, check latest state and then for the stuff that the recommendation still holds proceed with, fan out as needed\".\n- Agent link's retire_question releases holders; open reads a question ([#1079](https://github.com/storytree-ai/storytree/pull/1079))\n- Question commands: read one question whole, and retire releases its holders ([#940](https://github.com/storytree-ai/storytree/pull/940))\n- The knowledge core and write_note name the check kind ([#1082](https://github.com/storytree-ai/storytree/pull/1082))\n- Shell writes count as edits ([#681](https://github.com/storytree-ai/storytree/pull/681)) — Shell writes in the hook worktree now produce file-edited records and automatic capability claims through per-session Git snapshots. Contract 3.22 passes for both built hooks, offline delivery, repeated writes, deletes, moves, commits, CRLF normalization and recovery. Full local gate and Linux/macOS/Windows PR and merge-queue CI passed. CI enqueue recovery is separately parked as increment_f43a5f34b53a.\n- Desktop: wire the WorkOS SDK and feedback identity bridge ([#903](https://github.com/storytree-ai/storytree/pull/903)) — Desktop feedback sign-in verifies WorkOS access tokens itself (RS256 against the client's JWKS, audience storytree-identity, user_ subject = the exchange's user, email only when verified), so no identity server and no JWT template email edit are needed (choice D). Main process passes the SDK's getUser through callbackSession; sign-in offered on a stamped client ID alone. Earlier: SDK, packaging and bridge in PR #883. Residue parked: increment_c3077594715c (apps/desktop build stamps the staging client ID, drops STORYTREE_IDENTITY_URL, packaged deep-link proof, owner live acceptance) and increment_ac2ea77faf36 (CLI device flow without the identity server); increment_5b1c612ef98d now waits on both.\n- The map chapter in six steps: the camera moves on a line, and claims and sessions close it ([#1068](https://github.com/storytree-ai/storytree/pull/1068))\n- History rows are not rebuilt over all time on every tick ([#851](https://github.com/storytree-ai/storytree/pull/851)) — historyRows groups lines by session and merges by holder once per call (contract 7.26: 122,000 reads of a line's session for 600 lines before, under 10 per line after). Laptop, lag:desktop cold/warm: historyRows 11.1/5.7 s -> 0.16/0.25 s of ~50 s profiled; page blocked on globe clicks 32.2/20.1% -> 4.2/6.5%, sessions and toggle 32.9/22.6% -> 4.8/7.7%; heap 793/254 MB -> 97/157 MB. Breakdown item 2 (compute History only when its tab is open) left out: after item 1 it costs under 1% of the profile.\n- Retiring a capability deals with what depends on it ([#686](https://github.com/storytree-ai/storytree/pull/686))\n- Claiming an increment from inside a workspace makes no new worktree ([#898](https://github.com/storytree-ai/storytree/pull/898)) — Complete behaviour: agent link refuses increment workspaces from a linked worktree with the claim hint (#898, 5.19, increment_a7e22ca60ad1); the built CLI proves it from named, nested and detached worktrees in Claude Code and Codex shells, and claims in place after (#918, 11.13, increment_a660fb569716).\n- Make the agent-link Windows proof complete reliably ([#764](https://github.com/storytree-ai/storytree/pull/764)) — Diagnosed: slow suite, not a stuck read (38 Windows runs 108.7-178.5 s vs 180 s; Linux 55 s, macOS 107 s; per-test floor 1.1 s vs 0.15 s on Linux). Landed: agent-tools tests split into three files; 6.39's phases are named subtests, so a kill names the phase (checked locally with a forced stall). Windows agent-link on #764: 125.3 s, 120.6 s (PR), 149.0 s (queue). Margin is still thin; the remaining cause, the throwaway test Postgres flushing every commit to disk, is parked as increment_a67062e2f63d (local-postgres + dev-loop).\n- Roads end on the island as drawn, not above it ([#706](https://github.com/storytree-ai/storytree/pull/706)) — PR #706 merged 2026-10-06T07:10:16Z. Closed by the follow-up session (increment_1c39930c645a): its own session closed out before the merge and nothing closed it after (friction_bde5ed422e98).\n- Retire the shore relief the roads no longer stand on ([#711](https://github.com/storytree-ai/storytree/pull/711))\n- Capture settling actually awaits the requested frames ([#700](https://github.com/storytree-ai/storytree/pull/700))\n- Hand tests the superuser's url apart, for their setup ([#986](https://github.com/storytree-ai/storytree/pull/986)) — PR #986 merged 2026-10-09T09:10:08Z\n- A mini globe with its poles marked shows where you are and takes you home ([#1093](https://github.com/storytree-ai/storytree/pull/1093))\n- Inline test-database drops go through the one drop module ([#1073](https://github.com/storytree-ai/storytree/pull/1073))\n- The tests that still fail in the merge queue are diagnosed and fixed ([#1032](https://github.com/storytree-ai/storytree/pull/1032))\n- Write deletion-time project snapshots privately ([#863](https://github.com/storytree-ai/storytree/pull/863)) — POSIX deletion-snapshot privacy landed; Windows ACL residue is increment_64fbd4fdd352.\n- The agent link's tool can add frictions to an increment's remedies (packages/agent-link) ([#976](https://github.com/storytree-ai/storytree/pull/976))\n- Prove capability 3 · Sharing controls and mark it built ([#798](https://github.com/storytree-ai/storytree/pull/798))\n- The map chapter tells the build as a story, in seven steps ([#822](https://github.com/storytree-ai/storytree/pull/822))\n- The drawing engine's comments stop naming the deleted harness folder ([#688](https://github.com/storytree-ai/storytree/pull/688))\n- An existing decision can supersede older ones ([#684](https://github.com/storytree-ai/storytree/pull/684))\n- The Mint box's launchers run lanes through the repo's runner ([#881](https://github.com/storytree-ai/storytree/pull/881)) — Box cut over 2026-10-08 06:59Z with the reviewed, dry-run-first script ~/storytree-lanes/cutover-20261008/cutover.sh: run-lane.sh is a shim over runner.mjs; launch-night.sh and launch-mintlib.sh exec launch.mjs; lane-engine.py renamed lane-engine.py.retired-20261008; AGENTS.md, night-common.md and the box's global notes name the new status command; backups *.bak-20261008-repo-runner. Old and new status agreed before retiring (87%, next lane codex). Real lane: track X ran increment_e4340bb108a0 through the repo runner from 07:17:44Z, status 'engine codex Codex weekly allowance 88% used, resets 2026-10-14T10:27Z'; track G's new runner took increment_c235ce6dae50 from the library. Residue: runners started before the cut-over keep the old double engine count until their queues empty.\n- On a laptop, the claim step's cart sometimes sits under the arcs drawer ([#807](https://github.com/storytree-ai/storytree/pull/807))\n- Attribute shared-library slot demand during a recurrence ([#776](https://github.com/storytree-ai/storytree/pull/776)) — Reading 2026-10-07 00:22 UTC during ordinary lane activity (~/storytree-lanes/night-L-254-observe-1.json): 16 sessions, every storytree client's application_name blank, so attribution stopped at account/database. PR 776 names each connection 'storytree <host> <pid> <script>' (contract 8.6), so the next recurrence is attributed by grouping pg_stat_activity on application_name. No exhaustion was seen in this reading; none is blamed.\n- cli 11.12 stops racing a one-second idle window on a slow runner ([#1048](https://github.com/storytree-ai/storytree/pull/1048)) — Superseded by PR #1048 (increment_d259d7c09893), which landed the same live-holder fix to cli 11.12 (idle-after 10m); PR #1052 closed unmerged after it conflicted with main.\n- Desktop main: register the sign-in scheme under --callback-check ([#979](https://github.com/storytree-ai/storytree/pull/979))\n- Claim from the command line without a worktree ([#788](https://github.com/storytree-ai/storytree/pull/788))\n- Diagnose the laptop's white globe under load ([#849](https://github.com/storytree-ai/storytree/pull/849)) — Diagnosed and fixed on the laptop 2026-10-08. Cause: Windows resets this Surface Pro 11's Adreno X1-85 GPU about ten times a day (LiveKernelEvent 141 in the Application log every few hours since at least 2026-09-25, including 06:08 and 06:09 on 2026-10-04); each reset crashes the app's GPU process. Chromium then blocks the page from 3D APIs after the second crash and disables WebGL after the third, so the lost context is never restored (6.15 only redraws a context the browser gives back) and the globe stays white with its nameplates until restart. Reproduction on a second instance (throwaway home, copied Cloud SQL settings, --remote-debugging-port=9222): 4 headless Edge pages animating a shaded WebGL scene for 3 min did not cause it (no context events, no Windows reset); CDP Browser.crashGpuProcess did: crash 1 restored, crash 2 lost and never restored, WebGL disabled_off, window 46% white, the incident's look. Fix (#849, Lifecycle contract 1.14): startup calls app.disableDomainBlockingFor3DAPIs() and adds --disable-gpu-process-crash-limit; with both, four crashes each restored in about 1 s and WebGL stayed enabled (each alone fails at crash 2 or 3). Before/after pictures in apps/desktop/evidence/gpu-resets. Not addressed: why the Adreno times out so often (driver 31.0.137.0); that is the machine's, not storytree's. Probe: session scratchpad white-globe-probe.mjs.\n- The tree is not re-read whole on every tick while agents work ([#854](https://github.com/storytree-ai/storytree/pull/854)) — Laptop re-measure 2026-10-08 with pnpm lag:desktop on main 9280c366 (includes #854), second instance, library on the Mint box's Postgres over Tailscale, the owner's sessions active, cold then warm: storytree:project-tree was asked once per run (cold 426 ms, warm 249 ms, 679 KB), against 32 cold / 24 warm per run (p50 302-366 ms, 665 KB each, about every 2 s tick) in the first 2026-10-08 re-measure. The live tick no longer re-reads the tree. Runs: %TEMP%\\claude\\lag-20261008-mint\\{cold,warm}.\n\n- Write automatic library backups privately ([#860](https://github.com/storytree-ai/storytree/pull/860)) — POSIX automatic-backup privacy landed with retained-file repair; Windows ACL residue is increment_6dc670fabf64.\n- The library's dropProject rides out a refused terminate (42501) ([#1017](https://github.com/storytree-ai/storytree/pull/1017))\n- The pool's briefs land through the watcher, and the night-track code retires ([#1021](https://github.com/storytree-ai/storytree/pull/1021))\n- Live desktop pathways grow toward their destinations ([#833](https://github.com/storytree-ai/storytree/pull/833)) — Merged PR #833 at 3f9f497550e28432554813161993444335912201 on 2026-10-07 15:40:17 UTC after Linux, macOS and Windows CI and merge-queue verification. Desktop beige crossings now grow on first display and real link arrival using stable link windows and physical fronts; established/shared roads stay complete, unrelated polls do not restart them, and reduced motion is immediate. All 131 saved dependency identities remain. Real before/after captures and clips are committed; full gate passed. Browser proofs run sequentially and observe consumed updates. Zero-code destinations and inland emphasis remain held on this arc by their owner questions.\n- CI health survives cancelled jobs without logs ([#693](https://github.com/storytree-ai/storytree/pull/693))\n- Library: searchEach and relatedEach read the artifacts once (6.11) ([#772](https://github.com/storytree-ai/storytree/pull/772)) — Built in PR #772 (library 6.11, librarian 6.7) by lane L's increment_c093bcc227fd, merged 2026-10-07T00:20:44Z; closed by the Mint box manager.\n- The worklist tool returns a readable result ([#815](https://github.com/storytree-ai/storytree/pull/815))\n- The Mint slot count counts lanes, not engine processes ([#881](https://github.com/storytree-ai/storytree/pull/881)) — queue.mjs countEngines counts each lane once from ps pid/ppid/args (contract 12.1). On the box after the merge: `launch.mjs slots` read 3 engines where the old pgrep count read 5+ (6 processes for 3 lanes). Old bash runners still alive keep the old count until their queues empty; new runners use the new one. Cap unchanged at 5.\n- Desktop: packaged sign-in deep links reach the app on CI's runners ([#968](https://github.com/storytree-ai/storytree/pull/968)) — (a) Windows second-start callback delivery proved in check-install.mjs, 1.15 PASS on CI (unstamped, dropped) and staging (routed to the sign-in session); (b) landed in #933. OS protocol-handler route parked as a track-A follow-up on the arc.\n- Releases publish again: release verify gets CI's test limits ([#1094](https://github.com/storytree-ai/storytree/pull/1094))\n- An arc whose work waits only on dates reads parked until the first ([#945](https://github.com/storytree-ai/storytree/pull/945)) — PR #945 (branch claude/increment-3529cf532f81-1c7844) merged to main 2026-10-08T21:58Z as ff880788: library 10.10 derived park in work-in-flight.ts with its test, and arc show/list wording in cli arc.ts. The earlier lane landed it without closing the increment.\n- Diagnose unfinished live-road frames on macOS CI ([#864](https://github.com/storytree-ai/storytree/pull/864)) — Merged PR 864 at d11ce269f7a90d78416372619f733a440c194b23 after the local gate and Linux, Windows and native macOS PR and merge-queue verification. The retained failure was unfinished geometry with redraws pending and multi-second frame gaps. Capture now uses WebGL-only SwiftShader with ordinary software compositing and reports passive renderer/frame timing. Native macOS initial roads completed in 14 frames over 8.5 seconds in the PR and 5.3 seconds in the queue; forest passed in 113.3 and 107.4 seconds within its unchanged 180-second budget. All first-display, real dependency, shared-road, unrelated-poll and reduced-motion assertions, scene data, clock, deadlines and cleanup guards were preserved. No residue or owner questions.\n- Arc-bar capture's geometry asserts match today's bar ([#1075](https://github.com/storytree-ai/storytree/pull/1075))\n- Each story declares a verb once and both doors mount it: the session verbs first ([#1070](https://github.com/storytree-ai/storytree/pull/1070))\n- Run tests as the ordinary database role, keeping the superuser for test setup ([#989](https://github.com/storytree-ai/storytree/pull/989))\n- A wait for the owner or an outside event, with a note: library and agent tool ([#783](https://github.com/storytree-ai/storytree/pull/783))\n- CI's own-health job reaches the library on the Mint box over Tailscale ([#802](https://github.com/storytree-ai/storytree/pull/802)) — Post-merge Own health run 37687662356 succeeded on main commit 5ef964f3544e2263720226ba6a43748a2abca981: keyless Tailscale join, Mint address logged, and 839 CI health events at sequences 223626-224464 with the exact commit. HEALTH_PG_ADDRESS deleted and absence verified; Cloud SQL fallback restored. Local gate passed typecheck, full tests and plan edges; guidance not run because no guidance changed.\n- Desktop main: observable sign-in callback delivery for CI ([#951](https://github.com/storytree-ai/storytree/pull/951))\n- One fold for sessions and claims: each log-reading rule written once ([#1040](https://github.com/storytree-ai/storytree/pull/1040))\n- Prepare library role fixtures for authenticated PostgreSQL ([#896](https://github.com/storytree-ai/storytree/pull/896)) — Library role fixtures authenticate: per-role synthetic passwords via testRoleUrl/withTestClientAs, a scram-sha-256 pg_hba rule for t- test roles on every CI platform, and a SCRAM-answering Cloud SQL stand-in. Gate 21/21 PASS; SCRAM-only disposable cluster: branch 60/60 across six files, unchanged main 8.3 fails 28P01. Admin/role fixture contract recorded in the body for increment_428779c116fe. address-connection (capability 15) untouched: claim refused; it passes unchanged under SCRAM.\n- Prepare authenticated local discovery in packages/agent-link ([#858](https://github.com/storytree-ai/storytree/pull/858)) — Authenticated client discovery landed in this increment's PR #858. ADR-0941 records the handoff contract. Server authentication and migration remain increment_428779c116fe; independent verification and loopback review remain separate. Prior validation evidence remains in the original closure history.\n\n- Releasing the last claim returns an unclosed increment to proposal ([#902](https://github.com/storytree-ai/storytree/pull/902)) — PR 902 merged through the merge queue after Linux, macOS and Windows passed. Library returnIncrement (10.9); CLI workspace release returns an unclosed increment to proposal (11.11), arc increment unstart repairs stranded ones (4.12), arc show names stale waits with their unwait command (4.11). Local gate passed full scope. Residue: agent link's release tool and close-out, parked as increment_0f3784bb5fd6.\n- Diagnose and fix the standalone Windows tools proof timeout ([#699](https://github.com/storytree-ai/storytree/pull/699))\n- One owner for setting up a story's own database ([#1060](https://github.com/storytree-ai/storytree/pull/1060))\n- Windows install check: open a sign-in callback through the OS ([#982](https://github.com/storytree-ai/storytree/pull/982))\n- Queue runs on loaded runners do not fail on fixe