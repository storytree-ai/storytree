        "note": "Landed in #396 (merged 2026-10-01 05:24Z by the merge queue). One live reading per page shared by the forest, sessions list, board and knowledge core (1 changes + 1 lines ask per 2 s tick, was 2 + 2); a start from the reading kept in the page's IndexedDB; held state thinned and folded. Measured on the Mint box, headless Chromium over a stand-in bridge serving a read-only dump of the real library, same instrument both sides: time to ready 15.1 s -> 8.9 s first start, 15.5 s -> 1.5 s next start; bytes before ready 113.8 MB -> 57.5 MB first, -> 1.8 MB next; page heap after GC 121-124 MB -> 51-56 MB; what the page drew hashed identically. No time window: every consumer folds from the history's start, so the bounded start is the kept reading plus thinning. Residue: a full incremental fold of the sessions and claims reading (sessionsFrom / claimsFrom) so held log lines can be dropped (increment_d551be57d611). Closed by laptop session 0ff4e934: the Mint lane (6e54a7e4) was killed by a power-cycle while polling for MERGED, after the merge, before its close-out."
