rnings only.\n\nPictures:\n- https://github.com/storytree-ai/storytree/blob/bf06c38d3deb114c363c863010ec206d150f6048/packages/forest/src/view/evidence/forest-library-toggle/forest-front.png\n- https://github.com/storytree-ai/storytree/blob/bf06c38d3deb114c363c863010ec206d150f6048/packages/forest/src/view/evidence/forest-library-toggle/forest-quarter-turn.png\n- https://github.com/storytree-ai/storytree/blob/bf06c38d3deb114c363c863010ec206d150f6048/packages/forest/src/view/evidence/forest-library-toggle/library-front.png\n- https://github.com/storytree-ai/storytree/blob/bf06c38d3deb114c363c863010ec206d150f6048/packages/forest/src/view/evidence/forest-library-toggle/library-quarter-turn.png\nEvidence/readme: https://github.com/storytree-ai/storytree/blob/bf06c38d3deb114c363c863010ec206d150f6048/packages/forest/src/view/evidence/forest-library-toggle/README.md\nLibrary patch/checklist: https://github.com/storytree-ai/storytree/blob/bf06c38d3deb114c363c863010ec206d150f6048/packages/forest/src/view/evidence/forest-library-toggle/library-update/README.md\nRed output: https://github.com/storytree-ai/storytree/blob/bf06c38d3deb114c363c863010ec206d150f6048/packages/forest/src/view/evidence/forest-library-toggle/red.txt\n\nSmall desktop smoke flag added: pnpm desktop:smoke --forest-mode forest --screenshot smoke-forest.png ; pnpm desktop:smoke --forest-mode library --screenshot smoke-library.png . It clicks the real control and checks selected state. Laptop Electron captures remain the supervisor's handoff because this box has no desktop display. The ordinary smoke model inventory is not represented as Library GPU counts; the headless harness proves those separately.\n\nlibrary text pending: applied by the laptop supervisor\nThe patch updates Forest capability 3 with the as-built toggle and never-hidden narrowing, and Knowledge core capability 1 to say Library shows it alone. No new decision record. No claim taken or released by this lane. Librarian pass found no new memory t