sleading refusal was already fixed by PR #490 (MERGED 2026-10-02T00:43:00Z; Linux, macOS and Windows CI passed). Picker-answer acceptance predates that PR; #490 explains the required marks. Existing contract 6.35 covers the refusal and successful retry. Full pnpm gate passed all 16 test units, typecheck and plan-edge checks; guidance NOT RUN because no roles or guidance notes changed. Corrected friction_fe3b20c49cf7 in place and stamped #490 as its remedy. No additional product change, artificial red test, commit or duplicate PR was needed. Exact proof: /tmp/st03-resteer-proof.test.mjs; gate evidence: /tmp/st03-resteer-gate.log. The later duplicate increment_5fc7a043f85b is to be withdrawn pointing at this verified landing.\n\n- A test names Code survey's contract 8.6: executed files belong to the capability whose tests ran them most ([#423](https://github.com/storytree-ai/storytree/pull/423)) — Already done on main: PR #423 (merged 2026-10-01 09:52, after this increment was routed at 09:25) added packages/forest/src/code-survey/code-survey.test.ts '8.6 a file a numbered test's runs executed belongs to the capability whose tests executed it most…'; main's health now credits 8.6. No code change in this lane.\n- Add a Forest / Library toggle to the globe ([#126](https://github.com/storytree-ai/storytree/pull/126)) — Built and landed the Forest / Library toggle on the existing globe (ADR-0660 D4), PR #126: https://github.com/storytree-ai/storytree/pull/126 . Forest is the launch default, with no persistence. Library hides the shell, islands, trees, labels, claims, failure markers, pathways and island overlays; the same knowledge core remains mounted. Switching preserves the scene, camera, rotation and zoom. Library clears story selection and closes its panel; hidden islands cannot be picked. Forest retains never-hidden failure attention, including after returning from Library.\n\nRed SHA: ef8a83346326423e0e0cc7778f05eaa7202a5b13 (committed, pushed, observed failing: tw