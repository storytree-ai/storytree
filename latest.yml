        "title": "Removing a project frees its folder on this machine",
        "pr": "362",
        "note": "Removing a project now also frees its folder on this machine: deletes the folder's .storytree.json when it names the project (unless git tracks it: then it is left and named, 'delete it to free the folder'), and forgets this machine's trunk (agent-link forgetTrunk, beside registerTrunk; trunksOn/forgetTrunk exported). Decided against ADR-0757 D4: a freed folder added again is an ordinary new project; the project returns only by a deliberate join (doctor --join); 'adding the folder again brings it back' holds only while a git-tracked marker is kept. The hidden list (removed-projects.json) stays: the picker shows every library project, including ones with no trunk here. For increment_dbea5043ac29 (moved folder): it may assume trunks are forgettable per project+machine (forgetTrunk), that removal is the only thing that forgets one today, and that the hidden list is independent of trunks, so replacing a stale trunk on first sight or re-setup is a forget-then-register with no picker side effect. Follow-up parked: a project joined back on purpose should leave the hidden list."
