est's sessions strip ([#597](https://github.com/storytree-ai/storytree/pull/597))\n- Test Postgres cleanup on Windows: permission denied to terminate a process (42501) ([#174](https://github.com/storytree-ai/storytree/pull/174)) — Mint Codex lane pg-cleanup (supervisor 26f87539). Cause demonstrated: DROP DATABASE ... WITH (FORCE) as the unprivileged test login fails 42501 (TerminateOtherDBBackends) when an autovacuum worker is attached; reproduced on Linux/Postgres 17.10. Helper now retries plain DROP once only after that exact error and still fails if the database remains. Red 83d2462, green 215c1bc. Historical Windows logs do not name the backend, so autovacuum is a demonstrated cause, not a proven identity. test-ratio all: 42,272 / 33,937 / 1.25.\n- Move the hand-rolled forest captures onto the capture kit's fake bridge ([#676](https://github.com/storytree-ai/storytree/pull/676))\n- A word Windows PowerShell 5.1 changes at an inner double quote is refused, not acted on ([#492](https://github.com/storytree-ai/storytree/pull/492)) — Landed in storytree-ai/storytree#492. On Windows the installed command's launcher passes the caller's line on in STORYTREE_COMMAND_LINE, which the command reads and removes. The front door reads that line by Windows' rules and refuses a word whose quotes the caller's own quoting changed, before acting, naming the word and saying to pass it as @<file> or write each inner quote as \\\" (ADR-0856, contract 1.12, green on the laptop and on CI's Windows runner).\n\nMeasured over 27 raw lines from Windows PowerShell 5.1, Git Bash and Node, it refuses exactly PowerShell 5.1's five changed lines and acts on all the rest (packages/cli/evidence/powershell-quoting). Two PowerShell changes look standard and cannot be told: a whole quoted word with no space, and --title=\"a b\"; the latter is how a cmd.exe user rightly passes a value. In-place notes are on ADR-0854 and ADR-0851 D2.\n\n- Every activity-log reader asks for only what it needs ([#668](h