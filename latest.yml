        "title": "The installed command on Windows keeps an argument's > as written",
        "pr": "489",
        "note": "Landed in storytree-ai/storytree#489 (merged 2026-10-02 00:41 UTC). On Windows the installed command is now `storytree.exe`, a small program of its own (ADR-0854), so cmd.exe never reads its words. From Git Bash, Windows PowerShell 5.1 and a program that starts it, a word holding an inner double quote, `>`, `&`, `|`, `%` or `^` arrives unchanged, nothing else runs and no file is written (contract 1.9, green on the laptop and on CI's Windows runner). Git Bash now finds `storytree` by name.\n\nThe launcher is built from C with LLVM for x64 and arm64, by buildBins, the CLI's own build and each payload. The setup check and the installer write the same launcher, and replace storytree's own `storytree.cmd` in its folder. A launcher removed or replaced while it runs (setup remove, contract 8.9, reworded) is renamed off the path and deleted once it exits.\n\nResidue: Windows PowerShell 5.1's own quoting still splits a word that holds a space and an inner quote, so refusing that is increment_e95ceec15288. Evidence: packages/app-setup/evidence/native-launcher/.\n"
      },
