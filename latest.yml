        "note": "Landed in PR #883 (merged by CI on Linux, macOS and Windows; Windows built the NSIS installer and start-checked the installed app, so the bundled SDK loads). apps/desktop adds @workos/authkit-electron 0.1.2 (pinned; ESM-only, bundled by esbuild into the CommonJS dist/main.cjs), peer @workos-inc/node ^10.4.0, @workos/authkit-session 0.6.0 and @storytree/identity. The main process composes the SDK's internals (session manager, safeStorage storage, system-browser PKCE ceremony) WITHOUT createAuthKit/exposeAuthKit, whose page bridge would give the renderer an access token. It answers the optional bridge.feedbackIdentity (status/signIn/signOut) with createFeedbackIdentity's id+email. The bridge member exists only when the build stamps STORYTREE_WORKOS_CLIENT_ID and STORYTREE_IDENTITY_URL (build.mjs defines), and no build stamps them yet. storytree-auth://callback is routed under the app's own single-instance lock (second-instance argv, macOS open-url buffered before ready, cold-start argv), declared in electron-builder protocols (macOS/Linux; NSIS declares no schemes) and registered at runtime via the SDK's registerProtocol when offered. The callback adapter (callbackSession, feedbackIdentityConfig, callbackUrls) lives in @storytree/identity/desktop, because the package rule (3.1/9.1) refused it in the frame. Contracts: identity 2.5 contract_e56347b29707; app setup 5.6 contract_69a1be3a5492. The main-process adaptation of the parent increment_14bc75c1e39c landed here too (see its body)."
