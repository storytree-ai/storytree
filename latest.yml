  "releaseNotes": "# storytree 0.3.711\n\n- Islands grow with their code from anchored places, nudging neighbours; the globe grows when full ([#351](https://github.com/storytree-ai/storytree/pull/351))\n- Act on the owner's answer about the app's copied lifecycle promises and its empty-page promise ([#513](https://github.com/storytree-ai/storytree/pull/513)) — Retired five copied lifecycle contracts with reasons naming their implementation and tests; updated Projects 2.5 to the current add-project instructions; moved the unchanged empty page into the app package with a red-then-green 2.5 test. All library changes read back. Gate and three-platform CI passed.\n- Re-claiming right after a merge never points at the merged branch ([#286](https://github.com/storytree-ai/storytree/pull/286)) — storytree workspace now asks GitHub about a held claim's branch at once; a merged one ends the claim and a fresh worktree is made instead of 'Work there'.\n- Writing a capability's files claims it ([#666](https://github.com/storytree-ai/storytree/pull/666)) — Edits now claim their capability (ADR-0924 D1-D4): the upkeep copy of a hook claims, for this machine's recent edits, each file's capability for the editing session, recording the file; a capability another live session holds is not claimed and a claim-refused line names the file; both sessions are told at their next prompt from notices kept on the machine. Lookup is the interim code survey behind one seam (CapabilityLookup in agent-link claims/edit-claims.ts); ADR-0924 D5 stays open. Contracts 5.20-5.22 and 3.20.\n- The site asks visitors to join the waitlist instead of installing ([#519](https://github.com/storytree-ai/storytree/pull/519)) — The website now asks visitors to join the waitlist, with validation, retained answers on errors, disclosure, no-JavaScript joining, accessibility and laptop/phone pictures. PR #519 merged as 0167aaea7fdeafcd9865f69603ec08986d41224b after all three merge-queue platforms passed. Automatic publication run 36980111923 finalized version 01M3XS5WBKEG4S8K028CRQSFCQ without manifest warnings; the live version matched and anonymous collection GET returned 403 at 07:46 UTC. The owner-approved live create/read/delete proof remains on increment_31bf8f269e51 held by question_b834aafa73bb; no live row or owner key was used. Local supplemental GitHub link 503/504 failures remain recorded in friction_cfaffffc61c5 and the actual acceptance verdict.\n- Read a user's CI test results into verified health, proven on the shop ([#592](https://github.com/storytree-ai/storytree/pull/592))\n- Test and gate flags in a form every shell passes through ([#284](https://github.com/storytree-ai/storytree/pull/284)) — Printed rerun hints, gate help, script headers, the CLAUDE.md header and the session-orchestrator role now teach 'pnpm run test --flag' / 'pnpm run gate --guidance', which passes flags through in Windows PowerShell 5.1, Bash and CI. README.md lines 76-77 and ADR-0785 D3 were outside the lane's fence: filed as friction_bc94be38a4e4.\n- Lit lanes for a selected story's direct dependencies ([#561](https://github.com/storytree-ai/storytree/pull/561)) — Merged 2026-10-03T01:04:30Z through the merge queue after Linux, macOS and Windows CI. forest 3.26 and world 6.8 and 6.9 went red, then green. Evidence is in packages/forest/src/view/evidence/selection-lanes/ (12 lanes for the agent link: 1 up, 11 down; all drawn from the dependency end).\n- The desktop app stops loading the unused tree kit ([#639](https://github.com/storytree-ai/storytree/pull/639))\n- Shop 4: checkout, completing wave 1 ([#585](https://github.com/storytree-ai/storytree/pull/585)) — Landed in #585 (merged 2026-10-03T19:02Z, official suite 26/26); closed by the overnight manager because the shop lane died (API ENOTFOUND 06:07 AEDT) before closing it.\n- The forest's story-node render contracts get tests that name them ([#500](https://github.com/storytree-ai/storytree/pull/500)) — Named 3.12 hover and five-pixel drag tests pass in CI. Ten named browser checks prove 3.5 glass, 3.9 mode layers and 3.10 preserved globe and interaction; acceptance recorder wrote all three passing. Updated two-mode evidence and census. PR 500 merged through all three platforms and the merge queue.\n- Claude Code on Git-less Windows: hooks miss the PowerShell tool ([#207](https://github.com/storytree-ai/storytree/pull/207)) — Built on Mint (lane winhooks, red 74eb771, green 4475690): Claude Code's hooks listen for PowerShell as well as Bash and read a PowerShell call as the command; existing installs get the new matchers at their next setup check. Library: definition_35218d10655c meaning amended by supervisor 19f80731. Live proof on the Git-less laptop is increment_94525b4e9028's retest.\n- Capture checks close their HTTP probes ([#558](https://github.com/storytree-ai/storytree/pull/558)) — Capture lifecycle test now closes every HTTP probe before completion. Native Windows force-exit baseline reproduced libuv abort; equivalent explicit-close probes and full native scoped gate passed. All three PR and merge-queue platforms passed; merged as c563562835811e29e222e2d69eb49f8f7e31a8a4. Assertions and guards unchanged.\n- The app's window and context reads fetch only the activity log's new lines ([#357](https://github.com/storytree-ai/storytree/pull/357))\n- 0.3 arc surface ([#112](https://github.com/storytree-ai/storytree/pull/112)) — All remaining arc-surface contracts landed in storytree-ai/storytree: #101 Work states at increment and arc grain (1.4–1.6); #103 Agents on the board (2.1–2.4); #105 Waits (4.1–4.4); #108 Briefing (5.1–5.3); #112 the read-only overlay and in-app proofs (3.1–3.6). These extend the original #35 part states and #37 live reading in packages/arc-surface. The desktop mounts the package view over the forest, carries public library reads, and invokes its smoke check. The collision fence was respected; no forest-folder mount remainder is left.\n\nEach capability followed committed red then green, with every commit pushed and CI merging each non-draft PR after Linux, macOS and Windows passed. Final local verification passed typechecking and all 12 test units under the heavy lock. Actual desktop-renderer acceptance with isolated Postgres and headless Chromium verified live claims (1.84 s), clock-only idle, retries, every lifecycle scope, preserved question folds/scroll, live settlement, read-only actions, and returning to the same forest on Close/Escape. Evidence is in packages/arc-surface/evidence; the lane report is /tmp/arc-surface-report.md. No product work remains in this increment. The owner can use pnpm desktop:smoke on the laptop to inspect the native desktop capture; this headless box's acceptance is recorded.\n\nOne earlier Windows library teardown failure was recorded as friction arc-surface-windows-cloud-cleanup-permission; subsequent fresh-main verification passed without modifying or skipping the library tests. No owner decision is required. No claims or successor sessions were taken by this lane, as directed.\n- Guardrail: no unallocated code lands ([#602](https://github.com/storytree-ai/storytree/pull/602))\n- The packaged app starts again: 0.3.606 dies at startup in sourceVersion ([#576](https://github.com/storytree-ai/storytree/pull/576))\n- Shop 9: stock and an admin, completing wave 2 ([#588](https://github.com/storytree-ai/storytree/pull/588))\n- Save a key once; every storytree process finds it ([#441](https://github.com/storytree-ai/storytree/pull/441)) — storytree auth set|list|remove keeps keys in an owner-only, locked auth.json in storytree's home; the new @storytree/keys resolver reads explicit > saved entry (literal or !command, run once per process) > environment variable; keys 1.1-1.5 green on Linux, macOS and Windows; README has a Keys section. No agent-link tool reads a key (ADR-0843 D5), nothing to build.\n- An untrusted Codex session is asked only to trust storytree's hooks ([#347](https://github.com/storytree-ai/storytree/pull/347))\n- A test number the health reader cannot take is reported, not ignored ([#407](https://github.com/storytree-ai/storytree/pull/407)) — A test named '3.6: …' now counts for 3.6: the health reader takes a leading contract list that ends in a colon. Ten tests named that way (app-setup's 1.1/1.4/1.6/1.8 deliver and uninstall tests, the command line's 3.6) now count for their contracts; a title it still cannot take is listed under 'name no contract'.\n- Retire Conduit from the tour now that no step teaches on it ([#631](https://github.com/storytree-ai/storytree/pull/631)) — PR 631 merged through the merge queue. The tour's Conduit globe, stages, places, lineStages, note and recording date are gone, conduit-snapshot.json is out of the bundle (forest-scene 7,556,685 -> 7,469,494 B; gzip 1,419,923 -> 1,416,127), and Conduit's refresh command and its test are removed. Contract 2.9 is retired; 3.4 is reworded to any saved growth (its tests kept, conduit-growth.ts renamed saved-growth.ts). The gate and all browser journeys pass. Evidence: packages/website/evidence/retire-conduit/.\n- A closed increment moves with its outcome ([#542](https://github.com/storytree-ai/storytree/pull/542)) — PR #542 added identity-preserving moves for completed increments through the library, CLI and MCP. Dogfood created arc_5b7cfcbb4971, moved all 73 completed app-setup increments with their outcomes intact (71 landed, 1 failed, 1 withdrawn), and narrowed arc_cfc7db517fae to its one open Windows dev-home teardown increment.\n- A newly read note lights only when its growing line arrives ([#203](https://github.com/storytree-ai/storytree/pull/203))\n- The world and The local database become stories: no shared engines ([#332](https://github.com/storytree-ai/storytree/pull/332))\n- App: allocate capture and mounted desktop surfaces ([#552](https://github.com/storytree-ai/storytree/pull/552)) — PR #552 MERGED at 2026-10-02T21:26:16Z as 48371b60bd4cd9475b3d80cdf2a4cc431784596d after initial CI 37064026014 and merge queue 37065341502 passed Linux/macOS/Windows, including Windows distributable and installer checks. The shared real Desktop renderer capture proves project selection/retry, empty-list recovery, persisted Arcs/Library switches, reload/remounting and the complete project census. Actual Node build/bridge/launch/output/runner and browser functions are measured through matching source maps, drained at the capability boundary. Mutation red efb65fcd (disabled surface redraw, Arcs remained mounted) and green source d8bdc26d were observed and pushed; evidence head 6d26f7f5. Database bridge is a stand-in; real App actions use a throwaway home. No native Electron or live-database acceptance is claimed by this capture.\n\nExact paired readCodeSurvey with identical saved before.tree: project 1801/67836 -> 825/67561 unclaimed/total nonblank source lines; App/Desktop 976/4121 -> 0/3846. Seven remaining target files (701 final lines) gain allocation. Dead view removes254 lines, seed test support removes20 from source inventory, direct empty-state import removes1 redundant renderer line. Existing20-line App surface bridge reweights capability3->2 under measured tie-breaking; every other story's survey is identical. Snapshots /home/mickh/storytree-lanes/st03-capture-{before,after}.json.\n\nAll8 focused tests and all29 App coverage test files passed. Foreground pnpm gate passed typecheck, all11 affected-scope units and plan edges; guidance NOT RUN for unchanged roles/supporting notes. Ratio App0.51, overall0.96. Friction/health/graduation queues empty; independent librarian found no decision/guidance curation trigger or new durable lesson. Evidence descriptions for2.1 and3.7 updated/read back; no new friction or owner re-steer. Only App/Desktop source changed; Conduit and shared main untouched.\n\nNo App implementation residue. Remaining825 repository lines belong to the coordinator's existing Forest allocation work; no successor started. HARD END at assigned lane boundary. Report /home/mickh/storytree-lanes/st03-allocation-capture-report.md; claim/process/clean-tree close-out follows immediately.\n- Rebuild export: the rebuilt shop's growth replaces the website's snapshot, with verified CI health ([#615](https://github.com/storytree-ai/storytree/pull/615)) — refresh-shop --project shop2 exports the rebuild: 27 stages, verified CI health at every stage (28/31 healthy at the end), saved in evidence/shop-parallel/export. Not yet swapped into the website: tour ids, contract 2.12 titles and the date caption are outside this lane's fence; parked as increment_8254e068412e.\n- Verify Updates 4.12 after the health recorder catches up ([#499](https://github.com/storytree-ai/storytree/pull/499)) — Read-only verification: the live library shows Updates 4.12 verified passing. Successful main Own health run 36973332407 at commit c272fbfcdfdf984113d1dd1c7b0d594148cc687d recorded Updates 4.12 passing, 5/5 tests, at 2026-10-02 06:30:45 UTC. These are the tests already landed in PR 499. No code, recorder or verified-health write was needed.\n- Forest: allocate snapshot and update entry points ([#560](https://github.com/storytree-ai/storytree/pull/560)) — PR #560 MERGED at 2026-10-03T00:15:43Z as caa2617226517bcd277494c67600f9fb3096cd59 after initial CI37080341335 and merge queue37080856867 passed Linux/macOS/Windows and aggregate verification. Red a2ae63a2 and green feae2fd4 were observed and pushed. Four expected mutation assertions failed (missing surveyed edges, lost unchanged-island reuse, leaked snapshot temporary file), then all14 focused proofs passed.\n\nForest1.9 now reads real manifests through its survey compatibility entry; existing redraw proofs name3.2. New3.25 protects the live public snapshot save/type seam kept in Forest under ADR-0847. Unused legacy drawing/refresh wrappers were removed after consumer inspection. Only four Forest files changed; approved appearance, Chapter2 recording, mounted views, package boundaries, Map source and capability7 remained untouched.\n\nExact paired actual readCodeSurvey, same saved live plan and cross-check with current-checkout reader: project825/67637 ->729/67597 unclaimed/total; Forest825/4157 ->729/4117. Only three records change: compatibility2 lines ->Story nodes; snapshot63 unclaimed ->23 allocated Story node render; planet-update31 ->Story node render. Reduction96 =56 live allocated +40 unused removed; no ownership assertions or metadata edits. Evidence /home/mickh/storytree-lanes/st03-forest-allocation-{before,after}.json.\n\nFinal foreground pnpm gate passed typecheck, all11 affected units and plan edges; guidance NOT RUN for unchanged roles/supporting notes. Initial test-helper TypeScript target failure was corrected before final gate. Ratio Forest0.38, overall0.95. Friction/health/graduation drains empty; independent librarian found no decision/guidance correction or new durable note. Contract evidence descriptions updated/read back; no owner re-steer. Self-package alias tracing gap recorded as friction_cec8ea0109e3 for another branch to route.\n\nNo implementation residue in this increment. The remaining729 lines are the six files already assigned to mounted-views increment_fb4b569a35c5; its Running sessions claim must be rechecked before any continuation. Coordinator and guardrail retain their declared waits. Report /home/mickh/storytree-lanes/st03-forest-allocation-report.md. Claim/process/clean-tree verification and safe close-out follow.\n\n- The code survey reads a story's tests outside its src ([#617](https://github.com/storytree-ai/storytree/pull/617)) — The code survey reads test files anywhere in a story's package outside src, as tests only (contract 8.13); the rebuilt shop's islands get capability territories coloured by its CI health.\n- Packaged delivery: connect needs the app launched, and finish/doctor move more than they say ([#276](https://github.com/storytree-ai/storytree/pull/276)) — Closed by laptop session c56faf99 for Mint lane delivery (session 056c8ae5), which exited while CI ran. Parts 1-2 in PR #276 (merged 2026-09-29 22:00 UTC, green on Linux/macOS/Windows): setup connect works from an installed copy without delivery.json (it uses the node and storytree-mcp.mjs beside the helper; a clear refusal otherwise); finish still repoints storytree's own launchers on PATH but now lists them in command.replaced, which install.ps1 prints. Part 3 (doctor names the hook path it replaced) landed in PR #277 (lane doctor).\n- read-latency 8.1 holds on a loaded machine ([#501](https://github.com/storytree-ai/storytree/pull/501)) — The read-latency test now checks a full 40 ms timer request for every counted query, no waits while seeding, and a generous elapsed-time lower bound. A stubbed busy baseline reproduced the old false failure at 41 ms delayed versus 1001 ms undelayed. Red and green commits pushed; full local gate and all three platforms in CI and merge queue passed. PR 501 merged.\n- Conduit 4: comments on an article ([#488](https://github.com/storytree-ai/storytree/pull/488)) — Conduit 4, 2026-10-02 (evidence packages/app-setup/evidence/first-build/conduit.md). Fresh sessions built comments: Claude Code 101/101 through the comments area (3 minutes); Codex 100/101 until one follow-up fixed a hidden error list, then 101/101. Codex closes out 'not safe' in a folder without Git; Claude Code 'safe'.\n- Shop 6: orders: what I've bought ([#586](https://github.com/storytree-ai/storytree/pull/586))\n- Retire the flat pine canvas and the tree code only it reaches ([#656](https://github.com/storytree-ai/storytree/pull/656))\n- More sea between islands and bigger land on the globe ([#642](https://github.com/storytree-ai/storytree/pull/642))\n- CI is the one writer of own verified health: the laptop app's update stops recording it ([#223](https://github.com/storytree-ai/storytree/pull/223)) — # increment_10dc2a4c5f78 — close note (PR #223, merged 87000ab7c61934d5a2c47dce95606c2bec4694f5)\n\nBuilt: `refreshOwnHealth` (packages/app/src/updates/build-health.ts) reads the `library` setting first. On Cloud SQL it spawns nothing and logs one line naming CI as the recorder (ADR-0744); local keeps today's behaviour (nothing else writes a member's own local library). Chose \"skip when cloudsql\" over removing the step for that reason.\n\n- red: 2ea1846 (`red(onewriter)`, evidence https://github.com/storytree-ai/storytree/blob/87000ab7c61934d5a2c47dce95606c2bec4694f5/packages/app/evidence/onewriter/red.txt)\n- green: 7ed77d3 (`green(onewriter)`, https://github.com/storytree-ai/storytree/blob/87000ab7c61934d5a2c47dce95606c2bec4694f5/packages/app/evidence/onewriter/green.txt)\n- test-ratio all: `all  44,225  39,205  1.13`\n- pictures: none (nothing on the map changes)\n- library update: https://github.com/storytree-ai/storytree/blob/87000ab7c61934d5a2c47dce95606c2bec4694f5/packages/app/evidence/onewriter/library-update/README.md (contract_b872bebaa9b8 description, definition_35a9bf6d841b as-built; also answers cihealth checklist's open 4.3 item)\n- CI: Linux, macOS, Windows all green first time; automerged.\n- Local: packages/cli 8.5 launcher test red on the Mint box (known box-only failure, untouched code); all else PASS.\n\n\nSupervisor, after merge: patch applied (contract_b872bebaa9b8, definition_35a9bf6d841b) and the cihealth note trimmed to its first sentence.\n\n- CI starts the packaged app before a release publishes ([#634](https://github.com/storytree-ai/storytree/pull/634)) — check-install.mjs (run by release.yml before publish and by CI on installer changes) starts the installed exe with --start-check and a throwaway home; fails on crash, non-zero exit, unhandled rejection (finishStartCheck yields a turn; startsCleanly reads Electron's warning) or 60 s timeout. Red on Windows CI against a planted throw in run() (run 37233641819), green on the merged commit (4.17 PASS Windows x64). Merged through the queue. Nothing published or tagged; the next real release exercises it.\n- Wisps go: a running session tints its island's coast and its claimed territory ([#349](https://github.com/storytree-ai/storytree/pull/349))\n- Lanes roll up their increments and fold under the arc they wait on (ADR-0760) ([#265](https://github.com/storytree-ai/storytree/pull/265)) — ADR-0760 D1 built in packages/arc-surface: queued/ready roll-up, rank, fold of increment waits under the blocker's arc (one parent, cycles cut), view line and chip labels. Contracts 1.6/4.1/4.2 narrowed. Look question raised on the arc; follow-up increment filed for the stale evidence/capture.mjs.\n- Sessions panel: a wide bottom strip that hides and expands like the arcs bar ([#377](https://github.com/storytree-ai/storytree/pull/377))\n- No lost lines, no stuck sessions ([#230](https://github.com/storytree-ai/storytree/pull/230))\n- The app shows its last known state at once while it refreshes ([#239](https://github.com/storytree-ai/storytree/pull/239))\n- storytree's tool server under Codex sees Codex's own CODEX_HOME ([#350](https://github.com/storytree-ai/storytree/pull/350))\n- Add project from the app, with a folder picker ([#236](https://github.com/storytree-ai/storytree/pull/236)) — Built on Mint (lane projfolder, red ac141e1, green d668afc): gear, Projects, Add project opens the native folder picker, sets the folder up (folder name, -2/-3 when taken) and switches to it; an existing project is just selected; the guide names the three ways to add a project. Proven on the laptop with the real Windows dialog (PR #237). Library: app setup 3.3 re-pinned, new 3.4 contract_73d90f30e4f9.\n- The README says only what is true of 0.3 today ([#480](https://github.com/storytree-ai/storytree/pull/480)) — README sections after the opening now say what is true today: Windows x64 with an untested arm64 build; one database per project on local Postgres, Cloud SQL or a Postgres address; storytree own library on Cloud SQL since 2026-09-28; library:export reads only the local library; restore runs restore-library.mjs directly; scripts join a running app; check:own-health also runs on CI; the merge queue; the pnpm run test --flag form; 0.3 developed from 0.3 sessions (ADR-0745). The two script gaps are increment_e6af76c9db5f.\n- Act 2's agents chapter: sessions, arcs, claims on the map ([#628](https://github.com/storytree-ai/storytree/pull/628))\n- Health quick fixes: every story tested, stale red cleared ([#369](https://github.com/storytree-ai/storytree/pull/369))\n- Map: prove the public entry after fixture edges are removed ([#557](https://github.com/storytree-ai/storytree/pull/557)) — PR #557 MERGED at 2026-10-02T22:29:15Z as a43bdd1f5c8a2417170b9861522c976b848ae206, after initial CI 37071340771 and queue 37072035303 passed Linux/macOS/Windows. The existing graph proofs now enter through the public Map module. Mutation red with the graph re-export removed, then restored export and all 9 graph/focus proofs green; production source unchanged. Final commit 47408b66 changes one import path.\n\nActual paired readCodeSurvey, same saved live plan and isolated worktree copies cross-checked with the current-checkout reader: project 829/67611 -> 825/67611 unclaimed/total; Map 4/942 -> 0/942. Only index.ts changes allocation, to Focus selection under existing rules. No coverage/ownership assertion. Foreground gate: typecheck PASS, all 12 affected-scope units PASS, plan edges PASS; guidance NOT RUN because unchanged. Ratio Map0.70, overall0.96.\n\nHealth and graduation queues empty; independent librarian found no decision/guidance curation due. No new friction or owner resteer. Friction drain inspected friction_77636dca291b and retains it open under process_cd52098612cb step1.4 uncertain-stays-open while active #554 performs its supported-runtime replay. No speculative App/Desktop work or false discharge. Report /home/mickh/storytree-lanes/st03-map-followups-report.md. No public-entry implementation residue. Claims/process/tree cleanup and verified close-out follow; only after that, recheck separately assigned increment_7779b253e20d.\n\n- A small wisp travels each reading path with a flowing tail ([#200](https://github.com/storytree-ai/storytree/pull/200))\n- Dev loop: measure story-prefixed numbered proofs ([#529](https://github.com/storytree-ai/storytree/pull/529)) — PR 529 recognizes own-story numbered coverage proofs and excludes foreign prefixes. Real child/source-map regression observed red then green; full local gate and Linux, macOS, Windows CI plus merge queue passed. Survey 5233/66551 to 5233/66554 unclaimed/total. Evidence collection fixed; no remainder reduction claimed.\n- The agent-tools bundle carries or resolves its embedding model dependency ([#487](https://github.com/storytree-ai/storytree/pull/487)) — A build of main on a machine with no desktop app now links the checkout's embedding runtime, so library search through the installed agent tools ranks by meaning; the app's payload already carried its own copy.\n- The agent link's attach tool takes a Claude Code session's own worktree ([#308](https://github.com/storytree-ai/storytree/pull/308)) — attach_workspace now takes a Claude Code session's own linked worktree: ref and name are Codex-only, folder defaults to the session's, description covers both harnesses.\n- Code survey traces imports all the way through ([#421](https://github.com/storytree-ai/storytree/pull/421)) — The survey follows imports transitively, nearest reach first (fewest ordinary imports away, then most tests, then lower number; ADR-0838 D2 has an in-place note). Unclaimed lines, whole repo: 34% -> 12%. Per story before -> after: command line 81->1, world 41->14, arc surface 53->25, dev loop 36->33, app setup 27->18, agent link 23->4, library 19->2, knowledge core 28->1, app 27->27, forest 21->21, process ledger 20->18, website 38->38. Known skew left for the coverage increment: the command line families trace to Front door through families/index.ts.\n- The context bar counts an image at its token cost, not its base64 length ([#273](https://github.com/storytree-ai/storytree/pull/273)) — The context bar counts an image at pixels/750 tokens (max 4,800), measured from real usage; contract 9.8 amended. Busiest session's Grounding 1,021K -> 52K.\n- The kept reading keeps the fold, not every log line ([#437](https://github.com/storytree-ai/storytree/pull/437)) — Landed in PR #437. The agent link's LogFold writes out as a plain snapshot and restores (a restored fold fed the rest reads the same as one fed every line). The page's kept reading now keeps, per piece, the thinned changes and only the one-by-one lines, plus the fold's latest snapshot and the last line it took (IndexedDB storytree.kept-readings version 2, a folds store written in the same transaction as the piece; version 1's pieces are dropped on upgrade, so the first start after the update reads from the start once). Measured on the Mint box with #396's page-memory instrument over the real library's dump: kept store after a first start 22.1 MB (27,211 log lines, 10 records) -> 8.1 MB (940 lines + a 0.54 MB fold, 2 records); records after 10 more ticks 19 -> 2. Next-start time to ready unchanged within noise (1.6-2.1 s -> 1.4-2.2 s) and heap the same (37-39 MB), since #403 already let the kept lines go once folded. The remaining 8 MB is the thinned changes (7.3 MB), out of this increment's scope. The fold (0.54 MB) is rewritten on each tick that brings lines.\n- Arc surface 3.7 (each project remembers its drawer) gets a test that names it ([#410](https://github.com/storytree-ai/storytree/pull/410)) — Arc surface 3.7 is pinned: a test shows each project keeps its own drawer state (open, scope, selected arc), a vanished saved arc falls back to the briefing's pick, and a closed drawer keeps scope and selection.\n- Move storytree's own library to Cloud SQL and connect the Mint box ([#217](https://github.com/storytree-ai/storytree/pull/217))\n- The setup check names an 