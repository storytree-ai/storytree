pull/204)) — # captree: close note for increment_9ca333f00405 (arc_48a2bfc7fdbe, ADR-0743)\n\n**Landed:** PR #204, merged by CI as c0a79ef455218d1ec7a103b821b09e839185c2f8 (Linux, macOS and Windows all passed).\n\n**What was built.** The story panel has an \"Open the capability tree\" button, and the preview under it opens the tree too. The tree opens in its own layer over the forest, beside the panel, which narrows while the tree is open. Drag pans the tree. The wheel or a pinch zooms. There are no scroll bars, the pan is bounded, and the cards never shrink to fit. The tree opens centred on the story's own cards and keeps its place across live redraws. Clicking a card chooses the panel's capability. × or Escape closes the tree.\n\nEvery card has a status strip that names its work state in words (planned grey, in progress amber, landed green, in the arc surface's colours). Each card also has the marks \"the agent reports\" and \"storytree saw\" (ADR-0630).\n\nThe layout is `layoutTree` (dagre, bottom to top, ported from 0.2's `layoutSubdag`) in `packages/forest/src/drill-down/tree-layout.ts`. Another story's capability sits beside the one that builds on it, on a smaller, muted, unclickable card (ADR-0659).\n\n- Red: 7a85134 (4.9 and 4.10 fail) · Green: 93026d0\n- test-ratio \"all\" row: 43,805 test / 38,329 implementation, ratio 1.14\n- Pictures (real `pnpm desktop:smoke` window, restored snapshot 2026-09-28T13-42-19-911Z):\n  - https://github.com/storytree-ai/storytree/blob/c0a79ef455218d1ec7a103b821b09e839185c2f8/packages/forest/evidence/captree/panel.png\n  - https://github.com/storytree-ai/storytree/blob/c0a79ef455218d1ec7a103b821b09e839185c2f8/packages/forest/evidence/captree/tree.png\n  - https://github.com/storytree-ai/storytree/blob/c0a79ef455218d1ec7a103b821b09e839185c2f8/packages/forest/evidence/captree/panned.png\n  - https://github.com/storytree-ai/storytree/blob/c0a79ef455218d1ec7a103b821b09e839185c2f8/packages/forest/evidence/captree/mixed.png (the sta