r the worked line.\n\nHistorical re-home: replacement for increment_4907df8a523c from arc_895e232031b0; original outcome date 2026-09-29.\n- Removing a project frees its folder on this machine ([#362](https://github.com/storytree-ai/storytree/pull/362)) — Removing a project now also frees its folder on this machine: deletes the folder's .storytree.json when it names the project (unless git tracks it: then it is left and named, 'delete it to free the folder'), and forgets this machine's trunk (agent-link forgetTrunk, beside registerTrunk; trunksOn/forgetTrunk exported). Decided against ADR-0757 D4: a freed folder added again is an ordinary new project; the project returns only by a deliberate join (doctor --join); 'adding the folder again brings it back' holds only while a git-tracked marker is kept. The hidden list (removed-projects.json) stays: the picker shows every library project, including ones with no trunk here. For increment_dbea5043ac29 (moved folder): it may assume trunks are forgettable per project+machine (forgetTrunk), that removal is the only thing that forgets one today, and that the hidden list is independent of trunks, so replacing a stale trunk on first sight or re-setup is a forget-then-register with no picker side effect. Follow-up parked: a project joined back on purpose should leave the hidden list.\n- The saved snapshot carries the tour's records and a dated recording ([#510](https://github.com/storytree-ai/storytree/pull/510)) — Saved surveyed land, plan and knowledge records, complete arc questions and a scrubbed 287-line dated recording. Website gate, browser fallbacks and shared geometry checks pass; updated stills reviewed.\n- Roads stay on the glass, and the islands drop away sooner ([#653](https://github.com/storytree-ai/storytree/pull/653))\n- Ranked search's test numbers match the plan's contracts ([#498](https://github.com/storytree-ai/storytree/pull/498)) — Ranked-search tests now name their own contracts: 14.8 for meaning-ranked pl