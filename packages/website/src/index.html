<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Your coding agent builds the software. Storytree shows your project’s plan and the health your agents report.">
    <meta name="theme-color" content="#101418">
    <title>storytree — Software you can watch grow.</title>
    <link rel="canonical" href="https://crisp-globe-bf6v.here.now/">
    <link rel="stylesheet" href="/assets/styles.css">
    <script type="module" src="/assets/main.js"></script>
    <script type="module" src="/assets/forest.js"></script>
  </head>
  <body class="immersive-home">
    <a class="skip-link" href="#main">Skip to content</a>
    <!-- OPENING -->
    <main id="main">
      <section id="chapter2" class="tour-section forest-workspace" data-theme="dark" data-tour-kind="statement" data-fixes-look="beside" aria-labelledby="forest-title">
        <div class="tour-heading"><h1 id="forest-title">storytree<span aria-hidden="true">.</span></h1><button id="opening-replay" type="button" hidden>Replay chapter 1</button></div>
        <p id="tour-note" class="tour-note">storytree’s own project · saved {saved} · read only</p>
        <div id="tour-project" class="tour-project" role="group" aria-label="Project to explore" hidden><span class="tp-label" aria-hidden="true">Project</span><button type="button" data-project="shop" aria-pressed="true">The shop</button><button type="button" data-project="storytree" aria-pressed="false">storytree</button></div>
        <div class="tour-stage">
          <div id="website-forest" data-forest-state="still" aria-label="Storytree’s project map">
            <picture class="forest-still">
              <source media="(max-width: 600px)" srcset="/forest-phone.png">
              <img src="/forest-desktop.png" width="458" height="458" loading="lazy" alt="A saved map of storytree’s project: pale story islands and their connections on a dark globe.">
            </picture>
          </div>
          <div id="tour-tags" class="tour-tags" aria-hidden="true"></div>
          <article id="tour-card" class="tour-card is-in" aria-labelledby="tour-title">
            <p id="tour-kicker" class="tour-kicker">Act 2 · Why storytree</p>
            <h2 id="tour-title" class="tour-title">Storytree builds a map of your project and glues it to your code.</h2>
            <ul id="tour-lines" class="tour-lines">
              <li class="tour-line on"><span class="said">The map grows as your agents work, and says what needs you and what doesn't.</span></li>
            </ul>
            <div id="tour-chips" class="tour-chips"></div>
            <button id="tour-depth" class="tour-depth" type="button" aria-expanded="false" aria-controls="tour-why" hidden>Why it exists</button>
            <div id="tour-why" class="tour-why" hidden></div>
          </article>
        </div>
        <div id="tour-freeplay" class="tour-freeplay" hidden></div>
        <div id="tour-bar" class="tour-bar" role="group" aria-label="Tour controls" hidden>
          <button id="tour-play" class="tb-btn tb-play" type="button" aria-label="Pause the tour"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 3h3v10H4zM9 3h3v10H9z" fill="currentColor"/></svg></button>
          <div class="tb-speed" role="group" aria-label="Tour speed"><button type="button" data-speed="0.75" aria-pressed="false">0.75×</button><button type="button" data-speed="1" aria-pressed="true">1×</button><button type="button" data-speed="1.5" aria-pressed="false">1.5×</button></div>
          <button id="tour-speed-cycle" class="tb-btn tb-speed-cycle" type="button" aria-label="Tour speed 1×, change it">1×</button>
          <div class="tb-where"><ol id="tour-pips" class="tb-pips" aria-label="Tour steps"></ol><span id="tour-label" class="tb-label"></span><span id="tour-held" class="tb-held" hidden></span></div>
          <button id="tour-next" class="tb-btn" type="button">Next <span aria-hidden="true">→</span></button>
          <button id="tour-skip" class="tb-btn" type="button" aria-label="Skip to free play"><span class="lbl-long">Skip to free play</span><svg class="lbl-short" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3l6 5-6 5zM8 3l6 5-6 5z" fill="currentColor"/></svg></button>
          <button id="tour-replay" class="tb-btn" type="button" aria-label="Replay the tour"><span class="lbl-long">Replay</span><svg class="lbl-short" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8a4.5 4.5 0 1 0 1.4-3.3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3 2v3.6h3.6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
          <button id="tour-everything" class="tb-switch" type="button" role="switch" aria-checked="false" aria-label="Show everything"><span class="trk" aria-hidden="true"></span><span class="lbl-long">Show everything</span><span class="lbl-short">All</span></button>
        </div>
        <a id="tour-hatch" class="tour-hatch" href="/waitlist.html">Join the waitlist <span aria-hidden="true">→</span></a>
        <p id="tour-live" class="tour-sr" role="status" aria-live="polite" aria-atomic="true"></p>
      </section>
    </main>
    <!-- COUNTS -->
  </body>
</html>
